<style>
/* 画面：夜のビルの断面（Blender）。かごをスクロールで追い、表示盤・段差メーターはゲームの中で描く。 */

  --amber:#e8a33c; --amber-d:#b97a1e; --warn:#d65a4a; --ok:#4f9a6a;

html,body{margin:0;height:100%;background:var(--night);overflow:hidden}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);font-weight:500;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}

#cv{position:fixed;inset:0;display:block;touch-action:none}

.sheet{position:fixed;left:50%;transform:translateX(-50%);z-index:20;width:min(430px,calc(100% - 24px));box-sizing:border-box;background:var(--card);border-radius:20px;

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;
  font-family:var(--pop);font-weight:800;font-size:1.1rem;background:var(--amber);color:#fff;box-shadow:0 4px 0 var(--amber-d);transition:transform .08s,box-shadow .08s}

<body>
<canvas id="cv" aria-label="ゲーム画面"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>ぴったりエレベーター</h1>
  <p>夜のビル。呼ばれた階に、ブレーキひとつでぴったり止めよう。呼ばれるたびに、エレベーターは速くなる。</p>
  <div class="how">
    <b>出発</b><span>まるいボタンを押すと動きだす</span>
    <b>止める</b><span>もう一度押すとブレーキ。ブレーキは一回きり、止まるまでききつづける</span>
    <b>コツ</b><span>速いほど、止まるまでに長くすべる。早めに押そう</span>
  </div>
  <button class="btn" id="start" type="button">管理室に入る</button>

</section>

<button id="act" type="button" hidden>出発</button>

<section class="sheet" id="result" hidden>
  <div class="cap">6回の段差の平均</div>
  <div class="big" id="rBig">0<small>cm</small></div>
  <div class="rank" id="rRank"></div>
  <div class="stats" id="rStats"></div>
  <div class="note" id="rNote"></div>
  <div class="row"><button class="btn x" id="xBtn" type="button">𝕏 にポスト</button><button class="btn sub" id="imgBtn" type="button">画像で保存</button></div>
  <button class="btn" id="again" type="button">もう一晩</button>
</section>
<div class="toast" id="toast" hidden></div>

<script>
/* ==== KIT：BGM・効果音・保存・シェアの共通部品（各ゲームに埋め込んで使う） ==== */
const KIT = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- 音 ---------- */
  let ctx = null, master, musicBus, sfxBus, verb, muted = store.get("picoruno-mute", false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      // 残響（生成したインパルス応答）
      verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = ir;
      const vg = ctx.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const now = () => (ctx ? ctx.currentTime : 0);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* 1音。f: 周波数, to: 終わりの周波数, t: 開始までの秒, dur: 長さ */
  function tone(o) {
    if (!ensure()) return;
    const { f = 440, to = null, t = 0, dur = 0.2, type = "sine", vol = 0.3, a = 0.005, rel = null, bus = sfxBus, wet = 0.15, lp = null, detune = 0, pan = 0 } = o;
    const s = now() + t, g = ctx.createGain(), osc = ctx.createOscillator();
    osc.type = type; osc.frequency.setValueAtTime(f, s); osc.detune.value = detune;
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.linearRampToValueAtTime(vol, s + a);
    g.gain.exponentialRampToValueAtTime(0.0001, s + (rel || dur));
    let node = osc;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; node.connect(fl); node = fl; }
    node.connect(g);
    let out = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(verb); }
    osc.start(s); osc.stop(s + (rel || dur) + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ensure()) return;
    const { t = 0, dur = 0.2, vol = 0.3, f = 1200, to = null, q = 0.8, type = "bandpass", a = 0.004, bus = sfxBus, wet = 0.1 } = o;
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = now() + t, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, s); fl.Q.value = q;
    if (to) fl.frequency.exponentialRampToValueAtTime(to, s + dur);
    g.gain.setValueAtTime(0.0001, s); g.gain.linearRampToValueAtTime(vol, s + a); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    src.connect(fl); fl.connect(g); g.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
    src.start(s, Math.random()); src.stop(s + dur + 0.05);
  }

  /* 楽器 */
  const inst = {
    epiano(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 1.6, vol: v, type: "sine", bus: musicBus, wet: 0.25, a: 0.004 }); tone({ f: f * 2, t, dur: 0.5, vol: v * 0.35, type: "sine", bus: musicBus, wet: 0.2 }); tone({ f: f * 3.01, t, dur: 0.18, vol: v * 0.12, type: "sine", bus: musicBus, wet: 0.1 }); },
    bell(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 2.2, vol: v, bus: musicBus, wet: 0.35 }); tone({ f: f * 3.98, t, dur: 0.35, vol: v * 0.25, bus: musicBus, wet: 0.35 }); },
    marimba(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: 0.45, vol: v, bus: musicBus, wet: 0.2 }); tone({ f: f * 4, t, dur: 0.07, vol: v * 0.3, bus: musicBus, wet: 0.1 }); },
    pluck(m, t, d, v) { tone({ f: mtof(m), t, dur: Math.min(0.6, d * 1.2), vol: v, type: "triangle", lp: 2400, bus: musicBus, wet: 0.25 }); },
    flute(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.95, vol: v * 0.8, type: "sine", a: 0.06, bus: musicBus, wet: 0.4 }); tone({ f: mtof(m) * 2, t, dur: d * 0.9, vol: v * 0.08, type: "triangle", a: 0.08, bus: musicBus, wet: 0.4 }); },
    chip(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.45, type: "square", lp: 3000, bus: musicBus, wet: 0.08 }); },
    pad(m, t, d, v) { const f = mtof(m); for (const dt of [-7, 7]) tone({ f, t, dur: d, vol: v * 0.5, type: "sawtooth", a: d * 0.35, lp: 900, detune: dt, bus: musicBus, wet: 0.5 }); },
    koto(m, t, d, v) { const f = mtof(m); tone({ f, to: f * 0.995, t, dur: 0.9, vol: v, type: "triangle", lp: 3200, a: 0.002, bus: musicBus, wet: 0.35 }); tone({ f: f * 2, t, dur: 0.25, vol: v * 0.3, type: "sine", bus: musicBus, wet: 0.2 }); },
    bass(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v, type: "triangle", lp: 600, bus: musicBus, wet: 0 }); tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.6, type: "sine", bus: musicBus, wet: 0 }); },
    kick(t, v) { tone({ f: 130, to: 42, t, dur: 0.28, vol: v, type: "sine", bus: musicBus, wet: 0 }); },
    snare(t, v) { noise({ t, dur: 0.16, vol: v * 0.6, f: 1900, q: 0.7, bus: musicBus, wet: 0.2 }); },
    hat(t, v) { noise({ t, dur: 0.04, vol: v * 0.35, f: 8000, type: "highpass", bus: musicBus, wet: 0 }); },
    shaker(t, v) { noise({ t, dur: 0.07, vol: v * 0.25, f: 6000, q: 2, bus: musicBus, wet: 0.05 }); }
  };

  /* ---------- BGM（シード付きの自動作曲。4小節のフレーズをくりかえす） ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  let song = null, timer = null, nextT = 0, step = 0;
  /* opts: {bpm, key(midi), chords:[[度数...]...], lead, chord, beat:"lofi"|"waltz"|"none"|"chip"|"shaker", seed, scale:[...], swing, leadVol, density} */
  function musicStart(opts) {
    if (!ensure()) return;
    musicStop();
    const r = rng(opts.seed || 7);
    const scale = opts.scale || [0, 2, 4, 7, 9];      // ペンタトニック
    const beats = opts.beat === "waltz" ? 3 : 4;
    const steps = beats * 4;                           // 16分音符
    // 4小節ぶんのメロディを作る（2小節目と4小節目は少し変える）
    const motif = [];
    for (let bar = 0; bar < 4; bar++) {
      const line = [];
      let deg = Math.floor(r() * scale.length);
      for (let s = 0; s < steps; s++) {
        const strong = s % 4 === 0;
        if (r() < (strong ? 0.62 : 0.2) * (opts.density || 1)) {
          deg = Math.max(0, Math.min(scale.length * 2 - 1, deg + Math.floor(r() * 5) - 2));
          const len = strong && r() < 0.5 ? 4 : 2;
          line.push({ s, deg, len });
        }
      }
      motif.push(line);
    }
    motif[2] = motif[0].map(n => ({ ...n }));          // 3小節目は1小節目のくりかえし
    song = { ...opts, beats, steps, motif, scale };
    nextT = now() + 0.1; step = 0;
    timer = setInterval(schedule, 40);
  }
  function schedule() {
    if (!song || !ctx) return;
    const spb = 60 / song.bpm, sixteenth = spb / 4;
    while (nextT < now() + 0.25) {
      const bar = Math.floor(step / song.steps), s = step % song.steps;
      const chordDegs = song.chords[bar % song.chords.length];
      const key = song.key || 60;
      const sw = (s % 2 === 1) ? (song.swing || 0) * sixteenth : 0;
      const t = nextT + sw - now();
      // コード
      if (s === 0) chordDegs.forEach((d, i) => (inst[song.chord || "epiano"])(key + d, t + i * 0.012, spb * song.beats * 0.9, (song.chordVol || 0.08)));
      if (song.beat === "waltz" && (s === 4 || s === 8)) chordDegs.slice(1).forEach(d => inst[song.chord || "epiano"](key + d, t, spb * 0.8, (song.chordVol || 0.08) * 0.6));
      // ベース
      if (song.bassOn !== false) {
        if (s === 0) inst.bass(key - 24 + chordDegs[0], t, spb * 1.8, 0.22);
        if (song.beat !== "waltz" && s === 8) inst.bass(key - 24 + chordDegs[0] + (bar % 2 ? 7 : 0), t, spb * 1.6, 0.18);
      }
      // リズム
      const bt = song.beat || "lofi";
      if (bt === "lofi") { if (s === 0 || s === 10) inst.kick(t, 0.38); if (s === 4 || s === 12) inst.snare(t, 0.25); if (s % 2 === 0) inst.hat(t, s % 4 === 2 ? 0.5 : 0.3); }
      else if (bt === "chip") { if (s % 4 === 0) inst.kick(t, 0.3); if (s === 4 || s === 12) inst.snare(t, 0.2); if (s % 2 === 1) inst.hat(t, 0.3); }
      else if (bt === "waltz") { if (s === 0) inst.kick(t, 0.25); if (s === 4 || s === 8) inst.shaker(t, 0.6); }
      else if (bt === "shaker") { if (s % 2 === 0) inst.shaker(t, s % 4 === 0 ? 0.7 : 0.4); if (s === 0) inst.kick(t, 0.2); }
      // メロディ
      if (song.lead) {
        const line = song.motif[bar % 4];
        for (const n of line) if (n.s === s) {
          const oct = Math.floor(n.deg / song.scale.length), d = song.scale[n.deg % song.scale.length];
          inst[song.lead](key + 12 + oct * 12 + d, t, sixteenth * n.len, song.leadVol || 0.1);
        }
      }
      nextT += sixteenth; step++;
    }
  }
  function musicStop() { if (timer) clearInterval(timer); timer = null; song = null; }
  function setMuted(m) {
    muted = m; store.set("picoruno-mute", m);
    if (master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
  }

  /* ---------- そのほか ---------- */
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function tweet(text, url) {
    const u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + (url ? "&url=" + encodeURIComponent(url) : "");
    window.open(u, "_blank", "noopener");
  }
  async function shareImage(canvas, name, text) {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], name, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return "shared"; }
    } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return "downloaded";
  }
  function loadImages(map) {
    const out = {};
    return Promise.all(Object.entries(map).map(([k, src]) => new Promise(res => {
      const im = new Image(); im.onload = () => { out[k] = im; res(); }; im.onerror = () => { out[k] = null; res(); }; im.src = src;
    }))).then(() => out);
  }

  /* 遊んだ回数を数える（トップページの ▶ 回数）。同じタブでの再読みこみは1回だけ。 */
  function countPlay(G) {
    const K = "picoruno-played:" + G;
    try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, "1"); } catch (e) {}
    const KEY = "sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
    fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play", { method: "POST", keepalive: true,
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ g: G }) })

const cv = $("cv"), cx = cv.getContext("2d");
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  fit = Math.min(Math.max(vw / W, vh / 1150), vh / 700);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
}
window.addEventListener("resize", resize);
function view() { const lw = vw / fit, lh = vh / fit; return { lw, lh, ox: (lw - W) / 2, oy: clamp(lh * 0.5 - S.camY, lh - BH, 0) }; }

/* 横の夜景（広い画面のすきま） */
const CITY = [];
(function () { const r = KIT.rng(3); for (let i = 0; i < 260; i++) CITY.push({ x: r(), y: r(), w: 3 + r() * 6, h: 3 + r() * 5, c: r() < 0.6 ? "#ffd48a" : r() < 0.5 ? "#bcd4ff" : "#ff9a6a", a: 0.25 + r() * 0.6 }); })();

function render() {
  const v = view();
  cx.setTransform(dpr * fit, 0, 0, dpr * fit, 0, 0);
  cx.fillStyle = "#0d1020"; cx.fillRect(0, 0, v.lw, v.lh);
  cx.translate(v.ox, v.oy + (S.shake ? Math.sin(S.t * 70) * S.shake * 4 : 0));
  if (v.lw > W + 1) drawCity(cx, v);
  drawScene(cx, S.t);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (S.state === "play") drawHud();
}
function drawCity(g, v) {
  g.save();
  const gr = g.createLinearGradient(0, -v.oy, 0, -v.oy + v.lh); gr.addColorStop(0, "#0b0f22"); gr.addColorStop(1, "#1b1730");
  g.fillStyle = gr; g.fillRect(-v.ox, -v.oy, v.lw, v.lh);
  for (const c of CITY) {
    const side = c.x < 0.5 ? -1 : 1, x = side < 0 ? -v.ox + c.x * 2 * v.ox * 0.95 : W + (c.x - 0.5) * 2 * v.ox * 0.95;
    const y = c.y * BH;
    g.globalAlpha = c.a * (0.85 + 0.15 * Math.sin(S.t * 0.7 + c.x * 50)); g.fillStyle = c.c; g.fillRect(x, y, c.w, c.h);
  }
  g.globalAlpha = 1; g.restore();
}
function drawScene(g, t) {
  if (IMG.bldg) g.drawImage(IMG.bldg, 0, 0, W, BH);
  // ケーブル
  const carTop = yOf(S.p + 34) - CAR_H * (1 - CAR_FLOOR);
  g.strokeStyle = "rgba(20,20,24,.9)"; g.lineWidth = 1.6;
  for (const dx of [-6, 6]) { g.beginPath(); g.moveTo(W / 2 + dx, yOf(TOP + FH + 40)); g.lineTo(W / 2 + dx, carTop + 4); g.stroke(); }
  // かご
  if (IMG.car) {
    const y = yOf(S.p + 34) - CAR_H * (1 - CAR_FLOOR);
    g.drawImage(IMG.car, W / 2 - CAR_W / 2, y, CAR_W, CAR_H);
    // 扉：閉まっているときは左右からステンレスの扉
    const d = 1 - S.door, dw = (CAR_W - 60 * PXCM) / 2 * d;
    if (dw > 0.5) {
      const top = y + 30 * PXCM, h = CAR_H - 30 * PXCM - CAR_H * CAR_FLOOR + 10 * PXCM, l = W / 2 - (CAR_W - 60 * PXCM) / 2;
      const gr = g.createLinearGradient(l, 0, l + CAR_W, 0);
      gr.addColorStop(0, "#9ea3ab"); gr.addColorStop(0.5, "#d9dce1"); gr.addColorStop(1, "#8d9299");
      g.fillStyle = gr; g.fillRect(l, top, dw, h); g.fillRect(W / 2 + (CAR_W - 60 * PXCM) / 2 - dw, top, dw, h);
      g.strokeStyle = "rgba(40,40,50,.6)"; g.lineWidth = 1; g.strokeRect(l, top, dw, h); g.strokeRect(W / 2 + (CAR_W - 60 * PXCM) / 2 - dw, top, dw, h);
    }
  }
  // 呼ばれている階のランプ
  if (S.state === "play") {
    const y = yOf(S.to * FH + 34);
    const al = 0.55 + 0.45 * Math.sin(t * 6);
    g.save(); g.globalAlpha = al;
    g.fillStyle = "#ffc457"; g.shadowColor = "#ffb030"; g.shadowBlur = 18;
    g.beginPath(); g.moveTo(W / 2 + CAR_W / 2 + 18, y - 4); g.lineTo(W / 2 + CAR_W / 2 + 34, y - 14); g.lineTo(W / 2 + CAR_W / 2 + 34, y + 6); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(W / 2 - CAR_W / 2 - 18, y - 4); g.lineTo(W / 2 - CAR_W / 2 - 34, y - 14); g.lineTo(W / 2 - CAR_W / 2 - 34, y + 6); g.closePath(); g.fill();
    g.restore();
    // 床の線（ぴったりの目安）
    g.strokeStyle = "rgba(255,196,87,.5)"; g.setLineDash([6, 6]); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(W / 2 - CAR_W / 2 - 40, y); g.lineTo(W / 2 + CAR_W / 2 + 40, y); g.stroke(); g.setLineDash([]);
  }
}
/* 表示盤（階数）と段差メーター */
function drawHud() {
  const g = cx, sf = KIT.safe(), top = 12 + sf.top;
  g.save();
  // 階数表示：エレベーターの表示盤ふう
  const w = 220, x = 12;
  g.fillStyle = "rgba(10,10,14,.82)"; rr(g, x, top, w, 70, 14); g.fill();
  g.strokeStyle = "rgba(201,204,210,.6)"; g.lineWidth = 2; rr(g, x, top, w, 70, 14); g.stroke();
  const fl = clamp(Math.round(S.p / FH), 0, NF - 1) + 1;
  g.fillStyle = "#ffb347"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.textBaseline = "middle"; g.textAlign = "center";
  g.fillText(String(fl), x + 72, top + 37);
  // 向きの矢印
  if (Math.abs(S.v) > 5) { g.beginPath(); const ay = top + 35, s = S.dir; g.moveTo(x + 26, ay + 8 * s); g.lineTo(x + 36, ay - 8 * s); g.lineTo(x + 46, ay + 8 * s); g.closePath(); g.fill(); }
  g.fillStyle = "#fff"; g.font = '700 13px "Zen Maru Gothic",sans-serif'; g.textAlign = "left";
  g.fillText(`呼び出し ${S.i + 1}/${CALLS}`, x + 112, top + 22);
  g.font = '800 22px "M PLUS Rounded 1c",sans-serif'; g.fillStyle = "#ffd28a";
  g.fillText(`${S.to + 1}階へ`, x + 112, top + 48);
  // 速さ
  g.fillStyle = "rgba(255,255,255,.75)"; g.font = '700 12px "Zen Maru Gothic",sans-serif'; g.textAlign = "right";
  g.fillText(`${(Math.abs(S.v) / 100 * 60).toFixed(0)} m/分`, x + w - 10, top + 62);
  // 段差メーター（止まったあと）
  if (S.phase === "stopped" || S.phase === "door") {
    const err = S.errs[S.errs.length - 1], mw = 150, mh = 96, mx = vw - mw - 12, my = top + 54;
    g.fillStyle = "rgba(251,250,247,.95)"; rr(g, mx, my, mw, mh, 14); g.fill();
    // 乗り場の床と、かごの床
    const off = clamp(err * 3, -34, 34);
    g.fillStyle = "#8c6f55"; g.fillRect(mx + 10, my + 52, mw / 2 - 10, 10);
    g.fillStyle = "#9ea3ab"; g.fillRect(mx + mw / 2, my + 52 - off, mw / 2 - 10, 10);
    g.strokeStyle = "#2f3140"; g.lineWidth = 1; g.strokeRect(mx + 10, my + 52, mw / 2 - 10, 10); g.strokeRect(mx + mw / 2, my + 52 - off, mw / 2 - 10, 10);
    g.fillStyle = "#787a88"; g.font = '700 11px "Zen Maru Gothic",sans-serif'; g.textAlign = "left"; g.fillText("乗り場", mx + 12, my + 76); g.textAlign = "right"; g.fillText("かご", mx + mw - 12, my + 76);
    g.textAlign = "center"; g.fillStyle = Math.abs(err) < 2 ? "#4f9a6a" : Math.abs(err) < 10 ? "#2f3140" : "#d65a4a";
    g.font = '800 18px "M PLUS Rounded 1c",sans-serif'; g.fillText(`段差 ${Math.abs(err).toFixed(1)}cm`, mx + mw / 2, my + 22);
  }
  if (S.msg && S.t - S.msg.at < S.msg.dur) {
    const al = clamp((S.msg.dur - (S.t - S.msg.at)) / 0.3, 0, 1);
    g.globalAlpha = al; g.font = '700 18px "Zen Maru Gothic",sans-serif'; g.textAlign = "center";
    const tw = g.measureText(S.msg.text).width + 40, y = top + 160;
    g.fillStyle = S.msg.warn ? "rgba(190,70,60,.92)" : "rgba(13,16,32,.88)"; rr(g, vw / 2 - tw / 2, y, tw, 42, 21); g.fill();
    g.fillStyle = "#fff"; g.fillText(S.msg.text, vw / 2, y + 22);
    g.globalAlpha = 1;
  }
  g.restore();
}
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function say(text, dur = 1.6, warn = false) { S.msg = { text, at: S.t, dur, warn }; }

/* ---------- 音 ---------- */
let motor = null;
function motorInit() {
  const ac = KIT.ensure(); if (!ac || motor) return;
  const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = 40;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
  const g = ac.createGain(); g.gain.value = 0;
  o.connect(lp); lp.connect(g); g.connect(KIT.bus()); o.start();
  const src = ac.createBufferSource(); src.buffer = KIT.noiseBuffer(); src.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 600; bp.Q.value = 0.7;
  const ng = ac.createGain(); ng.gain.value = 0;
  src.connect(bp); bp.connect(ng); ng.connect(KIT.bus()); src.start();
  const sq = ac.createBufferSource(); sq.buffer = KIT.noiseBuffer(); sq.loop = true;
  const sb = ac.createBiquadFilter(); sb.type = "bandpass"; sb.frequency.value = 3200; sb.Q.value = 9;
  const sg = ac.createGain(); sg.gain.value = 0;
  sq.connect(sb); sb.connect(sg); sg.connect(KIT.bus()); sq.start();
  motor = { o, g, ng, bp, sg, sb };
}
function motorUpdate() {
  if (!motor) return;
  const ac = KIT.ensure(), now = ac.currentTime, s = Math.abs(S.v) / 500;
  motor.o.frequency.setTargetAtTime(38 + s * 60, now, 0.08);
  motor.g.gain.setTargetAtTime(S.state === "play" ? 0.015 + s * 0.05 : 0, now, 0.1);
  motor.ng.gain.setTargetAtTime(S.state === "play" ? s * 0.05 : 0, now, 0.1);
  motor.bp.frequency.setTargetAtTime(400 + s * 900, now, 0.1);
  motor.sg.gain.setTargetAtTime(S.phase === "brake" ? 0.012 + s * 0.03 : 0, now, 0.05);
  motor.sb.frequency.setTargetAtTime(2600 + s * 1500, now, 0.1);
}
function chime(ok) {   // 到着のチャイム（ポーン）
  const f = ok ? [76, 72] : [72, 69];
  f.forEach((m, i) => { KIT.tone({ f: KIT.mtof(m), t: KIT.ensure().currentTime + i * 0.32, dur: 1.2, vol: 0.09, type: "sine", wet: 0.3 }); KIT.tone({ f: KIT.mtof(m) * 3, t: KIT.ensure().currentTime + i * 0.32, dur: 0.4, vol: 0.02, type: "sine", wet: 0.3 }); });
}
function tick() { KIT.tone({ f: 1800, dur: 0.025, vol: 0.025, type: "square", lp: 3000, wet: 0 }); }

/* ---------- 入力：ボタン・画面タップ・スペース ---------- */
function press() {
  if (S.state !== "play") return;
  KIT.ensure(); motorInit();
  if (S.phase === "wait") go();
  else if (S.phase === "run") brake();
}
$("act").addEventListener("pointerdown", e => { e.preventDefault(); press(); });
cv.addEventListener("pointerdown", () => press());
window.addEventListener("keydown", e => { if (e.code === "Space" || e.code === "Enter") { if (S.state === "play") { e.preventDefault(); press(); } } });

/* ---------- 進行 ---------- */
let last = performance.now();
function frame(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(frame); }
function update(dt) {
  S.t += dt;
  if (S.state === "play") {
    const n = 4, h = dt / n;
    for (let k = 0; k < n; k++) {
      if (S.phase === "run") S.v = Math.min(VMAX[S.i], Math.abs(S.v) + ACC * h) * S.dir;
      else if (S.phase === "brake") { const sp = Math.max(0, Math.abs(S.v) - BRAKE * h); S.v = sp * S.dir; if (sp === 0) { stop(); break; } }
      S.p += S.v * h;
      if (S.p < 0 || S.p > TOP) { S.p = clamp(S.p, 0, TOP); emergency(); break; }
    }
    // 通りすぎた階で小さな音
    const fl = Math.floor(S.p / FH + 0.5);
    if (fl !== S.passed) { S.passed = fl; if (S.phase === "run" || S.phase === "brake") tick(); }
  }
  S.door = lerp(S.door, S.phase === "door" ? 1 : 0, 1 - Math.pow(0.02, dt));
  S.shake = Math.max(0, S.shake - dt * 2);
  // カメラはかごを追う（少しおくれて）
  const target = yOf(S.p + 34) - CAR_H * 0.35;
  S.camY = lerp(S.camY, target, 1 - Math.pow(0.004, dt));
  motorUpdate();
}
function go() {
  S.phase = "run"; S.dir = S.to > S.from ? 1 : -1;
  $("act").textContent = "ブレーキ"; $("act").classList.add("on");
  KIT.tone({ f: 660, dur: 0.06, vol: 0.05, type: "triangle", wet: 0.1 });
}
function brake() {
  S.phase = "brake"; $("act").classList.remove("on"); $("act").textContent = "…";
  KIT.noise({ dur: 0.2, vol: 0.05, f: 2800, q: 6, wet: 0.05 });
  KIT.vibrate(15);
}
function stop() {
  const err = S.p - S.to * FH;
  S.errs.push(err); S.phase = "stopped";
  const a = Math.abs(err);
  if (a < 1) say("ぴったり！", 1.6); else if (a < 5) say("おしい！", 1.4); else if (a < 30) say(err > 0 ? "行きすぎ" : "手前で止まった", 1.4, a > 15); else say(err > 0 ? "通りすぎた！" : "ぜんぜん足りない！", 1.6, true);
  chime(a < 5);
  setTimeout(() => { S.phase = "door"; KIT.noise({ dur: 0.6, vol: 0.03, f: 900, q: 0.8, wet: 0.1 }); }, 450);
  setTimeout(next, 2300);
}
function emergency() {
  S.v = 0; S.shake = 1; S.phase = "stopped";
  const err = S.p - S.to * FH;
  S.errs.push(Math.sign(err || 1) * Math.max(150, Math.abs(err)));
  say("非常停止！", 1.8, true);
  KIT.noise({ dur: 0.4, vol: 0.12, f: 300, q: 0.8, type: "lowpass", wet: 0.1 }); KIT.vibrate([60, 40, 60]);
  setTimeout(next, 2300);
}
function next() {
  if (S.state !== "play") return;
  S.i++;
  if (S.i >= CALLS) { finish(); return; }
  call();
}
function call() {
  S.from = Math.round(S.p / FH); S.p = S.from * FH + (S.p - S.from * FH);   // ずれたまま次へ
  let to;
  do { to = Math.floor(Math.random() * NF); } while (Math.abs(to - S.from) < 3);
  S.to = to; S.v = 0; S.phase = "wait";
  $("act").textContent = "出発"; $("act").classList.remove("on"); $("act").hidden = false;
  say(`${to + 1}階でお呼びです`, 1.6);
  KIT.tone({ f: KIT.mtof(84), dur: 0.15, vol: 0.04, type: "sine", wet: 0.2 });
}
function startGame() {
  KIT.ensure(); motorInit();
  $("title").hidden = true; $("result").hidden = true;
  S.state = "play"; S.i = 0; S.errs = []; S.p = 0; S.v = 0; S.passed = 0; S.camY = yOf(34) - CAR_H * 0.35;
  call();
  startMusic(false); KIT.countPlay(GAME_TITLE);
}
const RANKS = [[1, "ぴったり職人"], [3, "ベテラン運転士"], [8, "ふつうのエレベーター"], [20, "ちょっと段差"], [50, "つまずく人続出"], [1e9, "階段のほうが早い"]];
function finish() {
  S.state = "result"; S.phase = "door"; $("act").hidden = true;
  const abs = S.errs.map(Math.abs), avg = abs.reduce((a, b) => a + b, 0) / abs.length;
  const perfect = abs.filter(a => a < 1).length, worst = Math.max(...abs);
  const rank = RANKS.find(r => avg < r[0])[1];
  S.res = { avg, perfect, worst, rank };
  $("rBig").innerHTML = `${avg.toFixed(1)}<small>cm</small>`;
  $("rRank").textContent = rank;
  $("rStats").innerHTML = `<div class="stat${perfect ? " good" : ""}"><small>ぴったり（1cm未満）</small><b>${perfect}回</b></div>`
    + `<div class="stat${worst > 30 ? " ng" : ""}"><small>いちばんずれた</small><b>${worst.toFixed(0)}cm</b></div>`
    + `<div class="stat"><small>最高速度</small><b>${(VMAX[CALLS - 1] / 100 * 60).toFixed(0)}m/分</b></div>`;
  const best = KIT.store.get("elevator-best", null);
  if (best === null || avg < best) KIT.store.set("elevator-best", avg);
  $("rNote").textContent = best === null || avg < best ? "自己ベスト更新！" : `自己ベスト ${best.toFixed(1)}cm`;
  $("result").hidden = false;
  chime(avg < 8);
  KIT.music.stop(); setTimeout(() => startMusic(true), 900);
}
function shareText() { const r = S.res; return `ぴったりエレベーター、6回の段差の平均 ${r.avg.toFixed(1)}cm（ぴったり ${r.perfect}回）\nわたしは「${r.rank}」\n#ぴったりエレベーター`; }
function shareCanvas() {
  const c = document.createElement("canvas"); c.width = 1200; c.height = 630;
  const g = c.getContext("2d");
  g.fillStyle = "#0d1020"; g.fillRect(0, 0, 600, 630);
  const sc = 630 / 560;
  g.save(); g.beginPath(); g.rect(0, 0, 600, 630); g.clip();
  g.translate(300, 315); g.scale(sc, sc); g.translate(-W / 2, -(yOf(S.p + 34) - CAR_H * 0.4));
  drawScene(g, S.t); g.restore();
  g.fillStyle = "#fbfaf7"; g.fillRect(600, 0, 600, 630);
  g.fillStyle = "#e8a33c"; g.fillRect(600, 0, 10, 630);
  g.textAlign = "left";
  g.fillStyle = "#2f3140"; g.font = '800 38px "M PLUS Rounded 1c",sans-serif'; g.fillText("ぴったりエレベーター", 650, 92);
  g.fillStyle = "#787a88"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText("6回の段差の平均", 650, 170);
  g.fillStyle = "#b97a1e"; g.font = '800 96px "M PLUS Rounded 1c",sans-serif';
  const t = S.res.avg.toFixed(1); g.fillText(t, 650, 274);
  const tw = g.measureText(t).width; g.font = '800 34px "M PLUS Rounded 1c",sans-serif'; g.fillText("cm", 660 + tw, 274);
  g.fillStyle = "#2f3140"; g.font = '800 38px "M PLUS Rounded 1c",sans-serif'; g.fillText(S.res.rank, 650, 350);
  // 6回の段差（棒）
  S.errs.forEach((e, i) => {
    const x = 660 + i * 76, base = 470, hgt = clamp(e, -60, 60);
    g.fillStyle = "#e3e2dc"; g.fillRect(x - 4, base - 1, 56, 2);
    g.fillStyle = Math.abs(e) < 1 ? "#4f9a6a" : Math.abs(e) < 10 ? "#e8a33c" : "#d65a4a";
    g.fillRect(x + 8, Math.min(base, base - hgt), 32, Math.max(3, Math.abs(hgt)));
    g.fillStyle = "#787a88"; g.font = '700 18px "Zen Maru Gothic",sans-serif'; g.textAlign = "center"; g.fillText(`${Math.abs(e).toFixed(1)}`, x + 24, 560);
    g.textAlign = "left";
  });
  g.fillStyle = "#787a88"; g.font = '700 20px "Zen Maru Gothic",sans-serif'; g.fillText("#ぴったりエレベーター ・ picoruno.", 650, 605);
  return c;
}
function startMusic(calm) {
  // エレベーターの中の音楽：やわらかいボサノバふう
  KIT.music.start(calm
    ? { bpm: 76, key: 62, chords: [[0, 4, 7, 11], [5, 9, 12, 16], [2, 5, 9, 12], [7, 11, 14, 17]], lead: "epiano", chord: "pad", beat: "none", seed: 9, leadVol: 0.06, chordVol: 0.05, density: 0.45 }
    : { bpm: 104, key: 62, chords: [[0, 4, 7, 11], [9, 12, 16, 19], [2, 5, 9, 12], [7, 11, 14, 17]], lead: "marimba", chord: "epiano", beat: "shaker", seed: 64, leadVol: 0.06, chordVol: 0.05, density: 0.55, swing: 0.15 });
}

/* ---------- ボタン ---------- */
$("start").addEventListener("click", startGame);
$("again").addEventListener("click", startGame);
$("xBtn").addEventListener("click", () => KIT.tweet(shareText(), GAME_URL));
$("imgBtn").addEventListener("click", async () => { const r = await KIT.shareImage(shareCanvas(), "elevator.png", shareText()); if (r === "downloaded") toast("画像を保存しました"); });
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => t.hidden = true, 1800); }
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
