<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つくった人 | picoruno.</title>
<meta name="description" content="picoruno.を作っている、個人ゲーム開発者ルノコッコのプロフィールです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  --cream:#fff9e8; --ink:#4a3428; --sub:#8a6f60; --yellow:#ffe27a; --mint:#aeeedc; --sky:#a9dcff; --coral:#ff8f7e; --pink:#ffb6cf;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  color:var(--ink);background:var(--cream);line-height:1.8;min-height:100vh;
  background-image:radial-gradient(rgba(74,52,40,.08) 1.5px,transparent 1.5px);background-size:22px 22px;
}
header{
  position:sticky;top:12px;z-index:10;margin:14px auto 0;width:min(780px,92%);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 20px;border-radius:999px;background:#fff;
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
}
.logo{font-weight:800;font-size:1.2rem;letter-spacing:.04em;color:var(--ink);text-decoration:none}
header a.back{color:var(--ink);text-decoration:none;font-weight:800;font-size:.9rem;padding:4px 12px;border-radius:999px;background:var(--yellow);border:2.5px solid var(--ink)}
header a.back:hover{background:var(--mint)}
article{
  width:min(780px,92%);margin:44px auto 80px;padding:40px 44px;border-radius:28px;
  background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
}
h1{font-size:1.9rem;font-weight:800;margin-bottom:10px;line-height:1.4;display:inline-block;
  background:linear-gradient(transparent 62%,var(--yellow) 62%);padding:0 4px}
.lead{color:var(--ink);font-weight:500;margin-bottom:18px}
h2{font-size:1.05rem;font-weight:800;margin:30px 0 10px;display:inline-block;padding:4px 14px;border-radius:999px;
  background:var(--mint);border:2.5px solid var(--ink);color:var(--ink)}
p,li{color:var(--ink);font-size:.97rem}
p{margin:0 0 8px}
ul{padding-left:1.3em}
.meta{font-size:.85rem;color:var(--sub);margin-top:36px;padding-top:18px;border-top:3px dotted var(--ink)}
.avatar-s{width:124px;height:124px;border-radius:50%;display:block;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);margin-bottom:18px;background:var(--pink)}
.role{display:inline-block;font-size:.85rem;font-weight:800;color:var(--ink);background:var(--pink);border:2.5px solid var(--ink);border-radius:999px;padding:2px 14px;margin-bottom:8px;transform:rotate(-2deg)}
.cheer{margin-top:22px;padding-top:16px;border-top:2px dashed rgba(74,52,40,.22);display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}
.cheer p{margin:0;font-size:.85rem;color:var(--sub)}
.cheer a{display:inline-flex;align-items:center;font-size:.82rem;font-weight:800;color:var(--ink);text-decoration:none;
  padding:3px 14px;border:2px solid var(--ink);border-radius:999px;background:#fff;transition:background .2s,transform .2s}
.cheer a:hover{background:var(--pink);transform:rotate(-3deg)}
@media (max-width:560px){article{padding:28px 22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
