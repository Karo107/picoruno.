<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<title>1秒だけ見ていい</title>
<meta name="description" content="絵が見えるのは、たった1秒。消えたあとに「何こあった？」「何いろだった？」と聞かれる記憶ゲーム。毎日5問、結果は「あなたの目は〇〇レベル」と診断されます。">
<meta property="og:type" content="website">
<meta property="og:title" content="1秒だけ見ていい">
<meta property="og:description" content="見えるのは1秒だけ。あなたの目は何レベル？毎日5問の記憶ゲーム。">
<meta property="og:url" content="https://runococco.github.io/picoruno./ichibyou.html">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://runococco.github.io/picoruno./og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://runococco.github.io/picoruno./og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7f2e8'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='8' fill='%23fffdf8' stroke='%235b4d45' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%235b4d45'/%3E%3Ccircle cx='17.6' cy='14.4' r='1.4' fill='%23fffdf8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one column that fits a phone. Title → play (a square "photo" that shows for 1 second, then a question with 4 choices) → result card made for screenshots. Soft muted palette shared with the picoruno icon style. */
:root{
  --bg:#f7f2e8;
  --card:#fffdf8;
  --ink:#5b4d45;
  --sub:#8e8077;
  --line:#e6ddcf;
  --accent:#d9706a;
  --ok:#7fae73;
  --ng:#d9706a;
  --gold:#e3c26b;
  --btn1:#e8877f;      /* メインのボタン：くすみコーラル */
  --btn2:#fbe9b7;      /* サブのボタン：たまご色 */
  --btn3:#cfe3ef;      /* 共有まわり：みずいろ */
  --pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --box:clamp(220px,min(calc(100vw - 32px),calc(100svh - 330px)),420px);
  color-scheme:light;
}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.wrap{max-width:460px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));box-sizing:border-box;min-height:100svh;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;align-items:center;flex:1}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:3px solid var(--ink);border-radius:20px;cursor:pointer;
  font-family:var(--pop);font-size:1.05rem;padding:12px 20px;min-height:56px;box-sizing:border-box;width:100%;
  background:var(--btn1);color:#fff;text-shadow:0 2px 0 rgba(91,77,69,.35);box-shadow:4px 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.light{background:var(--btn2);color:var(--ink);text-shadow:none}
.btn.sky{background:var(--btn3);color:var(--ink);text-shadow:none}
.btn.plain{background:var(--card);color:var(--ink);text-shadow:none;font-size:.95rem;min-height:48px}
.btn .bi{width:26px;height:26px;flex:none}
.btn small{font-family:var(--body);font-size:.78rem;font-weight:700;background:rgba(255,255,255,.35);border-radius:999px;padding:2px 9px;text-shadow:none}
.btn.light small,.btn.sky small{background:rgba(255,255,255,.7)}
.btn small:empty{display:none}
/* つぎへ：答えたら画面の下に出る大きなボタン（スクロールしなくても見える） */
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(247,242,232,0),var(--bg) 35%);animation:barin .25s ease-out}
.nextbar .btn{max-width:428px;min-height:62px;font-size:1.2rem;animation:nudge 1.6s ease-in-out .6s infinite}
.nextbar .btn .arw{width:26px;height:26px;flex:none}
@keyframes barin{from{transform:translateY(100%)}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}
#play.has-next{padding-bottom:96px}
.btn:focus-visible,.choice:focus-visible,.iconbtn:focus-visible,.mini:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.8rem;cursor:pointer;font-weight:700}

/* ===== title ===== */
#title{justify-content:center;gap:18px;text-align:center}
.logo{font-family:var(--pop);font-weight:400;font-size:clamp(2.1rem,10vw,2.9rem);line-height:1.25;margin:0;letter-spacing:.04em}
.logo .one{display:inline-block;color:var(--accent);font-size:1.35em;transform:rotate(-6deg);margin-right:2px}
.lead{margin:0;color:var(--sub);font-size:.95rem;line-height:1.8}
.peek{position:relative;width:min(100%,300px);aspect-ratio:3/2;border-radius:22px;background:#dfeaf1;overflow:hidden;border:3px solid var(--ink);box-sizing:border-box}
.peek svg{position:absolute;inset:0;width:100%;height:100%}
.peek .lid{position:absolute;left:0;right:0;height:50%;background:var(--ink);animation:blink 3.2s -1.3s infinite}
.peek .lid.top{top:0;transform-origin:top}
.peek .lid.bot{bottom:0;transform-origin:bottom}
@keyframes blink{0%,30%{transform:scaleY(1)}36%,62%{transform:scaleY(0)}68%,100%{transform:scaleY(1)}}
.peek .tag{position:absolute;right:10px;bottom:8px;font-family:var(--pop);font-size:.8rem;color:var(--card);z-index:2;animation:tagfade 3.2s -1.3s infinite}
@keyframes tagfade{0%,30%{opacity:1}36%,62%{opacity:0}68%,100%{opacity:1}}
.menu{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:4px}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--sub)}
.meta span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.rules{text-align:left;font-size:.82rem;line-height:1.8;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:0;width:100%;box-sizing:border-box}
.rules b{color:var(--ink)}
.foot{font-size:.75rem;color:var(--sub);margin-top:6px}
.foot a{color:var(--sub)}

/* ===== play ===== */
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.qno{font-family:var(--pop);font-size:1rem}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}
.dots i.ng{background:var(--ng)}
.dots i.now{box-shadow:0 0 0 2px var(--ink)}
.streakNow{font-family:var(--pop);font-size:.95rem}

.box{position:relative;width:var(--box);height:var(--box);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 0 0 3px var(--ink);flex:none}
.box>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--ink);color:var(--card);text-align:center;z-index:3}
.cover .big{font-family:var(--pop);font-size:clamp(3.4rem,22vw,6rem);line-height:1}
.cover .count{animation:cpop .42s ease-out}
@keyframes cpop{0%{transform:scale(1.6);opacity:0}40%{opacity:1}100%{transform:scale(1)}}
.cover .q{font-family:var(--pop);font-size:clamp(4rem,26vw,7rem);line-height:1;opacity:.25}
.cover .hint{font-size:.85rem;opacity:.8;line-height:1.7}
/* 見るボタン：カメラのシャッターボタン */
.seeBtn{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--pop);font-size:1.2rem;color:#fff;text-shadow:0 2px 0 rgba(91,77,69,.35);cursor:pointer;
  background:var(--btn1);border:4px solid var(--card);box-shadow:0 0 0 6px var(--btn1),0 0 0 9px var(--card),0 6px 0 9px rgba(0,0,0,.25);
  transition:transform .08s}
.seeBtn svg{width:46px;height:46px}
.seeBtn:hover{transform:scale(1.04)}
.seeBtn:active{transform:scale(.94)}
.seeBtn:focus-visible{outline:3px solid var(--gold);outline-offset:12px}
.shutter{position:absolute;left:0;right:0;height:50%;background:var(--ink);z-index:4;transition:transform .12s ease-in}
.shutter.t{top:0;transform:translateY(-101%)}
.shutter.b{bottom:0;transform:translateY(101%)}
.box.shut .shutter{transform:none}
.flashbar{width:var(--box);max-width:100%;height:8px;border-radius:8px;background:rgba(91,77,69,.15);overflow:hidden;margin-bottom:-4px}
.flashbar i{display:block;height:100%;width:100%;background:var(--ink);border-radius:6px;transform-origin:left}
.flashbar.go i{animation:drain 1s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}

.ask{width:100%;margin-top:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.prompt{font-family:var(--pop);font-size:clamp(1.1rem,5.4vw,1.35rem);text-align:center;margin:0;line-height:1.5;min-height:1.5em}
.prompt.wait{font-family:var(--body);font-size:.9rem;color:var(--sub);font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choice{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:8px 10px;box-sizing:border-box;
  background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-weight:700;font-size:1rem;transition:transform .08s,box-shadow .08s}
.choice:hover:not([disabled]){background:#fff7e0}
.choice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.choice[disabled]{cursor:default}
.choice .k{position:absolute;top:4px;left:8px;font-size:.62rem;color:var(--sub);font-family:var(--body)}
.choice .num{font-family:var(--pop);font-size:1.6rem;line-height:1}
.choice .unit{font-size:.8rem}
.choice svg.ic{width:34px;height:34px;flex:none}
.choice .sw{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px rgba(91,77,69,.35) inset}
.choice .quad{width:34px;height:34px;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.choice .quad i{border-radius:4px;background:var(--line)}
.choice .quad i.on{background:var(--ink)}
.choice.right{background:#e3f0dc;border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.choice.wrong{background:#f6dedb;border-color:var(--ng);box-shadow:3px 3px 0 var(--ng)}
.choice.dim{opacity:.45}
.choice.right::after,.choice.wrong::after{position:absolute;right:8px;top:4px;font-family:var(--pop);font-size:.95rem}
.choice.right::after{content:"○";color:var(--ok)}
.choice.wrong::after{content:"×";color:var(--ng)}
.under{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:24px;font-size:.82rem;color:var(--sub)}
.timer{font-family:var(--pop);font-variant-numeric:tabular-nums}
.verdict{font-family:var(--pop);font-size:1.15rem;text-align:center;margin:0;line-height:1.5}
.verdict.ok{color:var(--ok)}
.verdict.ng{color:var(--ng)}
.verdict small{display:block;font-family:var(--body);font-size:.85rem;color:var(--sub);font-weight:700}
.notice{font-size:.8rem;color:var(--accent);text-align:center;margin:0}

/* ===== result ===== */
#result{gap:14px;text-align:center}
.rcard{width:100%;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:18px 16px 16px;box-sizing:border-box;position:relative;overflow:hidden}
.rcard .rhead{display:flex;justify-content:space-between;font-family:var(--pop);font-size:.82rem;color:var(--sub)}
.rcard .your{margin:10px 0 0;font-size:.9rem;font-weight:700;color:var(--sub)}
.rcard .tier{font-family:var(--pop);font-size:clamp(1.9rem,9vw,2.4rem);margin:2px 0 0;line-height:1.3}
.rcard .lv{display:inline-block;font-family:var(--pop);font-size:.85rem;background:var(--ink);color:var(--card);border-radius:999px;padding:3px 12px;margin-top:4px}
.rcard .ticon{width:118px;height:118px;margin:10px auto 0;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.rcard .cmt{margin:6px 0 0;font-size:.92rem}
.rcard .grid{display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.rcard .grid i{width:30px;height:30px;border-radius:8px;background:var(--line)}
.rcard .grid i.ok{background:var(--ok)}
.rcard .grid i.ng{background:var(--ng)}
.rcard .score{font-family:var(--pop);font-size:1rem;margin:6px 0 0}
.rcard .score b{font-size:1.4rem}
.rcard .site{margin:10px 0 0;font-size:.72rem;color:var(--sub)}
.minis{display:flex;gap:6px;justify-content:center;width:100%;flex-wrap:wrap}
.mini{position:relative;width:62px;height:62px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px var(--ink);padding:0;border:none;cursor:pointer;background:var(--card)}
.mini svg{width:100%;height:100%;display:block}
.mini b{position:absolute;right:2px;bottom:0;font-family:var(--pop);font-size:1.05rem;text-shadow:0 0 3px #fff,0 0 3px #fff}
.mini b.ok{color:var(--ok)}
.mini b.ng{color:var(--ng)}
.minis-note{font-size:.75rem;color:var(--sub);margin:-6px 0 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.next{font-size:.82rem;color:var(--sub);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:999px;padding:10px 18px;font-size:.85rem;z-index:20;pointer-events:none}

/* review / share modal */
.modal{position:fixed;inset:0;background:rgba(62,51,45,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow-y:auto}
.sheet{background:var(--bg);border-radius:22px;padding:16px;width:min(100%,420px);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;margin:auto}
.sheet h2{font-family:var(--pop);font-weight:400;font-size:1.05rem;margin:0}
.sheet .bigscene{width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px var(--ink)}
.sheet .bigscene svg{width:100%;height:100%;display:block}
.sheet img{width:100%;border-radius:14px;box-shadow:0 0 0 2px var(--line)}
.sheet p{margin:0;font-size:.85rem;color:var(--sub);line-height:1.7}

@media (prefers-reduced-motion:reduce){
  .peek .lid,.peek .tag,.rcard .ticon{animation:none}
  .peek .lid{transform:scaleY(0)}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== タイトル ===== -->
<section class="screen" id="title">
  <h1 class="logo"><span class="one">1</span>秒だけ<br>見ていい</h1>
  <div class="peek" aria-hidden="true">
    <svg id="peekArt" viewBox="0 0 360 240"></svg>
    <div class="lid top"></div><div class="lid bot"></div>
    <span class="tag">1.0秒</span>
  </div>
  <p class="lead">絵が見えるのは、たった1秒。<br>消えたあとに、質問がきます。</p>
  <div class="menu">
    <button class="btn" id="dailyBtn" type="button"><svg class="bi" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16c3.5-6 8-9 13-9s9.5 3 13 9c-3.5 6-8 9-13 9S6.5 22 3 16z" fill="#fffdf8" stroke="#5b4d45" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="16" r="5.2" fill="#5b4d45"/><circle cx="17.8" cy="14.2" r="1.6" fill="#fffdf8"/></svg>今日の5問 <small id="dailyNo"></small></button>
    <button class="btn light" id="endlessBtn" type="button"><svg class="bi" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c1 5 7 7.5 7 15a7 7 0 0 1-14 0c0-4 2-6 3.5-7.5.3 2.4 1.3 3.8 2.8 4.3C14.6 11 14 7 16 3z" fill="#e8877f" stroke="#5b4d45" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 17c1.6 1.6 3 3 3 5a3 3 0 0 1-6 0c0-2 1.4-3.4 3-5z" fill="#fbe9b7"/></svg>れんぞくチャレンジ <small id="bestTxt"></small></button>
  </div>
  <div class="meta" id="meta"></div>
  <p class="rules">
    <b>あそびかた</b><br>
    ① 「見る」を押すと、絵が<b>1秒だけ</b>出ます<br>
    ② 消えたあとに「何こあった？」「何いろだった？」などの質問<br>
    ③ 何を聞かれるかは、見たあとまでわかりません<br>
    今日の5問はみんな同じ問題。はやく答えるほど高得点です。
  </p>
  <p class="foot"><a href="https://runococco.github.io/picoruno./">picoruno. のほかのゲーム</a> <button class="iconbtn" id="muteBtn" type="button" aria-pressed="false">おと：オン</button></p>
</section>

<!-- ===== プレイ ===== -->
<section class="screen" id="play" hidden>
  <div class="top">
    <span class="qno" id="qno">Q1</span>
    <span class="dots" id="dots" aria-hidden="true"></span>
    <span class="streakNow" id="streakNow" hidden></span>
    <button class="iconbtn" id="quitBtn" type="button">やめる</button>
  </div>
  <div class="box" id="box">
    <div id="sceneHost"></div>
    <div class="shutter t"></div><div class="shutter b"></div>
    <div class="cover" id="cover"></div>
  </div>
  <div class="ask">
    <div class="flashbar" id="flashbar" hidden><i></i></div>
    <p class="prompt wait" id="prompt"></p>
    <div class="choices" id="choices"></div>
    <div class="under"><span id="underL"></span><span class="timer" id="timer"></span></div>
    <p class="verdict" id="verdict" hidden></p>
    <p class="notice" id="notice" hidden></p>
    <div class="nextbar" id="nextBar" hidden><button class="btn" id="nextBtn" type="button"><span id="nextLabel">つぎの問題へ</span><svg class="arw" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#fffdf8"/><path d="M13 9.5l7 6.5-7 6.5" fill="none" stroke="#e8877f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  </div>
</section>

<!-- ===== 結果 ===== -->
<section class="screen" id="result" hidden>
  <div class="rcard" id="rcard">
    <div class="rhead"><span id="rMode"></span><span id="rDate"></span></div>
    <p class="your">あなたの目は…</p>
    <div id="rIcon"></div>
    <p class="tier" id="rTier"></p>
    <span class="lv" id="rLv"></span>
    <p class="cmt" id="rCmt"></p>
    <div class="grid" id="rGrid"></div>
    <p class="score" id="rScore"></p>
    <p class="site">#1秒だけ見ていい ・ picoruno.</p>
  </div>
  <div class="minis" id="minis"></div>
  <p class="minis-note" id="minisNote">タップすると、その問題の絵をもう一度見られます</p>
  <div class="row">
    <a class="btn" style="background:var(--ink)" id="xBtn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">𝕏 に投稿</a>
    <button class="btn sky" id="imgBtn" type="button">画像でシェア</button>
  </div>
  <button class="btn light" id="againBtn" type="button">れんぞくチャレンジ</button>
  <button class="btn plain" id="homeBtn" type="button">タイトルへ</button>
  <p class="next" id="nextDaily"></p>
</section>

</div>

<div class="modal" id="reviewModal" hidden>
  <div class="sheet">
    <h2 id="rvTitle"></h2>
    <div class="bigscene" id="rvScene"></div>
    <p id="rvText"></p>
    <button class="btn plain" id="rvClose" type="button">とじる</button>
  </div>
</div>

<div class="modal" id="shareModal" hidden>
  <div class="sheet">
    <h2>結果の画像</h2>
    <img id="shareImg" alt="結果の画像">
    <p>スマホは画像を長押しでも保存できます</p>
    <div class="row">

function iconSvg(kind,color,extra=''){
  const K=KINDS[kind]||{};
  let s=K.svg||TIER_ICONS[kind];
  const main=K.fixed||(COLORS[color]?COLORS[color].c:'#B98A62');
  const sub=K.is||main;
  // しろい本体は背景に溶けないよう、少し濃い縁をつける
  if(main==='#F4F1EA') s=s.replace(/fill="var\(--ic\)"/g,'fill="#F4F1EA" stroke="#CFC6B8" stroke-width="1"');
  return s.replace(/var\(--ic\)/g,main).replace(/var\(--is\)/g,sub).replace(/var\(--ie\)/g,'#5B4D45');
}
function tierIconSvg(id){return id==='neko'?iconSvg('neko','chairo'):iconSvg(id)}

/* ===== 場面と問題をつくる ===== */
const N_BY_D=[4,6,8,10,12,13,14];
const K_BY_D=[[2,3],[2,3],[3,4],[3,5],[3,5],[4,6],[4,6]];
const CELL=90, GAP=4; // 4×4 マス。1マスに1こだけ置くので重ならない

function makeScene(r,d){
  const dd=Math.min(d,N_BY_D.length-1), n=N_BY_D[dd];
  const [kmin,kmax]=K_BY_D[dd], k=ri(r,kmin,Math.min(kmax,n));
  const kinds=shuffle(r,KIND_IDS).slice(0,k);
  const counts=kinds.map(()=>1);
  for(let i=k;i<n;i++) counts[ri(r,0,k-1)]++;
  const cells=shuffle(r,[...Array(16).keys()]).slice(0,n);
  const items=[]; let ci=0;
  kinds.forEach((kd,i)=>{for(let j=0;j<counts[i];j++){
    const K=KINDS[kd], size=ri(r,48,60), free=CELL-2*GAP-size, cell=cells[ci++];
    items.push({kind:kd,color:K.colors?pick(r,K.colors):null,cell,size,
      x:(cell%4)*CELL+GAP+ri(r,0,free), y:Math.floor(cell/4)*CELL+GAP+ri(r,0,free), rot:ri(r,-14,14)});
  }});
  return {bg:pick(r,BG_IDS),items};
}
const kindCounts=sc=>{const m={};sc.items.forEach(it=>m[it.kind]=(m[it.kind]||0)+1);return m};
const idxWhere=(sc,f)=>sc.items.map((it,i)=>f(it)?i:-1).filter(i=>i>=0);

function numChoices(r,n){
  const cand=shuffle(r,[n-2,n-1,n+1,n+2,n+3].filter(v=>v>=1)).slice(0,3);
  const vals=[n,...cand].sort((a,b)=>a-b);
  return {vals,answer:vals.indexOf(n)};
}
const QUADS=['左上','右上','左下','右下'];
const quadOf=cell=>(Math.floor(cell/4)<2?0:2)+(cell%4<2?0:1);

    if(d>=3&&r()<.5){ // 「あかいふうせんは何こ？」

      if(opts.length){
        const k=pick(r,opts), col=pick(r,[...new Set(sc.items.filter(it=>it.kind===k).map(it=>it.color))]);
        const hl=idxWhere(sc,it=>it.kind===k&&it.color===col), nc=numChoices(r,hl.length);
        return {prompt:`${COLORS[col].adj}${KINDS[k].name}は 何${KINDS[k].ctr}？`,choices:nc.vals.map(v=>({num:v,unit:KINDS[k].ctr})),answer:nc.answer,hl};
      }
    }
    const k=pick(r,present), hl=idxWhere(sc,it=>it.kind===k), nc=numChoices(r,hl.length);
    return {prompt:`${KINDS[k].name}は 何${KINDS[k].ctr} ${KINDS[k].ctr==='こ'?'あった':'いた'}？`,
      choices:nc.vals.map(v=>({num:v,unit:KINDS[k].ctr})),answer:nc.answer,hl};
  },
  total(r,sc){
    const n=sc.items.length, nc=numChoices(r,n);
    return {prompt:'ぜんぶで 何こ あった？',choices:nc.vals.map(v=>({num:v,unit:'こ'})),answer:nc.answer,hl:sc.items.map((_,i)=>i)};
  },
  color(r,sc){
    const cnt=kindCounts(sc), opts=Object.keys(cnt).filter(k=>cnt[k]===1&&KINDS[k].colors);
    if(!opts.length) return null;
    const k=pick(r,opts), i=idxWhere(sc,it=>it.kind===k)[0], col=sc.items[i].color;
    const cols=shuffle(r,[col,...shuffle(r,KINDS[k].colors.filter(c=>c!==col)).slice(0,3)]);

  },

    const cnt=kindCounts(sc), opts=Object.keys(cnt).filter(k=>cnt[k]===1);
    if(!opts.length) return null;
    const k=pick(r,opts), i=idxWhere(sc,it=>it.kind===k)[0], it=sc.items[i];
    // まん中の線にかかりそうな位置だと答えが割れるので出さない
    if([it.x,it.x+it.size,it.y,it.y+it.size].some(v=>Math.abs(v-180)<14)) return null;
    return {prompt:`${KINDS[k].name}は どこに ${KINDS[k].ctr==='こ'?'あった':'いた'}？`,choices:QUADS.map((q,j)=>({quad:j,label:q})),answer:quadOf(sc.items[i].cell),hl:[i],quad:true};
  },
  absent(r,sc){
    const present=Object.keys(kindCounts(sc));
    if(present.length<3) return null;
    const abs=pick(r,KIND_IDS.filter(k=>!present.includes(k)));
    const opts=shuffle(r,[abs,...shuffle(r,present).slice(0,3)]);
    return {prompt:'なかった のは どれ？',choices:opts.map(k=>({kind:k,label:KINDS[k].name})),answer:opts.indexOf(abs),hl:[],absent:abs};
  },
  most(r,sc){
    const cnt=kindCounts(sc), present=Object.keys(cnt);
    if(present.length<3) return null;
    const max=Math.max(...present.map(k=>cnt[k])), tops=present.filter(k=>cnt[k]===max);
    if(tops.length!==1||max<2) return null;
    const opts=shuffle(r,[tops[0],...shuffle(r,present.filter(k=>k!==tops[0])).slice(0,3)]);
    return {prompt:'いちばん 多かった のは？',choices:opts.map(k=>({kind:k,label:KINDS[k].name})),answer:opts.indexOf(tops[0]),hl:idxWhere(sc,it=>it.kind===tops[0])};
  },
  bg(r,sc){
    const opts=shuffle(r,[sc.bg,...shuffle(r,BG_IDS.filter(b=>b!==sc.bg)).slice(0,3)]);
    return {prompt:'うしろの いろ は 何いろ だった？',choices:opts.map(b=>({sw:BGS[b].c,label:BGS[b].name})),answer:opts.indexOf(sc.bg),hl:[],frame:true};
  },
};
function typePool(d){
  if(d<=0) return ['count'];
  if(d===1) return ['count','color','position','absent'];
  if(d===2) return ['count','color','position','absent','most','total'];
  return ['count','count','color','color','position','position','absent','absent','most','most','total','bg'];
}
function makeQuestion(r,d,type){
  for(let t=0;t<300;t++){
    const sc=makeScene(r,d), q=TYPE_MAKERS[type](r,sc,d);
    if(q){q.type=type;q.scene=sc;q.d=d;return q}
  }
  const sc=makeScene(r,d), q=TYPE_MAKERS.count(r,sc,d); q.type='count'; q.scene=sc; q.d=d; return q;
}
function nextType(r,d,prev){
  const pool=typePool(d).filter(t=>t!==prev);
  return pick(r,pool.length?pool:typePool(d));
}
function makeDaily(date){
  const r=rngFrom('ichibyou:'+date), qs=[]; let prev=null;
  for(let i=0;i<5;i++){const type=i===0?'count':nextType(r,i,prev); qs.push(makeQuestion(r,i,type)); prev=type}
  return qs;
}

/* ===== 絵を描く ===== */
function sceneSvg(q,opt={}){
  const sc=q.scene, hl=opt.hl?new Set(q.hl):new Set();
  let s=`<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${opt.label||'問題の絵'}"><rect width="360" height="360" fill="${BGS[sc.bg].c}"/>`;
  if(opt.hl&&q.quad) s+=`<path d="M180 8V352M8 180H352" stroke="#5B4D45" stroke-width="2" stroke-dasharray="6 7" opacity=".45"/>`;
  sc.items.forEach((it,i)=>{
    const cx=it.x+it.size/2, cy=it.y+it.size/2;
    if(hl.has(i)) s+=`<circle cx="${cx}" cy="${cy}" r="${(it.size*.62).toFixed(1)}" fill="#fff" fill-opacity=".55" stroke="#5B4D45" stroke-width="3" stroke-dasharray="7 5"/>`;
    s+=`<g transform="translate(${cx} ${cy}) rotate(${it.rot}) scale(${(it.size/32).toFixed(4)}) translate(-16 -16)">${iconSvg(it.kind,it.color)}</g>`;
  });
  if(opt.hl&&q.frame) s+=`<rect x="5" y="5" width="350" height="350" rx="16" fill="none" stroke="#5B4D45" stroke-width="5" stroke-dasharray="12 8"/>`;
  return s+'</svg>';
}
(function peek(){

  let s=`<rect width="360" height="240" fill="#DFEAF1"/>`;

const KEY_DAILY='ichibyou-daily', KEY_STREAK='ichibyou-streak', KEY_BEST='ichibyou-best', KEY_MUTE='ichibyou-mute';

function jstDate(ms=Date.now()){return new Date(ms+9*3600e3).toISOString().slice(0,10)}
function dayNo(date){return Math.round((Date.parse(date+'T00:00:00Z')-Date.parse(FIRST_DAY+'T00:00:00Z'))/86400e3)+1}
function prevDate(date){return new Date(Date.parse(date+'T00:00:00Z')-86400e3).toISOString().slice(0,10)}

/* ===== おと ===== */
let actx=null, muted=!!LS.get(KEY_MUTE,false);
function ac(){if(muted)return null;try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}
function tone(f,dur,type='sine',vol=.18,when=0){const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function shutterSnd(){const a=ac();if(!a)return;const len=Math.floor(a.sampleRate*.08),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=a.createBufferSource(),g=a.createGain();g.gain.value=.35;s.buffer=b;s.connect(g).connect(a.destination);s.start()}
const SND={tick:()=>tone(660,.08,'triangle',.12),go:()=>tone(990,.1,'triangle',.14),shutter:shutterSnd,
  ok:()=>{tone(784,.12,'triangle',.16);tone(1175,.2,'triangle',.16,.09)},ng:()=>{tone(220,.22,'square',.07);tone(185,.28,'square',.06,.12)},
  done:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.13,i*.09))}};

/* ===== ゲーム進行 ===== */
const G={mode:null,date:null,qs:[],i:0,answers:[],phase:'idle',qStart:0,timerRaf:0,flashTimer:0,seq:0};

function startDaily(){
  const today=jstDate(), dl=LS.get(KEY_DAILY,null);
  G.mode='daily'; G.date=today; G.qs=makeDaily(today); G.answers=[]; G.i=0;
  let skipped=false;
  if(dl&&dl.date===today){
    if(dl.done){G.answers=Array.isArray(dl.answers)?dl.answers.slice(0,5):[];showResult();return}
    G.answers=Array.isArray(dl.answers)?dl.answers.slice(0,5):[];
    // 絵を見たあと答えずに閉じた問題は × にする（見なおし防止）
    if(dl.pending===G.answers.length&&G.answers.length<5){G.answers.push({ok:false,t:null,skip:true});skipped=true}
    G.i=G.answers.length;
    saveDaily(null);
    if(G.i>=5){finishDaily();return}
  }
  ready(skipped?'前回、絵を見たまま閉じた問題は × になりました':'');
}
function startEndless(){
  G.mode='endless'; G.date=null; G.answers=[]; G.i=0;
  G.rng=mulberry32((Math.random()*4294967296)>>>0); G.qs=[]; G.prevType=null;
  ready('');
}
function ensureEndlessQ(){
  if(G.mode!=='endless'||G.qs[G.i]) return;
  const d=Math.min(G.i,6), type=G.i===0?'count':nextType(G.rng,Math.min(G.i,3),G.prevType);
  G.qs[G.i]=makeQuestion(G.rng,d,type); G.prevType=type;
}
function saveDaily(pending){

  const done=G.answers.length>=5;

}

  $('prompt').className='prompt wait';

  $('seeBtn').onclick=flash;

function flash(){
  if(G.phase!=='ready') return;
  G.phase='count'; ac();
  const seq=G.seq, q=G.qs[G.i];
  $('notice').hidden=true;
  $('prompt').textContent='じっと見て…';
  let n=3;
  const step=()=>{
    if(seq!==G.seq) return;
    if(n>0){$('cover').innerHTML=`<span class="big count">${n}</span>`;SND.tick();n--;setTimeout(step,420);return}
    // ここから1秒だけ見せる
    G.phase='flash';
    if(G.mode==='daily') saveDaily(G.i);
    $('sceneHost').innerHTML=sceneSvg(q);
    $('cover').hidden=true; SND.go();
    $('prompt').textContent='1秒だけ！';
    $('flashbar').hidden=false; $('flashbar').classList.remove('go');
    requestAnimationFrame(()=>{
      if(seq!==G.seq) return;
      $('flashbar').classList.add('go');
      G.flashTimer=setTimeout(()=>closeShutter(seq),FLASH_MS);
    });
  };

}
function closeShutter(seq){
  if(seq!==G.seq) return;
  $('box').classList.add('shut'); SND.shutter();
  setTimeout(()=>{
    if(seq!==G.seq) return;
    $('sceneHost').innerHTML=''; $('flashbar').hidden=true;
    $('cover').hidden=false; $('cover').innerHTML='<span class="q">?</span>';

}
function choiceHtml(c,j){
  let inner='';
  if(c.num!=null) inner=`<span class="num">${c.num}</span><span class="unit">${c.unit}</span>`;
  else if(c.sw) inner=`<span class="sw" style="background:${c.sw}"></span><span>${c.label}</span>`;
  else if(c.kind) inner=`${kindIcon(c.kind)}<span>${c.label}</span>`;
  else if(c.quad!=null) inner=`<span class="quad">${[0,1,2,3].map(k=>`<i class="${k===c.quad?'on':''}"></i>`).join('')}</span><span>${c.label}</span>`;
  return `<button class="choice" type="button" data-j="${j}"><span class="k">${j+1}</span>${inner}</button>`;
}
function askQuestion(){
  const q=G.qs[G.i];
  G.phase='ask';
  $('prompt').className='prompt'; $('prompt').textContent=q.prompt;
  $('choices').innerHTML=q.choices.map(choiceHtml).join('');
  $('choices').querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  $('underL').textContent='はやいほど高得点';
  G.qStart=performance.now();
  const tick=()=>{if(G.phase!=='ask')return;$('timer').textContent=((performance.now()-G.qStart)/1000).toFixed(1)+'秒';G.timerRaf=requestAnimationFrame(tick)};
  tick();
}
const bonusOf=t=>t==null?0:Math.round(50*Math.max(0,Math.min(1,(6.5-t)/5)));
function answer(j){
  if(G.phase!=='ask') return;
  G.phase='reveal'; cancelAnimationFrame(G.timerRaf);
  const q=G.qs[G.i], t=(performance.now()-G.qStart)/1000, ok=j===q.answer;
  G.answers[G.i]={ok,t:Math.round(t*100)/100,c:j};
  saveDaily(null);
  $('timer').textContent=t.toFixed(1)+'秒';
  $('choices').querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;
    if(k===q.answer)b.classList.add('right');else if(k===j)b.classList.add('wrong');else b.classList.add('dim')});

  const v=$('verdict'); v.hidden=false; v.className='verdict '+(ok?'ok':'ng');
  const ansLabel=(c=>c.num!=null?c.num+c.unit:c.label)(q.choices[q.answer]);
  v.innerHTML=ok?`せいかい！<small>+${100+bonusOf(t)}点（${t.toFixed(1)}秒）</small>`
                :`ざんねん… こたえは「${ansLabel}」<small>${q.absent?KINDS[q.absent].name+'は どこにも いませんでした':'点線で かこんだところを 見てね'}</small>`;
  renderTop();

  $('nextBar').hidden=false; $('play').classList.add('has-next');

}
function next(){
  if(G.phase!=='reveal') return;
  const last=G.mode==='daily'?G.i>=4:!G.answers[G.i].ok;
  G.i++;
  if(!last){ready('');return}

function quit(){

}

/* ===== 結果 ===== */
function dailyPoints(ans){return ans.reduce((s,a)=>s+(a&&a.ok?100+bonusOf(a.t):0),0)}
function tierFor(mode,v){const th=mode==='daily'?DAILY_TIER_PTS:ENDLESS_TIER_N;let k=0;th.forEach((x,i)=>{if(v>=x)k=i});return k}

    :`1秒だけ見ていい れんぞくチャレンジ\n${nOk}問れんぞく正解！わたしの目は「${T.name}」👁\n#1秒だけ見ていい`;

  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function makeShareImage(){
  const S=lastShare, W=1080, H=1080, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  try{await Promise.race([Promise.all([document.fonts.load('64px "Mochiy Pop One"'),document.fonts.load('700 40px "Zen Maru Gothic"')]),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  const POP='"Mochiy Pop One","Zen Maru Gothic",sans-serif', BODY='700 34px "Zen Maru Gothic",sans-serif';
  c.fillStyle='#F7F2E8'; c.fillRect(0,0,W,H);
  c.fillStyle='#FFFDF8'; rr(c,60,60,W-120,H-120,56); c.fill(); c.lineWidth=8; c.strokeStyle='#5B4D45'; c.stroke();
  c.textAlign='center'; c.textBaseline='middle'; c.fillStyle='#8E8077';
  c.font='40px '+POP; c.fillText('1秒だけ見ていい',W/2,150);
  c.font=BODY; c.fillText(S.head+(S.date?'　'+S.date.replace(/-/g,'.'):''),W/2,208);
  const im=await svgImg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 34 34" width="320" height="320">${tierIconSvg(TIERS[S.k].id)}</svg>`);
  if(im) c.drawImage(im,W/2-150,245,300,300);
  c.fillStyle='#8E8077'; c.font=BODY; c.fillText('わたしの目は…',W/2,580);
  c.fillStyle='#5B4D45'; c.font='86px '+POP; c.fillText(`「${TIERS[S.k].name}」`,W/2,670,W-180);
  c.font='34px '+POP; const lv=`Lv.${S.k+1} / 8`, lw=c.measureText(lv).width+48;
  rr(c,W/2-lw/2,712,lw,58,29); c.fill(); c.fillStyle='#FFFDF8'; c.fillText(lv,W/2,742);
  if(S.daily){
    const sz=92, gp=18, x0=W/2-(5*sz+4*gp)/2;
    S.grid.forEach((ok,j)=>{c.fillStyle=ok?'#7FAE73':'#D9706A';rr(c,x0+j*(sz+gp),800,sz,sz,20);c.fill()});
    c.fillStyle='#5B4D45'; c.font='42px '+POP; c.fillText(`${S.nOk} / 5 せいかい ・ ${S.pts} 点`,W/2,940);
  }else{
    c.fillStyle='#5B4D45'; c.font='64px '+POP; c.fillText(`${S.nOk} 問れんぞく せいかい`,W/2,860);
    c.fillStyle='#8E8077'; c.font=BODY; c.fillText('あなたは何問いける？',W/2,935);
  }
  c.fillStyle='#8E8077'; c.font='600 26px "Zen Maru Gothic",sans-serif'; c.fillText('#1秒だけ見ていい ・ runococco.github.io/picoruno.',W/2,992);
  return cv;
}
let shareBlob=null;
async function openShare(){
  $('shareModal').hidden=false; $('shareImg').removeAttribute('src');
  const cv=await makeShareImage();
  $('shareImg').src=cv.toDataURL('image/png');
  shareBlob=await new Promise(r=>cv.toBlob(r,'image/png'));
}
async function doShare(){
  if(!shareBlob) return;
  const file=new File([shareBlob],'ichibyou-'+(lastShare.date||'renzoku')+'.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:lastShare.text+'\n'+GAME_URL});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(shareBlob), a=document.createElement('a');
  a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); toast('画像を保存しました');
}
async function copyText(){
  const t=lastShare.text+'\n'+GAME_URL;
  try{await navigator.clipboard.writeText(t);toast('コピーしました')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('コピーしました')}catch(_){toast('コピーできませんでした')}ta.remove()}
}

/* ===== 操作 ===== */
$('dailyBtn').onclick=()=>{ac();startDaily()};
$('endlessBtn').onclick=()=>{ac();startEndless()};
$('nextBtn').onclick=next;
$('box').addEventListener('click',()=>{if(G.phase==='reveal')next()});
$('quitBtn').onclick=quit;
$('againBtn').onclick=startEndless;
$('homeBtn').onclick=()=>{refreshTitle();show('title')};
$('imgBtn').onclick=openShare;
$('shareGo').onclick=doShare;
$('copyTxt').onclick=copyText;
$('shareClose').onclick=()=>$('shareModal').hidden=true;
$('rvClose').onclick=()=>$('reviewModal').hidden=true;
['reviewModal','shareModal'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target.id===id)$(id).hidden=true}));
$('muteBtn').onclick=()=>{muted=!muted;LS.set(KEY_MUTE,muted);setMuteLabel()};
document.addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Escape'){$('reviewModal').hidden=true;$('shareModal').hidden=true;return}
  if(!$('reviewModal').hidden||!$('shareModal').hidden||$('play').hidden) return;
  const tag=e.target&&e.target.tagName, onBtn=tag==='BUTTON'||tag==='A';
  if(G.phase==='ask'&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(+e.key-1);return}
  if((e.key===' '||e.key==='Enter')&&!onBtn){
    if(G.phase==='ready'){e.preventDefault();flash()}
    else if(G.phase==='reveal'){e.preventDefault();next()}
  }
});
setMuteLabel(); refreshTitle();
</script>
