<style>
/* layout: 一画面の作業台。上に名前、中央に正方形の台、下に道具箱 */
:root{
  /* 和紙の作業机：生成りの地、墨の文字、はんこの朱 */
  --bg:#f3eee2; --surface:#fbf8f1; --line:#e2d8c6; color-scheme:light; --ink:#2b2622; --muted:#857a68;

}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;

.seal{flex:none;display:grid;place-items:center;width:24px;height:24px;background:var(--accent);color:var(--accent-ink);font:600 15px/1 var(--f-disp);border-radius:4px;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 3px var(--accent-ink)}
.brand h1{flex:none;white-space:nowrap;font-family:var(--f-disp);font-weight:600;font-size:22px;margin:0;letter-spacing:.08em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.14em}
 .hbtn{flex:none;font:500 12px/1 var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 11px;cursor:pointer}
.pchip{flex:0 1 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;font:500 12px/1 var(--f-body);min-width:0;max-width:35vw}

.snd[aria-pressed="false"]{opacity:.4}
.snd{flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0!important;font:500 12px/1 var(--f-body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 10px;cursor:pointer}

.toast{position:absolute;left:50%;top:10px;z-index:3;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:7px 12px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:.92}

.chip{flex:none;font:500 13px/1 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.warn{color:var(--warn)}
.chip:disabled{opacity:.4;cursor:default}
.sw{flex:none;width:30px;height:30px;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;background-size:cover}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(15,18,16,.55);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:520px;width:100%}
.card img{width:100%;max-height:62vh;object-fit:contain;border-radius:4px}
.card p{margin:0;font-size:12px;color:var(--muted);text-align:center}
.stagebox{position:relative}
.fab{position:absolute;bottom:10px;border:1px solid var(--line);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.fab.undo{left:10px;width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0}
.fab.fold{right:10px;height:48px;padding:0 24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font:600 17px/1 var(--f-disp);letter-spacing:.12em}
.fab:disabled{opacity:.35;cursor:default}
.pick{position:absolute;inset:0;overflow-y:auto;padding-block:6px 20px;display:flex;flex-direction:column;gap:20px;min-width:0}
#pickBody{display:flex;flex-direction:column;gap:24px}
.pmode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:-8px}
.pmode button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:9px 4px;cursor:pointer;font:600 13px/1.2 var(--f-body)}
.pmode button small{font-size:10.5px;font-weight:500;opacity:.85}
.pmode button[aria-pressed="true"]{background:#f8e6de;color:#9a3521;box-shadow:inset 0 0 0 1.5px var(--accent)}
.pick-acts{display:flex;gap:8px}
.pick-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pick-title{font-family:var(--f-disp);font-weight:600;font-size:20px;margin:0;letter-spacing:.06em}
.mat h2{font-family:var(--f-disp);font-weight:600;font-size:15px;margin:0;letter-spacing:.06em}
.mat p{margin:2px 0 10px;font-size:11px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 10px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:500 11px/1.2 var(--f-body);min-width:0}
.pcard img{width:100%;max-width:100%;aspect-ratio:1;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.05);transition:transform .15s}
.pcard:hover img{transform:translateY(-2px) rotate(-1.5deg)}
@media (prefers-reduced-motion: reduce){.toast,.pcard img{transition:none}}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#stage'), ctx=cv.getContext('2d'), wrap=$('#wrap');
const DPR=Math.min(2,window.devicePixelRatio||1);
const RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=320;

const BOARDS=[{n:'生成',c:'#ebe7db'},{n:'白鼠',c:'#d8d9d3'},{n:'桜',c:'#f0dcdc'},{n:'若竹',c:'#cfdcc4'},{n:'空色',c:'#d3e0ea'},{n:'山吹',c:'#efd9a8'},
 {n:'鉛',c:'#5c5f5c'},{n:'藍',c:'#22344f'},{n:'紺',c:'#1c2637'},{n:'臙脂',c:'#5a2228'},{n:'墨',c:'#1f2120'},
 {n:'和紙',c:'#efeadf',k:'washi'},{n:'金砂子',c:'#f1ead7',k:'gold'},{n:'木目',c:'#c39566',k:'wood'},{n:'畳',c:'#b8b683',k:'tatami'},{n:'カッターマット',c:'#3f6e5a',k:'mat'},{n:'黒板',c:'#2d3b35',k:'chalk'}];

/* ---------- 紙の質感 ---------- */
const tex=(()=>{const t=document.createElement('canvas');t.width=t.height=256;const g=t.getContext('2d');
 const id=g.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=Math.random()>.5?255:0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()*13}
 g.putImageData(id,0,0);
 for(let k=0;k<80;k++){let x=Math.random()*256,y=Math.random()*256,a=Math.random()*6.28;g.beginPath();g.moveTo(x,y);
  for(let s=0;s<7;s++){a+=(Math.random()-.5)*.9;x+=Math.cos(a)*5;y+=Math.sin(a)*5;g.lineTo(x,y)}
  g.strokeStyle=k%3?'rgba(255,255,255,.2)':'rgba(0,0,0,.06)';g.lineWidth=.5+Math.random()*.7;g.stroke()}
 return t})();
const patCache=new WeakMap();
function texPat(g){let p=patCache.get(g);if(!p){p=g.createPattern(tex,'repeat');patCache.set(g,p)}return p}
function paintTex(g,x,y,w,h,a){g.save();g.globalAlpha=a;g.fillStyle=texPat(g);g.fillRect(x,y,w,h);g.restore()}

/* ---------- 紙の材質 ---------- */
const MATS=[
 {id:'ori',n:'折り紙',d:'つるっとした、いつもの無地の折り紙',items:[['赤','#d7263d'],['朱','#e8532c'],['だいだい','#f08a24'],['山吹','#f2b134'],['黄','#f4d23c'],['レモン','#ece27a'],
  ['黄緑','#a6c84a'],['緑','#3c9b54'],['深緑','#1f6b45'],['青緑','#2a9d8f'],['水色','#6cc3e0'],['空','#4a90d1'],['青','#2c5aa8'],['群青','#3a4fa0'],['紺','#1e2e5c'],
  ['藤','#a68ccc'],['紫','#6b4a9c'],['赤紫','#b23a7a'],['ピンク','#f28fb0'],['桃','#f6b8c8'],['肌','#f3cfae'],['茶','#8a5a3c'],['灰','#9a9da0'],['黒','#222222'],['白','#f7f6f2']]},
 {id:'kusumi',n:'やさしい和紙',d:'くすんだ色の、ふんわり透ける和紙',items:[['コーラル','#ec8b7e'],['セージ','#9eae8e'],['バター','#f1d48c'],['ローズ','#e4a9a3'],['ピーチ','#f2b98f'],['ミント','#b4cdb4'],['ラベンダー','#b7a8c8'],['ミスト','#a9c3d1'],['からし','#d7b25c'],['ミルクティー','#c9a98c'],['ココア','#9c7a64'],['クリーム','#f2e6c8']]},
 {id:'washi',n:'和紙',d:'やわらかな繊維が見える、手すきの紙',items:[['紅','#a8322d'],['藍','#24406a'],['墨','#272727'],['鶯','#6b7a3a'],['山吹','#d39a2c'],['桜','#e2b1b4'],['生成','#efe9da']]},
 {id:'unryu',n:'雲竜紙',d:'長い繊維が雲のように流れる和紙',items:[['白','#f2efe6'],['薄紅','#e3b3ae'],['浅葱','#7fb0b6'],['墨','#3a3a3a']]},
 {id:'chiri',n:'ちりめん紙',d:'細かいしぼのある、布のような紙',items:[['朱','#c8503a'],['萌黄','#8ea64a'],['紫','#6c4f86'],['紺','#25324d']]},
 {id:'metal',n:'金銀の紙',d:'光をかえす、きらりとした紙',items:[['金','gold'],['銀','silver'],['銅','copper'],['玉虫','tama']]},
 {id:'holo',n:'オーロラ紙',d:'見る向きで色が変わる、虹色の紙',items:[['オーロラ','aurora'],['夜光','night']]},
 {id:'trace',n:'トレーシングペーパー',d:'向こうがうっすら透ける紙',items:[['白','#ffffff'],['水色','#bfe0f0'],['桃','#f6c7cf'],['若草','#d3e8b0']]},
 {id:'kraft',n:'クラフト紙',d:'茶色くざらっとした包み紙',items:[['茶','#a57c52'],['こげ茶','#6e4c33'],['白','#e8dfcf']]}];

  o=clipHalf(o,X=>s*((Q.x-P.x)*(X.y-P.y)-(Q.y-P.y)*(X.x-P.x)))}return o}

 const FORM=[null,['A','B'],['C','D'],['A','D'],null,['C','B']];

 const tick=()=>{while(t0+e*E<a.currentTime+.8){const t=t0+e*E,bar=Math.floor(e/8),k=e%8,ch=BARS[bar%4];
   if(e%64===0){const f=FORM[sec%FORM.length];sec++;mq=f?[...MEL[f[0]],...MEL[f[1]]]:[];mt=e}
   if(k===0)pluck(a,out,midi(ch[0]-12),t,.13,3);
   if(k===0||Math.random()<.88)pluck(a,out,midi(ch[k]),t+Math.random()*.012,k%4===0?.1:.07,1.6);
   while(mq.length&&mt<=e){const [n,b]=mq.shift();if(n)flute(a,out,midi(n),t0+mt*E,b*2*E*.95,.075);mt+=b*2}
   e++}};

function radialMax(){return K.shape==='hex'?.425:K.shape==='pent'?.395:.485}
function profilePoly(phi,prof){const L=prof.map(([s,w])=>[s,w]),Rr=prof.map(([s,w])=>[s,-w]).reverse(),c=Math.cos(phi),sn=Math.sin(phi);

 const axes=m=>{const o=[];for(let k=0;k<=m;k++)o.push(a0+al*k/m);return o};
 const hw=(r,sp)=>r*Math.sin(sp/2);            // その半径での、となりの軸までの半分の幅
 const core=R*(.07+rnd()*.04);keeps.push(circle(0,0,core,28));
 const type=pick(['petal','spark','mari','kiku','duo','spark','petal']);
 if(type==='petal'){                         // しずく形の花びら
  const m=n>=6?1:pick([1,2]),ax=axes(m),sp=al/m,L1=R*(.93+rnd()*.05),L2=R*(.6+rnd()*.22);
  ax.forEach((p,i)=>{const r1=m>1&&i%2?L2:L1,wh=Math.min(hw(r1,sp)*(m===1?.82:.78),r1*.3);keeps.push(teardrop(p,r1,wh,.006,2.1))});
  if(rnd()<.55)ax.forEach((p,i)=>{if(m>1&&i%2)return;const r1=L1,wh=Math.min(hw(r1,sp)*(m===1?.82:.78),r1*.3);holes.push(disc(p,r1-wh*1.05,wh*.42))})}

  const m=pick([2,3,4]),ax=axes(m),w=R*(.018+rnd()*.012),lens=[R*.98,R*(.7+rnd()*.15),R*(.84+rnd()*.1)],ball=rnd()<.6;

  if(rnd()<.5)ax.forEach((p,i)=>{if(i%2)return;keeps.push(disc(p,R*(.32+rnd()*.05),Math.min(hw(R*.34,al/m)*.9,R*.05)))})}

  const m=pick([1,2]),ax=axes(m),sp=al/m,rr=R*.82,dr=Math.min(hw(rr,sp)*1.08,R*.17),w=R*.022;

  const ax2=[];for(let k=0;k<m;k++)ax2.push(a0+sp*(k+.5));const r2=R*.52,d2=Math.min(hw(r2,sp)*1.05,R*.12);

  const m=pick([2,3]),ax=axes(m),sp=al/m,L=R*(.95+rnd()*.03);

 if(K.paper){if(it!==K.paper){pushUndo();setBase(it)}K.phase='cut';updateUI();resize();toast(it.mat.n+'・'+it.n+' にかえました');return}
 setBase(it);K.cuts=[];K.creases.clear();K.shape=shapeOf(K.fold);K.folded=false;K.foldAmt=0;K.anim=null;
 K.view=fullView();K.phase='cut';updateUI();resize();sndFold();toast(it.mat.n+'・'+it.n)}
const pickReset=$('#pickReset');
pickReset.addEventListener('click',()=>arm('reset',resetPaper,pickReset,'まっさらにする'));

const hint={};let lastBoard=null;
function updateUI(){const pk=K.phase==='pick';pick.hidden=!pk;box.hidden=pk;$('#side').hidden=pk;$('#pickBack').hidden=!K.paper;$('#pickMode').hidden=!K.paper||!K.cuts.length;pickReset.hidden=!K.paper||!K.cuts.length;
 $('#paperChip').hidden=!K.paper||pk;$('#imgBtn').hidden=!K.paper||pk;if(K.paper){$('#paperName').textContent=K.paper.n;$('#paperChip').title=K.paper.mat.n+'・'+K.paper.n}
 $('#boardRow').querySelectorAll('.bcard').forEach(b=>b.setAttribute('aria-pressed',b.bd===K.board));$('#boardName').textContent=K.board.n;if(lastBoard!==K.board){lastBoard=K.board;$('#boardThumb').src=boardImg(K.board,52).toDataURL()}boardBtn.hidden=!K.paper||pk;if(pk)setPop(false);
 kFolds.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fold===K.fold));
 kTools.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===K.tool));
 foldFab.textContent=K.folded?'ひらく':'たたむ';
 undoFab.disabled=!K.hist.length&&!K.line.length;$('#redoFab').disabled=!(K.fut&&K.fut.length);
 const T={scissors:'ハサミで、紙を横切るように線をなぞってください。線で分かれた小さいほうが切り落とされます。',
  free:'切りぬきたい形を、ぐるっと囲むようになぞってください。',line:'点をタップして形を作り、最初の点をもう一度タップすると切りぬけます。'}[K.tool];
 hint.textContent=K.folded?'たたんだ紙です。'+T:(K.cuts.length?'右下の「たたむ」で折りなおすと、さらに切れます。ひらいたままでも切れます。':'右下の「たたむ」か折り方をえらんで、紙を折りましょう。ひらいたままでも切れます。')}
let tt=0;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo()}});

updateUI();resize();
