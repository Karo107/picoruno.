<style>
/* 画面：夜空いっぱいの canvas。上に願いごとの入力欄（スマホのキーボードに隠れないよう上側）。 */
:root{
  --night:#0b1230; --card:#f7f5ff; --ink:#272a4a; --sub:#77789a; --line:#e0def0;
  --star:#fff1b8; --star-d:#c9a748; --violet:#6f6ad6; --violet-d:#4b46a8;
  --pop:"Kaisei Decol","Zen Maru Gothic",serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;

}
html,body{margin:0;height:100%;background:var(--night);overflow:hidden}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);font-weight:500;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input{font-family:inherit}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:30;width:44px;height:44px;border-radius:50%;
  border:2px solid rgba(255,255,255,.5);background:rgba(11,18,48,.5);color:#fff;cursor:pointer;display:grid;place-items:center}

.sheet{position:fixed;left:50%;transform:translateX(-50%);z-index:20;width:min(430px,calc(100% - 24px));box-sizing:border-box;background:var(--card);border-radius:20px;
  box-shadow:0 18px 60px rgba(0,0,0,.6);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 24px);overflow-y:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;
  font-family:var(--pop);font-size:1.12rem;background:var(--violet);color:#fff;box-shadow:0 4px 0 var(--violet-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--violet-d)}

/* 入力欄（遊んでいるとき） */
#typing{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(12px,env(safe-area-inset-top)) + 64px);z-index:15;width:min(420px,calc(100% - 24px));
  display:flex;flex-direction:column;gap:6px;align-items:stretch}
#typing .target{color:#fff;font-family:var(--pop);font-size:1.05rem;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}

  box-shadow:0 0 0 2px rgba(255,241,184,.0),0 8px 24px rgba(0,0,0,.35);transition:box-shadow .2s}

<body>
<canvas id="cv" aria-label="夜空"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>流れ星に3回</h1>
  <p>流れ星が消えるまでに、願いごとを3回となえると叶う。……らしい。今夜は5つ流れます。打ちこむ速さで、願いをとどけよう。</p>
  <div class="wish">
    <label for="wish">願いごと（10文字まで）</label>
    <input id="wish" maxlength="10" autocomplete="off" placeholder="しあわせ">
    <div class="chips" id="chips"></div>
  </div>
  <button class="btn" id="start" type="button">夜空を見上げる</button>
  <div class="best" id="best"></div>
</section>

<div id="typing" hidden>
  <div class="target">「<b id="tWish"></b>」を3回</div>
  <input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="願いごとを入力">
  <div class="slots" id="slots"><span>★</span><span>★</span><span>★</span></div>
</div>

<section class="sheet" id="result" hidden>
  <div class="rank"><small>「<span id="rWish"></span>」がとどいた流れ星</small></div>
  <div class="big" id="rBig">0<small> / 5</small></div>
  <div class="stars" id="rStars"></div>
  <div class="rank"><small>あなたの願い、叶う確率は</small><b id="rRank"></b></div>
  <div class="note" id="rNote"></div>
  <div class="row"><button class="btn x" id="xBtn" type="button">𝕏 にポスト</button><button class="btn sub" id="imgBtn" type="button">画像で保存</button></div>
  <button class="btn" id="again" type="button">もう一晩</button>
</section>
<div class="toast" id="toast" hidden></div>

<script>
/* ==== KIT：BGM・効果音・保存・シェアの共通部品（各ゲームに埋め込んで使う） ==== */
const KIT = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- 音 ---------- */
  let ctx = null, master, musicBus, sfxBus, verb, muted = store.get("picoruno-mute", false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      // 残響（生成したインパルス応答）
      verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = ir;
      const vg = ctx.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const now = () => (ctx ? ctx.currentTime : 0);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* 1音。f: 周波数, to: 終わりの周波数, t: 開始までの秒, dur: 長さ */
  function tone(o) {
    if (!ensure()) return;
    const { f = 440, to = null, t = 0, dur = 0.2, type = "sine", vol = 0.3, a = 0.005, rel = null, bus = sfxBus, wet = 0.15, lp = null, detune = 0, pan = 0 } = o;
    const s = now() + t, g = ctx.createGain(), osc = ctx.createOscillator();
    osc.type = type; osc.frequency.setValueAtTime(f, s); osc.detune.value = detune;
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.linearRampToValueAtTime(vol, s + a);
    g.gain.exponentialRampToValueAtTime(0.0001, s + (rel || dur));
    let node = osc;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; node.connect(fl); node = fl; }
    node.connect(g);
    let out = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(verb); }
    osc.start(s); osc.stop(s + (rel || dur) + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ensure()) return;
    const { t = 0, dur = 0.2, vol = 0.3, f = 1200, to = null, q = 0.8, type = "bandpass", a = 0.004, bus = sfxBus, wet = 0.1 } = o;
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = now() + t, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, s); fl.Q.value = q;
    if (to) fl.frequency.exponentialRampToValueAtTime(to, s + dur);
    g.gain.setValueAtTime(0.0001, s); g.gain.linearRampToValueAtTime(vol, s + a); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    src.connect(fl); fl.connect(g); g.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
    src.start(s, Math.random()); src.stop(s + dur + 0.05);
  }

  /* 楽器 */
  const inst = {
    epiano(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 1.6, vol: v, type: "sine", bus: musicBus, wet: 0.25, a: 0.004 }); tone({ f: f * 2, t, dur: 0.5, vol: v * 0.35, type: "sine", bus: musicBus, wet: 0.2 }); tone({ f: f * 3.01, t, dur: 0.18, vol: v * 0.12, type: "sine", bus: musicBus, wet: 0.1 }); },
    bell(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 2.2, vol: v, bus: musicBus, wet: 0.35 }); tone({ f: f * 3.98, t, dur: 0.35, vol: v * 0.25, bus: musicBus, wet: 0.35 }); },
    marimba(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: 0.45, vol: v, bus: musicBus, wet: 0.2 }); tone({ f: f * 4, t, dur: 0.07, vol: v * 0.3, bus: musicBus, wet: 0.1 }); },
    pluck(m, t, d, v) { tone({ f: mtof(m), t, dur: Math.min(0.6, d * 1.2), vol: v, type: "triangle", lp: 2400, bus: musicBus, wet: 0.25 }); },
    flute(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.95, vol: v * 0.8, type: "sine", a: 0.06, bus: musicBus, wet: 0.4 }); tone({ f: mtof(m) * 2, t, dur: d * 0.9, vol: v * 0.08, type: "triangle", a: 0.08, bus: musicBus, wet: 0.4 }); },
    chip(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.45, type: "square", lp: 3000, bus: musicBus, wet: 0.08 }); },
    pad(m, t, d, v) { const f = mtof(m); for (const dt of [-7, 7]) tone({ f, t, dur: d, vol: v * 0.5, type: "sawtooth", a: d * 0.35, lp: 900, detune: dt, bus: musicBus, wet: 0.5 }); },
    koto(m, t, d, v) { const f = mtof(m); tone({ f, to: f * 0.995, t, dur: 0.9, vol: v, type: "triangle", lp: 3200, a: 0.002, bus: musicBus, wet: 0.35 }); tone({ f: f * 2, t, dur: 0.25, vol: v * 0.3, type: "sine", bus: musicBus, wet: 0.2 }); },
    bass(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v, type: "triangle", lp: 600, bus: musicBus, wet: 0 }); tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.6, type: "sine", bus: musicBus, wet: 0 }); },
    kick(t, v) { tone({ f: 130, to: 42, t, dur: 0.28, vol: v, type: "sine", bus: musicBus, wet: 0 }); },
    snare(t, v) { noise({ t, dur: 0.16, vol: v * 0.6, f: 1900, q: 0.7, bus: musicBus, wet: 0.2 }); },
    hat(t, v) { noise({ t, dur: 0.04, vol: v * 0.35, f: 8000, type: "highpass", bus: musicBus, wet: 0 }); },
    shaker(t, v) { noise({ t, dur: 0.07, vol: v * 0.25, f: 6000, q: 2, bus: musicBus, wet: 0.05 }); }
  };

  /* ---------- BGM（シード付きの自動作曲。4小節のフレーズをくりかえす） ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  let song = null, timer = null, nextT = 0, step = 0;
  /* opts: {bpm, key(midi), chords:[[度数...]...], lead, chord, beat:"lofi"|"waltz"|"none"|"chip"|"shaker", seed, scale:[...], swing, leadVol, density} */
  function musicStart(opts) {
    if (!ensure()) return;
    musicStop();
    const r = rng(opts.seed || 7);
    const scale = opts.scale || [0, 2, 4, 7, 9];      // ペンタトニック
    const beats = opts.beat === "waltz" ? 3 : 4;
    const steps = beats * 4;                           // 16分音符
    // 4小節ぶんのメロディを作る（2小節目と4小節目は少し変える）
    const motif = [];
    for (let bar = 0; bar < 4; bar++) {
      const line = [];
      let deg = Math.floor(r() * scale.length);
      for (let s = 0; s < steps; s++) {
        const strong = s % 4 === 0;
        if (r() < (strong ? 0.62 : 0.2) * (opts.density || 1)) {
          deg = Math.max(0, Math.min(scale.length * 2 - 1, deg + Math.floor(r() * 5) - 2));
          const len = strong && r() < 0.5 ? 4 : 2;
          line.push({ s, deg, len });
        }
      }
      motif.push(line);
    }
    motif[2] = motif[0].map(n => ({ ...n }));          // 3小節目は1小節目のくりかえし
    song = { ...opts, beats, steps, motif, scale };
    nextT = now() + 0.1; step = 0;
    timer = setInterval(schedule, 40);
  }
  function schedule() {
    if (!song || !ctx) return;
    const spb = 60 / song.bpm, sixteenth = spb / 4;
    while (nextT < now() + 0.25) {
      const bar = Math.floor(step / song.steps), s = step % song.steps;
      const chordDegs = song.chords[bar % song.chords.length];
      const key = song.key || 60;
      const sw = (s % 2 === 1) ? (song.swing || 0) * sixteenth : 0;
      const t = nextT + sw - now();
      // コード
      if (s === 0) chordDegs.forEach((d, i) => (inst[song.chord || "epiano"])(key + d, t + i * 0.012, spb * song.beats * 0.9, (song.chordVol || 0.08)));
      if (song.beat === "waltz" && (s === 4 || s === 8)) chordDegs.slice(1).forEach(d => inst[song.chord || "epiano"](key + d, t, spb * 0.8, (song.chordVol || 0.08) * 0.6));
      // ベース
      if (song.bassOn !== false) {
        if (s === 0) inst.bass(key - 24 + chordDegs[0], t, spb * 1.8, 0.22);
        if (song.beat !== "waltz" && s === 8) inst.bass(key - 24 + chordDegs[0] + (bar % 2 ? 7 : 0), t, spb * 1.6, 0.18);
      }
      // リズム
      const bt = song.beat || "lofi";
      if (bt === "lofi") { if (s === 0 || s === 10) inst.kick(t, 0.38); if (s === 4 || s === 12) inst.snare(t, 0.25); if (s % 2 === 0) inst.hat(t, s % 4 === 2 ? 0.5 : 0.3); }
      else if (bt === "chip") { if (s % 4 === 0) inst.kick(t, 0.3); if (s === 4 || s === 12) inst.snare(t, 0.2); if (s % 2 === 1) inst.hat(t, 0.3); }
      else if (bt === "waltz") { if (s === 0) inst.kick(t, 0.25); if (s === 4 || s === 8) inst.shaker(t, 0.6); }
      else if (bt === "shaker") { if (s % 2 === 0) inst.shaker(t, s % 4 === 0 ? 0.7 : 0.4); if (s === 0) inst.kick(t, 0.2); }
      // メロディ
      if (song.lead) {
        const line = song.motif[bar % 4];
        for (const n of line) if (n.s === s) {
          const oct = Math.floor(n.deg / song.scale.length), d = song.scale[n.deg % song.scale.length];
          inst[song.lead](key + 12 + oct * 12 + d, t, sixteenth * n.len, song.leadVol || 0.1);
        }
      }
      nextT += sixteenth; step++;
    }
  }
  function musicStop() { if (timer) clearInterval(timer); timer = null; song = null; }
  function setMuted(m) {
    muted = m; store.set("picoruno-mute", m);
    if (master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
  }

  /* ---------- そのほか ---------- */
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function tweet(text, url) {
    const u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + (url ? "&url=" + encodeURIComponent(url) : "");
    window.open(u, "_blank", "noopener");
  }
  async function shareImage(canvas, name, text) {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], name, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return "shared"; }
    } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return "downloaded";
  }
  function loadImages(map) {
    const out = {};
    return Promise.all(Object.entries(map).map(([k, src]) => new Promise(res => {
      const im = new Image(); im.onload = () => { out[k] = im; res(); }; im.onerror = () => { out[k] = null; res(); }; im.src = src;
    }))).then(() => out);
  }

  /* 遊んだ回数を数える（トップページの ▶ 回数）。同じタブでの再読みこみは1回だけ。 */
  function countPlay(G) {

function romaji(s) {
  let out = "", i = 0;
  while (i < s.length) {
    const c = s[i];
    if (!/[a-z'\-]/.test(c)) { out += c; i++; continue; }
    if (c === s[i + 1] && /[bcdfghjkmpqrstvwxyz]/.test(c)) { out += "っ"; i++; continue; }
    let hit = false;
    for (const n of [3, 2, 1]) { const k = s.substr(i, n); if (ROMA[k]) { out += ROMA[k]; i += n; hit = true; break; } }
    if (!hit) { if (c === "n" && i + 1 < s.length && !/[aiueoy]/.test(s[i + 1])) { out += "ん"; i++; } else { out += c; i++; } }
  }
  return out;
}

  s = s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

}

function buildSky() {
  // 背景の空（グラデーション＋天の川）は一度だけ描いておく

  const x = lerp(p.x0, p.x1, k), y = lerp(p.y0, p.y1, k);
  const blink = Math.sin(S.t * 9) > 0.6;
  g.fillStyle = "rgba(255,255,255,.85)"; g.beginPath(); g.arc(x, y, 1.6, 0, 6.283); g.fill();
  if (blink) { g.fillStyle = "rgba(255,70,60,.95)"; g.beginPath(); g.arc(x - 6, y + 1, 2.2, 0, 6.283); g.fill(); }
  else { g.fillStyle = "rgba(90,255,120,.8)"; g.beginPath(); g.arc(x + 6, y + 1, 1.8, 0, 6.283); g.fill(); }
}
function drawHud(g) {
  const sf = KIT.safe(), top = 12 + sf.top;
  g.fillStyle = "rgba(11,18,48,.55)"; rr(g, 12, top, Math.min(vw - 80, 360), 50, 16); g.fill();
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "left"; g.font = '700 19px "Kaisei Decol",serif';
  g.fillText(`流れ星 ${Math.min(S.idx + 1, NSTAR)} / ${NSTAR}`, 28, top + 26);
  for (let i = 0; i < NSTAR; i++) {
    const r = S.results[i];
    g.fillStyle = r == null ? "rgba(255,255,255,.22)" : r >= 3 ? "#fff1b8" : "rgba(255,255,255,.55)";
    g.font = '16px sans-serif'; g.fillText(r != null && r >= 3 ? "★" : "☆", Math.min(vw - 80, 360) - 110 + i * 20, top + 26);
  }
  // 流れ星の残り時間
  const s = S.star;
  if (s && !s.done) {
    const k = clamp(1 - (S.t - s.t0) / s.dur, 0, 1), y = $("slots").getBoundingClientRect().bottom + 10;
    g.fillStyle = "rgba(255,255,255,.18)"; rr(g, vw / 2 - 100, y, 200, 6, 3); g.fill();
    g.fillStyle = k < 0.3 ? "#ff9a7a" : "#fff1b8"; rr(g, vw / 2 - 100, y, 200 * k, 6, 3); g.fill();
  }
  if (S.msg && S.t - S.msg.at < S.msg.dur) {
    const al = clamp((S.msg.dur - (S.t - S.msg.at)) / 0.3, 0, 1);
    g.globalAlpha = al; g.font = '700 19px "Zen Maru Gothic",sans-serif'; g.textAlign = "center";
    const tw = g.measureText(S.msg.text).width + 40, y = vh * 0.5;
    g.fillStyle = "rgba(11,18,48,.75)"; rr(g, vw / 2 - tw / 2, y, tw, 46, 23); g.fill();
    g.fillStyle = "#fff"; g.fillText(S.msg.text, vw / 2, y + 24);
    g.globalAlpha = 1;
  }
}
// 地面は高さを画面の一定割合までにおさえ、横が足りないぶんは左右反転してつなぐ
function drawLand(g, W, H, maxH) {
  const iw = IMG.land.width, ih = IMG.land.height, sc = Math.min(W / iw, (H * maxH) / ih);
  const w = iw * sc, h = ih * sc, x0 = (W - w) / 2, y = H - h;
  g.drawImage(IMG.land, x0, y, w, h);
  for (let i = 1; x0 - (i - 1) * w > 0 || x0 + i * w < W; i++) {
    g.save(); g.translate(x0 - (i - 1) * w, 0); g.scale(i % 2 ? -1 : 1, 1); g.drawImage(IMG.land, i % 2 ? 0 : -w, y, w, h); g.restore();
    g.save(); g.translate(x0 + (i + 1) * w, 0); g.scale(i % 2 ? -1 : 1, 1); g.drawImage(IMG.land, i % 2 ? 0 : -w, y, w, h); g.restore();
  }
}
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function say(text, dur = 1.8) { S.msg = { text, at: S.t, dur }; }

/* ---------- 進行 ---------- */
let last = performance.now();
function frame(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(frame); }
function update(dt) {
  S.t += dt; S.shake = Math.max(0, S.shake - dt * 30);
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt * q.dec; }
  S.parts = S.parts.filter(q => q.life > 0);
  for (const w of S.words) { w.y -= dt * 18; w.life -= dt * 0.12; }
  S.words = S.words.filter(w => w.life > 0);
  if (S.state !== "play") return;
  const ev = S.events[S.evi];
  if (S.plane && S.t - S.plane.t0 > S.plane.dur) S.plane = null;
  if (!S.star && ev && S.t >= ev.at) {
    S.evi++;
    if (ev.kind === "plane") spawnPlane(); else spawnStar();
  }
  const s = S.star;
  if (s && !s.done && S.t - s.t0 >= s.dur) { endStar(false); }
  if (s && s.done && S.t - s.doneAt > 1.4) {
    S.star = null;
    if (S.idx >= NSTAR) finish();
    else { S.events[S.evi] && (S.events[S.evi].at = S.t + S.events[S.evi].gap); }
  }
}
function spawnStar() {
  const len = [...S.target].length;
  const dur = Math.max(1.6, len * 3 * PER_CHAR[S.idx]);
  const fromLeft = Math.random() < 0.5;
  const x0 = fromLeft ? vw * (0.05 + Math.random() * 0.3) : vw * (0.65 + Math.random() * 0.3);
  const y0 = vh * (0.22 + Math.random() * 0.12);
  const dx = (fromLeft ? 1 : -1) * vw * (0.35 + Math.random() * 0.25);
  S.star = { t0: S.t, dur, x0, y0, x1: x0 + dx, y1: y0 + vh * (0.12 + Math.random() * 0.12), done: false };
  S.count = 0; setSlots(0);
  $("tin").value = ""; S.typedBase = "";
  // キラーン
  [0, 4, 7, 11, 14, 19].forEach((d, i) => KIT.inst.bell(79 + d, i * 0.04, 0.3, 0.06));
  KIT.noise({ dur: 0.6, vol: 0.05, f: 6000, to: 9000, q: 2 });
  focusInput();
}
function spawnPlane() {
  const y = vh * (0.2 + Math.random() * 0.15);
  S.plane = { t0: S.t, dur: 7, x0: -20, y0: y, x1: vw + 20, y1: y - 40 };
  S.planeTyped = false;
  // 飛行機が飛んでいるあいだに、本物の星が来る
  const n = S.events[S.evi]; if (n) n.at = S.t + 3.2 + Math.random() * 1.5;
}
function endStar(ok) {
  const s = S.star; if (!s || s.done) return;
  s.done = true; s.doneAt = S.t;
  S.results[S.idx] = S.count; S.idx++;
  if (ok) {
    say("願いがとどいた！", 1.4);
    [0, 4, 7, 12, 16, 19].forEach((d, i) => KIT.inst.bell(72 + d, 0.02 + i * 0.07, 0.6, 0.12));
    for (let i = 0; i < 50; i++) { const a = Math.random() * 6.28, v = 40 + Math.random() * 160; S.parts.push({ x: s.hx, y: s.hy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 1 + Math.random() * 1.8, life: 1.4, dec: 1, c: ["#fff1b8", "#ffffff", "#c9d8ff"][i % 3] }); }
    S.words.push({ text: S.wish, x: clamp(s.hx, 80, vw - 80), y: clamp(s.hy, 120, vh * 0.5), size: 30, life: 3 });
    KIT.vibrate([20, 40, 20]);
  } else {
    say(`まにあわなかった…（${S.count}/3）`, 1.4);
    KIT.inst.bell(64, 0, 0.6, 0.06); KIT.inst.bell(59, 0.15, 0.8, 0.06);
  }
}
function setSlots(n) { [...$("slots").children].forEach((s, i) => s.classList.toggle("on", i < n)); }
function focusInput() { try { $("tin").focus({ preventScroll: true }); } catch (e) { $("tin").focus(); } }

/* 入力 */
let composing = false;
const tin = $("tin");
tin.addEventListener("compositionstart", () => composing = true);
tin.addEventListener("compositionend", () => { composing = false; check(); });
tin.addEventListener("input", e => { if (!e.isComposing && !composing) check(); else checkPreview(); });
tin.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); check(true); } });
function check(enter) {
  if (S.state !== "play") return;
  const v = norm(tin.value);
  if (S.plane && !S.star && v.length > 0 && !S.planeTyped) { S.planeTyped = true; say("それは飛行機です", 1.6); KIT.tone({ f: 330, to: 220, dur: 0.25, vol: 0.08, type: "triangle" }); tin.value = ""; return; }
  const s = S.star; if (!s || s.done) { if (v) tin.value = ""; return; }
  // 1回ぶん打てたら数えて、入力欄を空にする
  let n = 0, i = 0;
  while ((i = v.indexOf(S.target, i)) !== -1) { n++; i += S.target.length; }
  if (n > 0) {
    tin.value = "";
    for (let k = 0; k < n && S.count < 3; k++) {
      S.count++; setSlots(S.count);
      KIT.inst.bell(76 + [0, 4, 7][S.count - 1], 0, 0.3, 0.12);
    }
    tin.classList.add("hit"); setTimeout(() => tin.classList.remove("hit"), 180);
    if (S.count >= 3) endStar(true);
  } else if (enter && v.length) { tin.value = ""; KIT.tone({ f: 200, dur: 0.08, vol: 0.06, type: "square", lp: 800 }); }
  else if (v.length && Math.random() < 0.6) KIT.tone({ f: 1400 + Math.random() * 400, dur: 0.03, vol: 0.03, type: "sine", wet: 0 });
}
function checkPreview() { if (Math.random() < 0.5) KIT.tone({ f: 1200 + Math.random() * 400, dur: 0.03, vol: 0.025, type: "sine", wet: 0 }); }
cv.addEventListener("pointerdown", () => { if (S.state === "play") focusInput(); });

function startGame() {
  KIT.ensure();
  const w = ($("wish").value || "").replace(/\s/g, "").slice(0, 10) || "しあわせ";
  S.wish = w; S.target = norm(w);
  if (!S.target) { S.wish = "しあわせ"; S.target = norm(S.wish); }
  KIT.store.set("nb-wish", S.wish);
  $("tWish").textContent = S.wish;
  $("title").hidden = true; $("result").hidden = true; $("typing").hidden = false;
  S.state = "play"; S.idx = 0; S.results = []; S.star = null; S.plane = null; S.evi = 0; S.words = [];
  // 5つの流れ星と、1回だけ飛行機
  const planeAt = 1 + Math.floor(Math.random() * 3);
  S.events = [];
  for (let i = 0; i < NSTAR; i++) { if (i === planeAt) S.events.push({ kind: "plane", gap: 1.5 }); S.events.push({ kind: "star", gap: 1.6 + Math.random() * 2.2 }); }
  S.events[0].at = S.t + 2.2;
  for (let i = 1; i < S.events.length; i++) S.events[i].at = 1e9;
  setSlots(0);
  focusInput();
  say("流れ星を待とう…", 2);
  startMusic(false); KIT.countPlay(GAME_TITLE);
}

const RANKS = [[5, "100%（ほぼ確定）"], [4, "80%"], [3, "60%"], [2, "40%"], [1, "20%"], [0, "0%（自力でがんばろう）"]];
function finish() {
  S.state = "result";
  $("typing").hidden = true; tin.blur();
  const ok = S.results.filter(n => n >= 3).length;
  S.ok = ok; S.rank = RANKS.find(r => ok >= r[0])[1];
  $("rWish").textContent = S.wish;
  $("rBig").innerHTML = `${ok}<small> / ${NSTAR}</small>`;
  $("rStars").innerHTML = S.results.map(n => `<span class="${n >= 3 ? "on" : ""}">★</span>`).join("");
  $("rRank").textContent = S.rank;
  const words = S.results.reduce((a, n) => a + n, 0);
  const best = KIT.store.get("nb-best", 0);
  if (ok > best) KIT.store.set("nb-best", ok);
  $("rNote").textContent = `となえた回数 ${words}回 ／ 自己ベスト ${Math.max(best, ok)}つ`;
  $("result").hidden = false;
  KIT.music.stop(); setTimeout(() => startMusic(true), 500);
}
function shareText() { return `流れ星に3回、「${S.wish}」と願った結果\n${NSTAR}つ中${S.ok}つにとどきました${"★".repeat(S.ok)}${"☆".repeat(NSTAR - S.ok)}\n叶う確率 ${S.rank}\n#流れ星に3回`; }
function shareCanvas() {
  const c = document.createElement("canvas"); c.width = 1200; c.height = 630;
  const g = c.getContext("2d");
  if (sky) g.drawImage(sky, 0, 0, sky.width, sky.height * 0.6, 0, 0, 1200, 630);
  const r = KIT.rng(5);
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(255,255,255,${0.3 + r() * 0.7})`; g.beginPath(); g.arc(r() * 1200, r() * 520, r() < 0.1 ? 2 : 1, 0, 6.283); g.fill(); }
  if (IMG.land) drawLand(g, 1200, 630, 0.42);
  // 流れ星
  const gr = g.createLinearGradient(160, 90, 520, 230); gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(1, "rgba(255,250,220,.95)");
  g.strokeStyle = gr; g.lineWidth = 4; g.lineCap = "round"; g.beginPath(); g.moveTo(160, 90); g.lineTo(520, 230); g.stroke();
  const rg = g.createRadialGradient(520, 230, 0, 520, 230, 30); rg.addColorStop(0, "#fffbe8"); rg.addColorStop(1, "rgba(255,240,190,0)"); g.fillStyle = rg; g.beginPath(); g.arc(520, 230, 30, 0, 6.283); g.fill();
  g.textAlign = "center"; g.fillStyle = "#fff6d0"; g.shadowColor = "rgba(255,241,184,.9)"; g.shadowBlur = 20;
  g.font = '700 64px "Kaisei Decol",serif'; g.fillText(`「${S.wish}」`, 600, 330); g.shadowBlur = 0;
  g.fillStyle = "#fff"; g.font = '700 34px "Kaisei Decol",serif'; g.fillText(`${NSTAR}つの流れ星のうち ${S.ok}つにとどいた`, 600, 400);
  g.fillStyle = "#fff1b8"; g.font = '40px sans-serif'; g.fillText("★".repeat(S.ok) + "☆".repeat(NSTAR - S.ok), 600, 456);
  g.fillStyle = "rgba(255,255,255,.85)"; g.font = '700 26px "Zen Maru Gothic",sans-serif'; g.fillText(`叶う確率 ${S.rank}　#流れ星に3回 ・ picoruno.`, 600, 600);
  return c;
}
function startMusic(calm) {
  KIT.music.start(calm
    ? { bpm: 60, key: 61, chords: [[0, 4, 7, 11], [5, 9, 12, 16], [9, 12, 16, 19], [7, 11, 14, 17]], lead: "bell", chord: "pad", beat: "none", seed: 61, leadVol: 0.06, density: 0.5, chordVol: 0.07 }
    : { bpm: 66, key: 61, chords: [[0, 4, 7, 11], [9, 12, 16, 19], [5, 9, 12, 16], [7, 11, 14, 17]], lead: "bell", chord: "pad", beat: "none", seed: 18, leadVol: 0.05, density: 0.6, chordVol: 0.08, bassOn: false });
}

/* ---------- ボタン ---------- */
$("chips").innerHTML = PRESETS.map(p => `<button type="button">${p}</button>`).join("");
$("chips").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { $("wish").value = b.textContent; KIT.tone({ f: 1200, dur: 0.05, vol: 0.05, type: "sine" }); } });
$("start").addEventListener("click", startGame);
$("wish").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) startGame(); });
$("again").addEventListener("click", () => { $("result").hidden = true; $("title").hidden = false; S.state = "title"; });
$("xBtn").addEventListener("click", () => KIT.tweet(shareText(), GAME_URL));
$("imgBtn").addEventListener("click", async () => { const r = await KIT.shareImage(shareCanvas(), "nagareboshi.png", shareText()); if (r === "downloaded") toast("画像を保存しました"); });
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => t.hidden = true, 1800); }
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function muteIcon() { $("mute").innerHTML = KIT.muted ? ICON_OFF : ICON_ON; $("mute").setAttribute("aria-pressed", KIT.muted); }
$("mute").addEventListener("click", () => { KIT.setMuted(!KIT.muted); muteIcon(); if (!KIT.muted) KIT.ensure(); });

(async function boot() {
  resize(); muteIcon();
  $("wish").value = KIT.store.get("nb-wish", "");
  const best = KIT.store.get("nb-best", 0);
  $("best").textContent = best ? `自己ベスト ${best} / ${NSTAR}つ` : "5つの流れ星に、願いをとどけよう";
  IMG = await KIT.loadImages(SRC);
  requestAnimationFrame(frame);
})();
window.__S = S; window.__N = { norm, romaji };
</script>
