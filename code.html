<style>
/* 画面：真上から見たトートバッグの中（Blender）。プラグも Blender。ケーブルはゲームで、光の向きをそろえて描く。 */

  --ground:#4a4836; --card:#fffaf2; --ink:#3e3a2c; --sub:#857e69; --line:#e8e1cc;
  --main:#e07a5c; --main-d:#b0563d; --warn:#c0492f; --ok:#5d8f4e;
  --pop:"M PLUS Rounded 1c","Zen Maru Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;

}
html,body{margin:0;height:100%;background:var(--ground);overflow:hidden}

  border:2px solid rgba(255,255,255,.85);background:rgba(40,38,28,.45);color:#fff;cursor:pointer;display:grid;place-items:center}

.sheet{position:fixed;left:50%;transform:translateX(-50%);z-index:20;width:min(430px,calc(100% - 24px));box-sizing:border-box;background:var(--card);border-radius:20px;
  box-shadow:0 18px 50px rgba(30,28,20,.45);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 24px);overflow-y:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;
  font-family:var(--pop);font-weight:800;font-size:1.1rem;background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main-d);transition:transform .08s,box-shadow .08s}

<body>
<canvas id="cv" aria-label="ゲーム画面"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>コードほどき</h1>
  <p>カバンの中で、充電ケーブルがからまった。上にのっているものから順に引きぬいて、ぜんぶほどこう。カバンは3つ。</p>
  <div class="how">
    <b>ぬく</b><span>ケーブルをタップすると、近いほうのはしから引きぬく</span>
    <b>順番</b><span>ほかのケーブルの下じきになっていると、引っかかる（+2秒）</span>
    <b>見る</b><span>重なっている所を見て、いちばん上のものを探そう</span>
  </div>
  <button class="btn" id="start" type="button">カバンをあける</button>
  <div class="best" id="best"></div>
</section>

<section class="sheet" id="result" hidden>
  <div class="cap">3つのカバン、ぜんぶほどいた時間</div>
  <div class="big" id="rBig">0<small>秒</small></div>
  <div class="rank" id="rRank"></div>
  <div class="stats" id="rStats"></div>
  <div class="note" id="rNote"></div>
  <div class="row"><button class="btn x" id="xBtn" type="button">𝕏 にポスト</button><button class="btn sub" id="imgBtn" type="button">画像で保存</button></div>
  <button class="btn" id="again" type="button">もう一度からませる</button>
</section>
<div class="toast" id="toast" hidden></div>

<script>
/* ==== KIT：BGM・効果音・保存・シェアの共通部品（各ゲームに埋め込んで使う） ==== */
const KIT = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- 音 ---------- */
  let ctx = null, master, musicBus, sfxBus, verb, muted = store.get("picoruno-mute", false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      // 残響（生成したインパルス応答）
      verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = ir;
      const vg = ctx.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const now = () => (ctx ? ctx.currentTime : 0);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* 1音。f: 周波数, to: 終わりの周波数, t: 開始までの秒, dur: 長さ */
  function tone(o) {
    if (!ensure()) return;
    const { f = 440, to = null, t = 0, dur = 0.2, type = "sine", vol = 0.3, a = 0.005, rel = null, bus = sfxBus, wet = 0.15, lp = null, detune = 0, pan = 0 } = o;
    const s = now() + t, g = ctx.createGain(), osc = ctx.createOscillator();
    osc.type = type; osc.frequency.setValueAtTime(f, s); osc.detune.value = detune;
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.linearRampToValueAtTime(vol, s + a);
    g.gain.exponentialRampToValueAtTime(0.0001, s + (rel || dur));
    let node = osc;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; node.connect(fl); node = fl; }
    node.connect(g);
    let out = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(verb); }
    osc.start(s); osc.stop(s + (rel || dur) + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ensure()) return;
    const { t = 0, dur = 0.2, vol = 0.3, f = 1200, to = null, q = 0.8, type = "bandpass", a = 0.004, bus = sfxBus, wet = 0.1 } = o;
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = now() + t, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, s); fl.Q.value = q;
    if (to) fl.frequency.exponentialRampToValueAtTime(to, s + dur);
    g.gain.setValueAtTime(0.0001, s); g.gain.linearRampToValueAtTime(vol, s + a); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    src.connect(fl); fl.connect(g); g.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
    src.start(s, Math.random()); src.stop(s + dur + 0.05);
  }

  /* 楽器 */
  const inst = {
    epiano(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 1.6, vol: v, type: "sine", bus: musicBus, wet: 0.25, a: 0.004 }); tone({ f: f * 2, t, dur: 0.5, vol: v * 0.35, type: "sine", bus: musicBus, wet: 0.2 }); tone({ f: f * 3.01, t, dur: 0.18, vol: v * 0.12, type: "sine", bus: musicBus, wet: 0.1 }); },
    bell(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 2.2, vol: v, bus: musicBus, wet: 0.35 }); tone({ f: f * 3.98, t, dur: 0.35, vol: v * 0.25, bus: musicBus, wet: 0.35 }); },
    marimba(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: 0.45, vol: v, bus: musicBus, wet: 0.2 }); tone({ f: f * 4, t, dur: 0.07, vol: v * 0.3, bus: musicBus, wet: 0.1 }); },
    pluck(m, t, d, v) { tone({ f: mtof(m), t, dur: Math.min(0.6, d * 1.2), vol: v, type: "triangle", lp: 2400, bus: musicBus, wet: 0.25 }); },
    flute(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.95, vol: v * 0.8, type: "sine", a: 0.06, bus: musicBus, wet: 0.4 }); tone({ f: mtof(m) * 2, t, dur: d * 0.9, vol: v * 0.08, type: "triangle", a: 0.08, bus: musicBus, wet: 0.4 }); },
    chip(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.45, type: "square", lp: 3000, bus: musicBus, wet: 0.08 }); },
    pad(m, t, d, v) { const f = mtof(m); for (const dt of [-7, 7]) tone({ f, t, dur: d, vol: v * 0.5, type: "sawtooth", a: d * 0.35, lp: 900, detune: dt, bus: musicBus, wet: 0.5 }); },
    koto(m, t, d, v) { const f = mtof(m); tone({ f, to: f * 0.995, t, dur: 0.9, vol: v, type: "triangle", lp: 3200, a: 0.002, bus: musicBus, wet: 0.35 }); tone({ f: f * 2, t, dur: 0.25, vol: v * 0.3, type: "sine", bus: musicBus, wet: 0.2 }); },
    bass(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v, type: "triangle", lp: 600, bus: musicBus, wet: 0 }); tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.6, type: "sine", bus: musicBus, wet: 0 }); },
    kick(t, v) { tone({ f: 130, to: 42, t, dur: 0.28, vol: v, type: "sine", bus: musicBus, wet: 0 }); },
    snare(t, v) { noise({ t, dur: 0.16, vol: v * 0.6, f: 1900, q: 0.7, bus: musicBus, wet: 0.2 }); },
    hat(t, v) { noise({ t, dur: 0.04, vol: v * 0.35, f: 8000, type: "highpass", bus: musicBus, wet: 0 }); },
    shaker(t, v) { noise({ t, dur: 0.07, vol: v * 0.25, f: 6000, q: 2, bus: musicBus, wet: 0.05 }); }
  };

  /* ---------- BGM（シード付きの自動作曲。4小節のフレーズをくりかえす） ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  let song = null, timer = null, nextT = 0, step = 0;
  /* opts: {bpm, key(midi), chords:[[度数...]...], lead, chord, beat:"lofi"|"waltz"|"none"|"chip"|"shaker", seed, scale:[...], swing, leadVol, density} */
  function musicStart(opts) {
    if (!ensure()) return;
    musicStop();
    const r = rng(opts.seed || 7);
    const scale = opts.scale || [0, 2, 4, 7, 9];      // ペンタトニック
    const beats = opts.beat === "waltz" ? 3 : 4;
    const steps = beats * 4;                           // 16分音符
    // 4小節ぶんのメロディを作る（2小節目と4小節目は少し変える）
    const motif = [];
    for (let bar = 0; bar < 4; bar++) {
      const line = [];
      let deg = Math.floor(r() * scale.length);
      for (let s = 0; s < steps; s++) {
        const strong = s % 4 === 0;
        if (r() < (strong ? 0.62 : 0.2) * (opts.density || 1)) {
          deg = Math.max(0, Math.min(scale.length * 2 - 1, deg + Math.floor(r() * 5) - 2));
          const len = strong && r() < 0.5 ? 4 : 2;
          line.push({ s, deg, len });
        }
      }
      motif.push(line);
    }
    motif[2] = motif[0].map(n => ({ ...n }));          // 3小節目は1小節目のくりかえし
    song = { ...opts, beats, steps, motif, scale };
    nextT = now() + 0.1; step = 0;
    timer = setInterval(schedule, 40);
  }
  function schedule() {
    if (!song || !ctx) return;
    const spb = 60 / song.bpm, sixteenth = spb / 4;
    while (nextT < now() + 0.25) {
      const bar = Math.floor(step / song.steps), s = step % song.steps;
      const chordDegs = song.chords[bar % song.chords.length];
      const key = song.key || 60;
      const sw = (s % 2 === 1) ? (song.swing || 0) * sixteenth : 0;
      const t = nextT + sw - now();
      // コード
      if (s === 0) chordDegs.forEach((d, i) => (inst[song.chord || "epiano"])(key + d, t + i * 0.012, spb * song.beats * 0.9, (song.chordVol || 0.08)));
      if (song.beat === "waltz" && (s === 4 || s === 8)) chordDegs.slice(1).forEach(d => inst[song.chord || "epiano"](key + d, t, spb * 0.8, (song.chordVol || 0.08) * 0.6));
      // ベース
      if (song.bassOn !== false) {
        if (s === 0) inst.bass(key - 24 + chordDegs[0], t, spb * 1.8, 0.22);
        if (song.beat !== "waltz" && s === 8) inst.bass(key - 24 + chordDegs[0] + (bar % 2 ? 7 : 0), t, spb * 1.6, 0.18);
      }
      // リズム
      const bt = song.beat || "lofi";
      if (bt === "lofi") { if (s === 0 || s === 10) inst.kick(t, 0.38); if (s === 4 || s === 12) inst.snare(t, 0.25); if (s % 2 === 0) inst.hat(t, s % 4 === 2 ? 0.5 : 0.3); }
      else if (bt === "chip") { if (s % 4 === 0) inst.kick(t, 0.3); if (s === 4 || s === 12) inst.snare(t, 0.2); if (s % 2 === 1) inst.hat(t, 0.3); }
      else if (bt === "waltz") { if (s === 0) inst.kick(t, 0.25); if (s === 4 || s === 8) inst.shaker(t, 0.6); }
      else if (bt === "shaker") { if (s % 2 === 0) inst.shaker(t, s % 4 === 0 ? 0.7 : 0.4); if (s === 0) inst.kick(t, 0.2); }
      // メロディ
      if (song.lead) {
        const line = song.motif[bar % 4];
        for (const n of line) if (n.s === s) {
          const oct = Math.floor(n.deg / song.scale.length), d = song.scale[n.deg % song.scale.length];
          inst[song.lead](key + 12 + oct * 12 + d, t, sixteenth * n.len, song.leadVol || 0.1);
        }
      }
      nextT += sixteenth; step++;
    }
  }
  function musicStop() { if (timer) clearInterval(timer); timer = null; song = null; }
  function setMuted(m) {
    muted = m; store.set("picoruno-mute", m);
    if (master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
  }

  /* ---------- そのほか ---------- */
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function tweet(text, url) {
    const u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + (url ? "&url=" + encodeURIComponent(url) : "");
    window.open(u, "_blank", "noopener");
  }
  async function shareImage(canvas, name, text) {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], name, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return "shared"; }
    } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return "downloaded";
  }
  function loadImages(map) {
    const out = {};
    return Promise.all(Object.entries(map).map(([k, src]) => new Promise(res => {
      const im = new Image(); im.onload = () => { out[k] = im; res(); }; im.onerror = () => { out[k] = null; res(); }; im.src = src;
    }))).then(() => out);
  }

  /* 遊んだ回数を数える（トップページの ▶ 回数）。同じタブでの再読みこみは1回だけ。 */
  function countPlay(G) {
    const K = "picoruno-played:" + G;
    try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, "1"); } catch (e) {}
    const KEY = "sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
    fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play", { method: "POST", keepalive: true,
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ g: G }) })
      .then(r => { if (!r.ok) throw 0; })
      .catch(() => { try { const d = JSON.parse(localStorage.getItem("picoruno-stats") || "{}"); d[G] = d[G] || { plays: 0, likes: 0 }; d[G].plays++; localStorage.setItem("picoruno-stats", JSON.stringify(d)); } catch (e) {} });
  }

  /* セーフエリア（ノッチなど）の大きさ(px) */
  let safeEl = null;
  function safe() {
    if (!safeEl) {
      safeEl = document.createElement("div");
      safeEl.style.cssText = "position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
      document.body.appendChild(safeEl);
    }
    const cs = getComputedStyle(safeEl);
    return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
  }

  S.flash = S.flash.filter(f => f.life > 0);
  const P = S.pulling;
  if (P) {
    P.v = Math.min(2600, P.v + 5200 * dt); P.d += P.v * dt;
    if (zip) { const now = KIT.ensure().currentTime; zip.g.gain.setTargetAtTime(0.09 * clamp(P.v / 1500, 0, 1), now, 0.02); zip.fl.frequency.setTargetAtTime(1800 + P.v, now, 0.03); }
    const L = P.c.cum[P.c.cum.length - 1];
    if (Math.random() < 0.6) { const e = along(P.c.pts, P.c.cum, P.end ? L : 0); S.parts.push({ x: e[0] + (Math.random() - 0.5) * 20, y: e[1] + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, r: 1.5, life: 0.5, c: "rgba(255,250,230,.8)" }); }
    if (P.d > L + 500) {
      P.c.gone = true; S.pulling = null; S.dirty = true; sndOut();
      if (zip) zip.g.gain.setTargetAtTime(0, KIT.ensure().currentTime, 0.03);
      const left = S.cables.filter(c => !c.gone).length;
      if (!left) bagClear();
    }
  }
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt * 2; }
  S.parts = S.parts.filter(q => q.life > 0);
  if (S.state === "clear" && S.t >= S.lock) {
    S.bag++;
    if (S.bag >= BAGS.length) finish(); else openBag();
  }
}
function bagClear() {
  S.state = "clear"; S.bagTimes.push(S.time);
  sndClear(); say(`カバン ${S.bag + 1} すっきり！`, 1.4);
  S.lock = S.t + 1.5;
}
function openBag() {
  const r = KIT.rng(Math.floor(Math.random() * 1e9));
  let bag = null;
  for (let i = 0; i < 10 && !bag; i++) bag = makeBag(r, BAGS[S.bag]);
  if (!bag) bag = makeBag(r, { n: BAGS[S.bag].n - 1, pts: 4 });
  S.total += bag.cables.length;
  S.cables = bag.cables; S.cross = bag.cross; S.solution = bag.solution; S.pulling = null; S.dirty = true;
  S.state = "play";
  if (S.bag === BAGS.length - 1) S.snap = null;
  say(S.bag === 0 ? "いちばん上のケーブルはどれ？" : `カバン ${S.bag + 1}：${bag.cables.length}本`, 1.8);
  KIT.noise({ dur: 0.35, vol: 0.06, f: 500, to: 1200, q: 0.6, wet: 0.1 });
}
function startGame() {
  KIT.ensure(); soundInit();
  $("title").hidden = true; $("result").hidden = true;
  S.bag = 0; S.time = 0; S.miss = 0; S.total = 0; S.bagTimes = []; S.parts = []; S.flash = [];
  openBag();
  // 3つめのカバンのからまり具合を、シェア画像に使う
  startMusic(false); KIT.countPlay(GAME_TITLE);
}
const RANKS = [[30, "ほどきの名人"], [50, "整理上手"], [80, "カバンの中もすっきり"], [120, "からまり慣れ"], [1e9, "もう全部ワイヤレスに"]];
function finish() {
  S.state = "result";
  const time = Math.round(S.time * 10) / 10;
  const rank = RANKS.find(r => time < r[0])[1];
  S.res = { time, rank, miss: S.miss };
  $("rBig").innerHTML = `${time.toFixed(1)}<small>秒</small>`;
  $("rRank").textContent = rank;
  const bt = S.bagTimes.map((t, i) => t - (S.bagTimes[i - 1] || 0));
  $("rStats").innerHTML = `<div class="stat${S.miss ? " ng" : " good"}"><small>引っかかった</small><b>${S.miss}回</b></div>`
    + `<div class="stat"><small>ほどいた本数</small><b>${S.total}本</b></div>`
    + `<div class="stat"><small>さいごのカバン</small><b>${(bt[2] || 0).toFixed(1)}秒</b></div>`;
  const best = KIT.store.get("code-best", null);
  if (best === null || time < best) KIT.store.set("code-best", time);
  $("rNote").textContent = best === null || time < best ? "自己ベスト更新！" : `自己ベスト ${best.toFixed(1)}秒`;
  $("result").hidden = false;
  sndClear();
  KIT.music.stop(); setTimeout(() => startMusic(true), 1200);
}
function shareText() { const r = S.res; return `コードほどき、カバン3つのからまったケーブル${S.total}本を ${r.time.toFixed(1)}秒でほどいた（引っかかり ${r.miss}回）\nわたしは「${r.rank}」\n#コードほどき`; }
function shareCanvas() {
  const c = mk(1200, 630), g = c.getContext("2d");
  g.save(); g.beginPath(); g.rect(0, 0, 600, 630); g.clip();
  // 見本のからまり（8本）
  const keep = { cables: S.cables, cross: S.cross, pulling: S.pulling };
  const bag = makeBag(KIT.rng(Math.floor(S.time * 100) + 7), BAGS[2]);
  if (bag) { S.cables = bag.cables; S.cross = bag.cross; S.pulling = null; S.dirty = true; }
  g.translate(300, 315); g.scale(0.84, 0.84); g.translate(-360, -560);
  drawScene(g);
  Object.assign(S, keep); S.dirty = true;
  g.restore();
  g.fillStyle = "#fffaf2"; g.fillRect(600, 0, 600, 630);
  g.fillStyle = "#e07a5c"; g.fillRect(600, 0, 10, 630);
  g.textAlign = "left";
  g.fillStyle = "#3e3a2c"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText("コードほどき", 650, 92);
  g.fillStyle = "#857e69"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText(`からまったケーブル${S.total}本を、ほどいた時間`, 650, 170);
  g.fillStyle = "#b0563d"; g.font = '800 96px "M PLUS Rounded 1c",sans-serif';
  const t = S.res.time.toFixed(1); g.fillText(t, 650, 274);
  const tw = g.measureText(t).width; g.font = '800 34px "M PLUS Rounded 1c",sans-serif'; g.fillText("秒", 660 + tw, 274);
  g.fillStyle = "#3e3a2c"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText(S.res.rank, 650, 350);
  g.fillStyle = "#857e69"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText(`引っかかり ${S.res.miss}回`, 650, 400);
  g.fillText("#コードほどき ・ picoruno.", 650, 580);
  return c;
}
function startMusic(calm) {
  KIT.music.start(calm
    ? { bpm: 70, key: 62, scale: [0, 3, 5, 7, 10], chords: [[0, 3, 10], [5, 8, 15], [-2, 2, 9], [3, 7, 14]], lead: "epiano", chord: "pad", beat: "none", seed: 9, leadVol: 0.06, chordVol: 0.04, density: 0.4 }
    : { bpm: 86, key: 62, scale: [0, 3, 5, 7, 10], chords: [[0, 3, 7, 10], [5, 8, 12, 15], [-2, 2, 5, 9], [3, 7, 10, 14]], lead: "pluck", chord: "epiano", beat: "lofi", seed: 61, leadVol: 0.07, chordVol: 0.05, density: 0.5, swing: 0.3 });
}

/* ---------- ボタン ---------- */
$("start").addEventListener("click", startGame);
$("again").addEventListener("click", startGame);
$("xBtn").addEventListener("click", () => KIT.tweet(shareText(), GAME_URL));
$("imgBtn").addEventListener("click", async () => { const r = await KIT.shareImage(shareCanvas(), "code.png", shareText()); if (r === "downloaded") toast("画像を保存しました"); });
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => t.hidden = true, 1800); }
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function muteIcon() { $("mute").innerHTML = KIT.muted ? ICON_OFF : ICON_ON; $("mute").setAttribute("aria-pressed", KIT.muted); }
$("mute").addEventListener("click", () => { KIT.setMuted(!KIT.muted); muteIcon(); if (!KIT.muted) KIT.ensure(); });

(async function boot() {
  resize(); muteIcon();
  const best = KIT.store.get("code-best", null);
  $("best").textContent = best !== null ? `自己ベスト ${best.toFixed(1)}秒` : "3つのカバンをほどいた時間で採点（はやいほどいい）";
  IMG = await KIT.loadImages(SRC);
  // タイトルの後ろ：からまったケーブル
  const bag = makeBag(KIT.rng(11), { n: 5, pts: 4 });
  if (bag) { S.cables = bag.cables; S.cross = bag.cross; }
  S.dirty = true;
  requestAnimationFrame(frame);
})();
window.__S = S; window.__T = { pull, nearest, makeBag };
