<style>
/* 画面：真上から見た雪の坂（Blender）。雪玉は下へころがり、景色が上へ流れる。ゴールの庭で雪だるまに組み立てる。 */

}
html,body{margin:0;height:100%;background:var(--ground);overflow:hidden}

body{color:var(--ink);font-family:var(--body);font-weight:500;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}

  box-shadow:0 18px 50px rgba(30,45,80,.35);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 24px);overflow-y:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;
  font-family:var(--pop);font-weight:800;font-size:1.1rem;background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main-d);transition:transform .08s,box-shadow .08s}

<body>
<canvas id="cv" aria-label="ゲーム画面"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>雪玉ころがし</h1>
  <p>雪の坂で雪玉をころがして、大きな雪だるまを作ろう。胴体と頭、ひとつずつ。</p>
  <div class="how">
    <b>ドラッグ</b><span>左右に動かして、ころがる向きを変える</span>
    <b>新雪</b><span>ふわふわの雪の上は、ぐんぐん大きくなる</span>
    <b>注意</b><span>木や岩にぶつかると欠ける。土や氷の上では育たない</span>
    <b>頭</b><span>頭は胴体より小さく。大きすぎると、ころん</span>
  </div>
  <button class="btn" id="start" type="button">坂の上へ</button>
  <div class="best" id="best"></div>
</section>

<section class="sheet" id="result" hidden>
  <div class="cap">できた雪だるまの高さ</div>
  <div class="big" id="rBig">0<small>cm</small></div>
  <div class="rank" id="rRank"></div>
  <div class="stats" id="rStats"></div>
  <div class="note" id="rNote"></div>
  <div class="row"><button class="btn x" id="xBtn" type="button">𝕏 にポスト</button><button class="btn sub" id="imgBtn" type="button">画像で保存</button></div>
  <button class="btn" id="again" type="button">もう一回つくる</button>
</section>
<div class="toast" id="toast" hidden></div>

<script>
/* ==== KIT：BGM・効果音・保存・シェアの共通部品（各ゲームに埋め込んで使う） ==== */
const KIT = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- 音 ---------- */
  let ctx = null, master, musicBus, sfxBus, verb, muted = store.get("picoruno-mute", false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      // 残響（生成したインパルス応答）
      verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = ir;
      const vg = ctx.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const now = () => (ctx ? ctx.currentTime : 0);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* 1音。f: 周波数, to: 終わりの周波数, t: 開始までの秒, dur: 長さ */
  function tone(o) {
    if (!ensure()) return;
    const { f = 440, to = null, t = 0, dur = 0.2, type = "sine", vol = 0.3, a = 0.005, rel = null, bus = sfxBus, wet = 0.15, lp = null, detune = 0, pan = 0 } = o;
    const s = now() + t, g = ctx.createGain(), osc = ctx.createOscillator();
    osc.type = type; osc.frequency.setValueAtTime(f, s); osc.detune.value = detune;
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.linearRampToValueAtTime(vol, s + a);
    g.gain.exponentialRampToValueAtTime(0.0001, s + (rel || dur));
    let node = osc;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; node.connect(fl); node = fl; }
    node.connect(g);
    let out = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(verb); }
    osc.start(s); osc.stop(s + (rel || dur) + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ensure()) return;
    const { t = 0, dur = 0.2, vol = 0.3, f = 1200, to = null, q = 0.8, type = "bandpass", a = 0.004, bus = sfxBus, wet = 0.1 } = o;
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = now() + t, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, s); fl.Q.value = q;
    if (to) fl.frequency.exponentialRampToValueAtTime(to, s + dur);
    g.gain.setValueAtTime(0.0001, s); g.gain.linearRampToValueAtTime(vol, s + a); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    src.connect(fl); fl.connect(g); g.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
    src.start(s, Math.random()); src.stop(s + dur + 0.05);
  }

  /* 楽器 */
  const inst = {
    epiano(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 1.6, vol: v, type: "sine", bus: musicBus, wet: 0.25, a: 0.004 }); tone({ f: f * 2, t, dur: 0.5, vol: v * 0.35, type: "sine", bus: musicBus, wet: 0.2 }); tone({ f: f * 3.01, t, dur: 0.18, vol: v * 0.12, type: "sine", bus: musicBus, wet: 0.1 }); },
    bell(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 2.2, vol: v, bus: musicBus, wet: 0.35 }); tone({ f: f * 3.98, t, dur: 0.35, vol: v * 0.25, bus: musicBus, wet: 0.35 }); },
    marimba(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: 0.45, vol: v, bus: musicBus, wet: 0.2 }); tone({ f: f * 4, t, dur: 0.07, vol: v * 0.3, bus: musicBus, wet: 0.1 }); },
    pluck(m, t, d, v) { tone({ f: mtof(m), t, dur: Math.min(0.6, d * 1.2), vol: v, type: "triangle", lp: 2400, bus: musicBus, wet: 0.25 }); },
    flute(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.95, vol: v * 0.8, type: "sine", a: 0.06, bus: musicBus, wet: 0.4 }); tone({ f: mtof(m) * 2, t, dur: d * 0.9, vol: v * 0.08, type: "triangle", a: 0.08, bus: musicBus, wet: 0.4 }); },
    chip(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.45, type: "square", lp: 3000, bus: musicBus, wet: 0.08 }); },
    pad(m, t, d, v) { const f = mtof(m); for (const dt of [-7, 7]) tone({ f, t, dur: d, vol: v * 0.5, type: "sawtooth", a: d * 0.35, lp: 900, detune: dt, bus: musicBus, wet: 0.5 }); },
    koto(m, t, d, v) { const f = mtof(m); tone({ f, to: f * 0.995, t, dur: 0.9, vol: v, type: "triangle", lp: 3200, a: 0.002, bus: musicBus, wet: 0.35 }); tone({ f: f * 2, t, dur: 0.25, vol: v * 0.3, type: "sine", bus: musicBus, wet: 0.2 }); },
    bass(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v, type: "triangle", lp: 600, bus: musicBus, wet: 0 }); tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.6, type: "sine", bus: musicBus, wet: 0 }); },
    kick(t, v) { tone({ f: 130, to: 42, t, dur: 0.28, vol: v, type: "sine", bus: musicBus, wet: 0 }); },
    snare(t, v) { noise({ t, dur: 0.16, vol: v * 0.6, f: 1900, q: 0.7, bus: musicBus, wet: 0.2 }); },
    hat(t, v) { noise({ t, dur: 0.04, vol: v * 0.35, f: 8000, type: "highpass", bus: musicBus, wet: 0 }); },
    shaker(t, v) { noise({ t, dur: 0.07, vol: v * 0.25, f: 6000, q: 2, bus: musicBus, wet: 0.05 }); }
  };

  /* ---------- BGM（シード付きの自動作曲。4小節のフレーズをくりかえす） ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  let song = null, timer = null, nextT = 0, step = 0;
  /* opts: {bpm, key(midi), chords:[[度数...]...], lead, chord, beat:"lofi"|"waltz"|"none"|"chip"|"shaker", seed, scale:[...], swing, leadVol, density} */
  function musicStart(opts) {
    if (!ensure()) return;
    musicStop();
    const r = rng(opts.seed || 7);
    const scale = opts.scale || [0, 2, 4, 7, 9];      // ペンタトニック
    const beats = opts.beat === "waltz" ? 3 : 4;
    const steps = beats * 4;                           // 16分音符
    // 4小節ぶんのメロディを作る（2小節目と4小節目は少し変える）
    const motif = [];
    for (let bar = 0; bar < 4; bar++) {
      const line = [];
      let deg = Math.floor(r() * scale.length);
      for (let s = 0; s < steps; s++) {
        const strong = s % 4 === 0;
        if (r() < (strong ? 0.62 : 0.2) * (opts.density || 1)) {
          deg = Math.max(0, Math.min(scale.length * 2 - 1, deg + Math.floor(r() * 5) - 2));
          const len = strong && r() < 0.5 ? 4 : 2;
          line.push({ s, deg, len });
        }
      }
      motif.push(line);
    }
    motif[2] = motif[0].map(n => ({ ...n }));          // 3小節目は1小節目のくりかえし
    song = { ...opts, beats, steps, motif, scale };
    nextT = now() + 0.1; step = 0;
    timer = setInterval(schedule, 40);
  }
  function schedule() {
    if (!song || !ctx) return;
    const spb = 60 / song.bpm, sixteenth = spb / 4;
    while (nextT < now() + 0.25) {
      const bar = Math.floor(step / song.steps), s = step % song.steps;
      const chordDegs = song.chords[bar % song.chords.length];
      const key = song.key || 60;
      const sw = (s % 2 === 1) ? (song.swing || 0) * sixteenth : 0;
      const t = nextT + sw - now();
      // コード
      if (s === 0) chordDegs.forEach((d, i) => (inst[song.chord || "epiano"])(key + d, t + i * 0.012, spb * song.beats * 0.9, (song.chordVol || 0.08)));
      if (song.beat === "waltz" && (s === 4 || s === 8)) chordDegs.slice(1).forEach(d => inst[song.chord || "epiano"](key + d, t, spb * 0.8, (song.chordVol || 0.08) * 0.6));
      // ベース
      if (song.bassOn !== false) {
        if (s === 0) inst.bass(key - 24 + chordDegs[0], t, spb * 1.8, 0.22);
        if (song.beat !== "waltz" && s === 8) inst.bass(key - 24 + chordDegs[0] + (bar % 2 ? 7 : 0), t, spb * 1.6, 0.18);
      }
      // リズム
      const bt = song.beat || "lofi";
      if (bt === "lofi") { if (s === 0 || s === 10) inst.kick(t, 0.38); if (s === 4 || s === 12) inst.snare(t, 0.25); if (s % 2 === 0) inst.hat(t, s % 4 === 2 ? 0.5 : 0.3); }
      else if (bt === "chip") { if (s % 4 === 0) inst.kick(t, 0.3); if (s === 4 || s === 12) inst.snare(t, 0.2); if (s % 2 === 1) inst.hat(t, 0.3); }
      else if (bt === "waltz") { if (s === 0) inst.kick(t, 0.25); if (s === 4 || s === 8) inst.shaker(t, 0.6); }
      else if (bt === "shaker") { if (s % 2 === 0) inst.shaker(t, s % 4 === 0 ? 0.7 : 0.4); if (s === 0) inst.kick(t, 0.2); }
      // メロディ
      if (song.lead) {
        const line = song.motif[bar % 4];
        for (const n of line) if (n.s === s) {
          const oct = Math.floor(n.deg / song.scale.length), d = song.scale[n.deg % song.scale.length];
          inst[song.lead](key + 12 + oct * 12 + d, t, sixteenth * n.len, song.leadVol || 0.1);
        }
      }
      nextT += sixteenth; step++;
    }
  }
  function musicStop() { if (timer) clearInterval(timer); timer = null; song = null; }
  function setMuted(m) {
    muted = m; store.set("picoruno-mute", m);
    if (master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
  }

  /* ---------- そのほか ---------- */
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function tweet(text, url) {
    const u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + (url ? "&url=" + encodeURIComponent(url) : "");
    window.open(u, "_blank", "noopener");
  }
  async function shareImage(canvas, name, text) {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], name, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return "shared"; }
    } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return "downloaded";
  }
  function loadImages(map) {
    const out = {};
    return Promise.all(Object.entries(map).map(([k, src]) => new Promise(res => {
      const im = new Image(); im.onload = () => { out[k] = im; res(); }; im.onerror = () => { out[k] = null; res(); }; im.src = src;
    }))).then(() => out);
  }

  /* 遊んだ回数を数える（トップページの ▶ 回数）。同じタブでの再読みこみは1回だけ。 */
  function countPlay(G) {
    const K = "picoruno-played:" + G;
    try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, "1"); } catch (e) {}
    const KEY = "sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
    fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play", { method: "POST", keepalive: true,
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ g: G }) })
      .then(r => { if (!r.ok) throw 0; })
      .catch(() => { try { const d = JSON.parse(localStorage.getItem("picoruno-stats") || "{}"); d[G] = d[G] || { plays: 0, likes: 0 }; d[G].plays++; localStorage.setItem("picoruno-stats", JSON.stringify(d)); } catch (e) {} });
  }

  /* セーフエリア（ノッチなど）の大きさ(px) */
  let safeEl = null;
  function safe() {
    if (!safeEl) {
      safeEl = document.createElement("div");
      safeEl.style.cssText = "position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";

let IMG = {};
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const PX = 1.5;                 // 坂の 1cm ＝ 1.5（画面の単位）
const TILE = 1080;              // 坂の絵のたて（720cm）
const L = 8600;                 // 1本のコースの長さ
const D0 = 18;                  // はじめの雪玉（直径cm）
/* 障害物とごほうび。r は当たりの半径(cm) */
const KIND = {
  tree: { cell: 0, r: 46, hard: 0.72, label: "木" },
  rock: { cell: 1, r: 34, hard: 0.64, label: "岩" },
  bush: { cell: 2, r: 38, hard: 0.86, label: "しげみ" },
  dirt: { cell: 3, r: 66, flat: true },
  powder: { cell: 4, r: 70, flat: true },
  ice: { cell: 5, r: 84, flat: true }
};

const S = { state: "title", t: 0, run: 0, dist: 0, x: W / 2, vx: 0, tx: W / 2, d: D0, roll: 0, speed: 0, objs: [], deco: [], trail: [], parts: [], flakes: [],
  msg: null, shake: 0, sizes: [], hits: 0, powderT: 0, on: null, goalT: 0, fade: 0, build: null, res: null, hurt: 0, maxD: 0, keys: { l: 0, r: 0 } };

/* ---------- canvas ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  fit = Math.min(Math.max(vw / W, vh / H), vh / 900);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
}
window.addEventListener("resize", resize);
function view() { const lw = vw / fit, lh = vh / fit; return { lw, lh, ox: (lw - W) / 2, oy: clamp(lh * 0.5 - 540, lh - H, 0) }; }
function visX() { const v = view(); return [Math.max(0, -v.ox), Math.min(W, W + v.ox)]; }
function ballY() { const v = view(); return -v.oy + Math.min(300, v.lh * 0.3); }
function mk(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
const R = () => S.d / 2 * PX;   // 雪玉の半径（画面）

/* ---------- コースづくり ---------- */
function makeCourse(run) {
  const o = [], rnd = Math.random;
  let y = 700;
  const w = run === 0 ? { tree: 3, rock: 1.4, bush: 1.4, dirt: 1.3, powder: 2.4, ice: 0.9 } : { tree: 3.4, rock: 1.8, bush: 1.2, dirt: 1.5, powder: 2.0, ice: 1.2 };
  const pick = () => { let s = 0; for (const k in w) s += w[k]; let r = rnd() * s; for (const k in w) { if ((r -= w[k]) < 0) return k; } return "tree"; };
  while (y < L - 500) {
    const prog = y / L, n = rnd() < 0.35 + prog * 0.4 ? 2 : 1;
    const xs = [];
    for (let i = 0; i < n; i++) {
      let k = pick(), x = 0, ok = false;
      for (let tries = 0; tries < 12 && !ok; tries++) {
        x = lerp(70, W - 70, rnd());
        ok = xs.every(q => Math.abs(q - x) > 190);
      }
      if (!ok) continue;
      xs.push(x);
      o.push({ k, x, y: y + rnd() * 60, hit: false, rot: rnd() < 0.5 });
    }
    y += lerp(300, 200, prog) + rnd() * 160;
  }
  o.sort((a, b) => a.y - b.y);
  return o;
}
function makeDeco() {
  // 坂のそと（PC の広い画面）に木をならべる
  const d = [];
  for (let y = -400; y < L + 1600; y += 120 + Math.random() * 140) {
    d.push({ x: -60 - Math.random() * 380, y, s: lerp(0.8, 1.2, Math.random()) });
    d.push({ x: W + 60 + Math.random() * 380, y: y + 60, s: lerp(0.8, 1.2, Math.random()) });
  }
  return d;
}

/* ---------- 描画 ---------- */
function drawSlope(g, v, dist) {
  if (!IMG.slope) return;
  const off = ((dist % TILE) + TILE) % TILE;
  let ys = -off; while (ys > -v.oy) ys -= TILE;
  for (let x = -Math.ceil(v.ox / W) * W; x < W + v.ox + 1; x += W) {
    const flip = Math.abs(Math.round(x / W)) % 2 === 1;
    for (let y = ys; y < v.lh - v.oy; y += TILE) {
      if (flip) { g.save(); g.translate(x + W, y); g.scale(-1, 1); g.drawImage(IMG.slope, 0, 0, W, TILE + 1); g.restore(); }
      else g.drawImage(IMG.slope, x, y, W, TILE + 1);
    }
  }
  // コースの外は少し暗く（ここから先はころがれない）
  if (v.ox > 0) {
    g.fillStyle = "rgba(70,90,130,.10)";
    g.fillRect(-v.ox, -v.oy, v.ox, v.lh); g.fillRect(W, -v.oy, v.ox, v.lh);
  }
}
function drawObj(g, o, sy) {
  if (!IMG.obj) return;
  const k = KIND[o.k], ppc = GEO.oPxPerCm, cs = GEO.ocell * ppc;
  const sx = (k.cell % 3) * cs, syy = Math.floor(k.cell / 3) * cs;
  const size = GEO.ocell * PX, off = (GEO.ocell / 2 - 25) * PX;
  g.save();
  if (o.rot) { g.translate(o.x, sy); g.scale(k.flat ? -1 : 1, 1); g.translate(-o.x, -sy); }
  const sc = o.s || (o.k === "tree" ? 0.85 : 1);
  g.drawImage(IMG.obj, sx, syy, cs, cs, o.x - off * sc, sy - off * sc, size * sc, size * sc);
  g.restore();
}
function sparkle(g, o, sy) {
  // 新雪のきらきら（ここで大きくなる、の目じるし）
  g.save();
  const gr = g.createRadialGradient(o.x, sy, 10, o.x, sy, 110);
  gr.addColorStop(0, "rgba(255,255,255,.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.beginPath(); g.arc(o.x, sy, 110, 0, TAU); g.fill();
  for (let i = 0; i < 9; i++) {
    const a = i * 2.39 + o.x, d = 18 + (i * 37 % 80), px = o.x + Math.cos(a) * d, py = sy + Math.sin(a) * d * 0.8;
    const tw = Math.max(0, Math.sin(S.t * 3 + i * 1.7)), r = 2 + tw * 6;
    g.globalAlpha = 0.3 + tw * 0.7; g.fillStyle = "#fff";
    g.beginPath(); g.moveTo(px - r, py); g.lineTo(px, py - r * 0.2); g.lineTo(px + r, py); g.lineTo(px, py + r * 0.2); g.fill();
    g.beginPath(); g.moveTo(px, py - r); g.lineTo(px + r * 0.2, py); g.lineTo(px, py + r); g.lineTo(px - r * 0.2, py); g.fill();
  }
  g.restore();
}
function drawBall(g, x, y) {
  const r = R(), img = IMG.ball;
  // かげ（右下へ）
  g.save();
  g.fillStyle = "rgba(60,80,130,.22)";
  g.beginPath(); g.ellipse(x + r * 0.42, y + r * 0.5, r * 1.05, r * 0.92, 0.6, 0, TAU); g.fill();
  g.restore();
  if (!img) { g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); return; }
  const cell = GEO.ballCell, f = ((Math.floor(S.roll / (TAU / 12)) % 12) + 12) % 12;
  const size = r * 2 * GEO.ballCm / (GEO.ballR * 2);
  g.save();
  if (S.hurt > 0) { const k = S.hurt; g.translate(x, y); g.scale(1 + k * 0.08, 1 - k * 0.08); g.translate(-x, -y); }
  g.drawImage(img, f * cell, 0, cell, cell, x - size / 2, y - size / 2, size, size);
  g.restore();
}
function drawTrail(g, by) {
  const tr = S.trail;
  if (tr.length < 2) return;
  g.save(); g.lineCap = "round"; g.lineJoin = "round";
  // 太さが近い点ごとにまとめて1本の線に（重なりで濃くならないように）
  for (const pass of [0, 1]) {
    g.strokeStyle = pass ? "rgba(255,255,255,.25)" : "rgba(120,145,195,.22)";
    let i = 1;
    while (i < tr.length) {
      const w0 = tr[i].w;
      g.lineWidth = pass ? w0 * 0.35 : w0 * 0.9;
      const dx = pass ? -w0 * 0.12 : 0;
      g.beginPath(); g.moveTo(tr[i - 1].x + dx, by + (tr[i - 1].y - S.dist));
      while (i < tr.length && Math.abs(tr[i].w - w0) < 3) { g.lineTo(tr[i].x + dx, by + (tr[i].y - S.dist)); i++; }
      g.stroke();
    }
  }
  g.restore();
}
function drawParts(g, by) {
  for (const p of S.parts) {

  const cm = ds / PX;

  else if (now === "dirt") { S.d -= cm * 0.03; if (Math.random() < dt * 20) puff(S.x, S.dist - R() * 0.6, 1, { dir: -Math.PI / 2, sp: 90, r: 3, c: "#7a5a3a", life: 0.5 }); }
  else if (now !== "ice") S.d += cm * 1.15 / S.d;
  S.d = Math.max(8, S.d);
  S.maxD = Math.max(S.maxD, S.d);
  // わだちと雪けむり
  const last = S.trail[S.trail.length - 1];
  if (!last || S.dist - last.y > 14) S.trail.push({ x: S.x, y: S.dist, w: R() * 2 * (now === "ice" ? 0.25 : 0.8) });
  while (S.trail.length && by + (S.trail[0].y - S.dist) < -view().oy - 120) S.trail.shift();
  if (now === "powder" && Math.random() < dt * 30) puff(S.x + (Math.random() - 0.5) * R() * 1.6, S.dist + R() * 0.6, 1, { dir: Math.PI / 2, sp: 70, r: 5, life: 0.8, a: 0.9 });
  if (Math.random() < dt * 8) puff(S.x + (Math.random() - 0.5) * R(), S.dist + R() * 0.8, 1, { dir: Math.PI / 2 + (Math.random() - 0.5), sp: 40, r: 2.5, life: 0.5, a: 0.7 });
  rollSet(lerp(0.12, 0.3, clamp(S.d / 90, 0, 1)) * (now === "ice" ? 0.25 : 1), now === "powder" ? 1100 : lerp(900, 380, clamp(S.d / 100, 0, 1)));
  if (S.dist >= L) goal();
}
function hit(o, kd) {
  o.hit = true; S.hits++;
  const before = S.d;
  S.d = Math.max(8, S.d * kd.hard);
  S.vx = (S.x < o.x ? -1 : 1) * (220 + S.d * 2); S.tx = clamp(S.x + Math.sign(S.vx) * 90, ...visX());
  S.speed *= 0.55; S.shake = 0.7; S.hurt = 1;
  puff(S.x, S.dist, 26, { sp: 220, r: 5 + before * 0.04, life: 0.8, w: R() });
  sndHit(o.k); KIT.vibrate(30);
  say(`${kd.label}にごつん！ ${Math.round(before)}→${Math.round(S.d)}cm`, 1.4, true);
}
function goal() {
  S.state = "goal"; S.goalT = S.t; S.sizes[S.run] = S.d;
  sndGoal();
  say(S.run === 0 ? `胴体 ${Math.round(S.d)}cm できた！` : `頭 ${Math.round(S.d)}cm できた！`, 1.8);
}
function nextRun() {
  if (S.run === 0) { S.run = 1; startRun(); }
  else toYard();
}
function startRun() {
  S.state = "play"; S.dist = 0; S.speed = 120; S.d = D0; S.maxD = D0; S.on = null; S.trail = []; S.parts = [];
  const [a, b] = visX(); S.x = S.tx = (a + b) / 2; S.vx = 0;
  S.objs = makeCourse(S.run); S.deco = makeDeco();
  S.fade = S.run ? 1 : 0;
  rollStart();
  say(S.run === 0 ? "まずは胴体。大きく育てよう" : `次は頭。胴体(${Math.round(S.sizes[0])}cm)より小さく`, 2.2);
}
function startGame() {
  KIT.ensure();
  $("title").hidden = true; $("result").hidden = true;
  S.run = 0; S.sizes = []; S.hits = 0; S.build = null;
  startRun();
  startMusic(false); KIT.countPlay(GAME_TITLE);
}
function toYard() {
  rollStop();
  const body = S.sizes[0], head = S.sizes[1];
  const toppled = head > body;
  const h = toppled ? Math.max(body, head) : body * 0.9 + head * 0.92;
  S.build = { body, head, toppled, h, t0: S.t, cues: [] };
  const c = S.build.cues;
  c.push([0.05, () => sndPlop(1)]);
  c.push([0.95, () => sndPlop(1.3)]);
  if (toppled) c.push([1.2, () => { KIT.tone({ f: 300, to: 120, dur: 0.6, vol: 0.12, type: "triangle", wet: 0.2 }); say("頭が大きすぎて、ころん…", 2.4, true); }]);
  c.push([1.15, () => sndPop(79)]); c.push([1.3, () => sndPop(83)]); c.push([1.5, () => sndPop(86)]); c.push([1.7, () => sndPop(88)]); c.push([1.9, () => sndPop(91)]);
  c.push([2.2, () => { if (!toppled) { [0, 4, 7, 11, 14].forEach((d, i) => KIT.inst.bell(76 + d, i * 0.07, 0.6, 0.08)); } }]);
  S.state = "yard"; S.fade = 1;
  KIT.music.stop();
}
const RANKS = [[60, "ミニだるま"], [100, "ひざ丈だるま"], [140, "こどもの背たけ"], [175, "おとなの背たけ"], [1e9, "伝説の雪だるま"]];
function finish() {
  S.state = "result";
  const b = S.build, h = Math.round(b.h);
  const rank = b.toppled ? "頭でっかち" : RANKS.find(r => h < r[0])[1];
  S.res = { h, rank, body: Math.round(b.body), head: Math.round(b.head), toppled: b.toppled, hits: S.hits };
  $("rBig").innerHTML = `${h}<small>cm</small>`;
  $("rRank").textContent = rank;
  $("rStats").innerHTML = `<div class="stat"><small>胴体</small><b>${S.res.body}cm</b></div>`
    + `<div class="stat ${b.toppled ? "bad" : "good"}"><small>頭</small><b>${S.res.head}cm</b></div>`
    + `<div class="stat"><small>ぶつかった</small><b>${S.hits}回</b></div>`;
  const best = KIT.store.get("yukidama-best", null);
  if (best === null || h > best) KIT.store.set("yukidama-best", h);
  $("rNote").textContent = (b.toppled ? "頭は胴体より小さくすると、立ちます。　" : "") + (best === null || h > best ? "自己ベスト更新！" : `自己ベスト ${best}cm`);
  $("result").hidden = false;
  setTimeout(() => startMusic(true), 400);
}
function shareText() { const r = S.res; return `雪玉ころがしで、高さ${r.h}cmの雪だるまができた（胴体${r.body}cm・頭${r.head}cm）\nわたしは「${r.rank}」\n#雪玉ころがし`; }
function shareCanvas() {
  const c = mk(1200, 630), g = c.getContext("2d");
  g.save(); g.beginPath(); g.rect(0, 0, 600, 630); g.clip();
  const b = S.build, P = fitP(b.body, b.head, b.toppled);
  const sc = 600 / W * 0.95;
  g.fillStyle = "#2a3150"; g.fillRect(0, 0, 600, 630);
  g.translate(300, 630); g.scale(sc, sc); g.translate(-YG.ground[0], -(YG.ground[1] + 60));
  if (IMG.yard) g.drawImage(IMG.yard, 0, 0, W, H);
  snowman(g, YG.ground[0], YG.ground[1], P, b.body, b.head, 9, b.toppled);
  g.restore();
  g.fillStyle = "#fbfaf7"; g.fillRect(600, 0, 600, 630);
  g.fillStyle = "#d4513f"; g.fillRect(600, 0, 10, 630);
  g.textAlign = "left";
  g.fillStyle = "#2b3140"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText("雪玉ころがし", 650, 92);
  g.fillStyle = "#768095"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText("できた雪だるまの高さ", 650, 170);
  g.fillStyle = "#a33828"; g.font = '800 96px "M PLUS Rounded 1c",sans-serif';
  const t = String(S.res.h); g.fillText(t, 650, 274);
  const tw = g.measureText(t).width; g.font = '800 34px "M PLUS Rounded 1c",sans-serif'; g.fillText("cm", 660 + tw, 274);
  g.fillStyle = "#2b3140"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText(S.res.rank, 650, 350);
  g.fillStyle = "#768095"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText(`胴体 ${S.res.body}cm ・ 頭 ${S.res.head}cm`, 650, 400);
  g.fillText("#雪玉ころがし ・ picoruno.", 650, 580);
  return c;
}
function startMusic(calm) {
  KIT.music.start(calm
    ? { bpm: 66, key: 65, scale: [0, 2, 4, 7, 9], chords: [[0, 4, 7, 11], [5, 9, 12, 16], [9, 12, 16], [7, 11, 14, 17]], lead: "bell", chord: "pad", beat: "none", seed: 12, leadVol: 0.05, chordVol: 0.04, density: 0.35 }
    : { bpm: 118, key: 65, scale: [0, 2, 4, 7, 9], chords: [[0, 4, 7], [5, 9, 12], [2, 5, 9], [7, 11, 14]], lead: "bell", chord: "pluck", beat: "shaker", seed: 58, leadVol: 0.05, chordVol: 0.06, density: 0.5, swing: 0.15 });
}

const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
