<style>
/* 画面：夜の庭（Blender）を canvas に。線香花火と火花はゲームの中で描く。カードは下に重ねる。 */
:root{
  --night:#0b0f1e; --card:#fbf8f2; --ink:#2b2433; --sub:#7a6f7e; --line:#e7dfd3;
  --fire:#ff9a3c; --fire-d:#c4561f; --paper:#c76a93;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN",serif;

html,body{margin:0;height:100%;background:var(--night);overflow:hidden}

  border:2px solid rgba(255,255,255,.55);background:rgba(11,15,30,.5);color:#fff;cursor:pointer;display:grid;place-items:center}

.sheet{position:fixed;left:50%;transform:translateX(-50%);z-index:20;width:min(430px,calc(100% - 24px));box-sizing:border-box;background:var(--card);border-radius:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 24px);overflow-y:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;
  font-family:var(--mincho);font-weight:800;font-size:1.15rem;background:var(--fire-d);color:#fff;box-shadow:0 4px 0 #8a3812;transition:transform .08s,box-shadow .08s}

.btn.x{background:#1d1d1f;box-shadow:0 4px 0 #000;font-family:var(--body);font-weight:700;font-size:1rem}

<body>
<canvas id="cv" aria-label="ゲーム画面"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>線香花火のこり</h1>
  <p>夏の夜、最後に残った1本。火の玉を落とさずに、散り菊まで見とどけられるか。</p>
  <div class="how">
    <b>動かす</b><span>画面をなぞると、花火を持つ手が動く（PCはマウスを動かすだけ）</span>
    <b>風</b><span>蚊取り線香のけむりがなびいたら、風が来る</span>

  <div class="row"><button class="btn x" id="xBtn" type="button">𝕏 にポスト</button><button class="btn sub" id="imgBtn" type="button">画像で保存</button></div>
  <button class="btn" id="again" type="button">もう1本</button>
</section>

<script>
/*KIT*/
</script>
<script>
"use strict";
const GAME_TITLE = "線香花火のこり";
const GAME_URL = "https://runococco.github.io/picoruno./senkou.html";
const $ = id => document.getElementById(id);
const W = 720, H = 1080;
const GEO = __JSON_geo__;
const SRC = { dark: "__IMG_dark__", lit: "__IMG_lit__" };
let IMG = {};
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* 花火の一生：秒 */
const STAGES = [
  { id: "tsubomi", name: "つぼみ", end: 3 },
  { id: "botan", name: "牡丹", end: 10 },
  { id: "matsuba", name: "松葉", end: 22 },
  { id: "yanagi", name: "柳", end: 32 },
  { id: "chirigiku", name: "散り菊", end: 42 }
];
const LIFE = 42;
const L = 100;           // こよりの先のやわらかい部分（px）
const GRAV = 5200;       // ふりこの重さ（周期がそれらしく見える値）
const HOME = { x: GEO.ball[0], y: GEO.ball[1] - L };

const S = { state: "title", t: 0, life: 0, hand: { x: HOME.x, y: HOME.y }, handT: { x: HOME.x, y: HOME.y }, hv: { x: 0, y: 0 },
  th: 0, om: 0, wind: 0, windTo: 0, gust: null, nextGust: 0, sparks: [], embers: [], smoke: [], stress: 0, ball: null, drop: null,
  r: 0, msg: null, stage: 0, glow: 0, seed: 1, endAt: 0, tested: false };

/* ---------- canvas ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  fit = Math.max(vw / W, vh / H);       // 背景は「全面をおおう」
  fit = Math.min(fit, vh / 760, Math.max(vw / 1920, vh / H));   // 横長の画面では寄りすぎない（絵の幅は1920まで）
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
}
window.addEventListener("resize", resize);
// 画面の中央に火の玉の位置が来るように、世界座標を置く
const view = () => { const lw = vw / fit, lh = vh / fit; return { ox: lw / 2 - W / 2, oy: clamp(lh * 0.46 - GEO.ball[1], lh - H, 0), lw, lh }; };

function render() {
  const v = view();
  cx.setTransform(dpr * fit, 0, 0, dpr * fit, 0, 0);
  cx.fillStyle = "#06080f"; cx.fillRect(0, 0, v.lw, v.lh);
  cx.translate(v.ox, v.oy);
  if (IMG.dark) {
    // 絵は横に広い（x=-600〜1320）。縦画面ではまん中だけが見える
    cx.drawImage(IMG.dark, -600, 0, 1920, H);
    // 火花の明るさで、灯りの入った絵を重ねる
    const fl = S.glow * (0.82 + 0.18 * Math.sin(S.t * 31) * Math.sin(S.t * 17.3));
    if (fl > 0.01 && IMG.lit) { cx.globalAlpha = clamp(fl * 0.8, 0, 1); cx.drawImage(IMG.lit, -600, 0, 1920, H); cx.globalAlpha = 1; }
  }
  drawSmoke();
  drawStick();
  drawSparks();
  drawBall();
  drawDrop();
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (S.state === "play" || S.state === "end") drawHud();
}

/* 蚊取り線香のけむり：風の向きが見える */
function drawSmoke() {
  const g = cx, P = S.smoke.filter((p, i) => i % 3 === 0);
  if (P.length < 3) return;
  g.save(); g.lineCap = "round"; g.lineJoin = "round";
  // 粒をなめらかな1本の筋につなぐ（根もとは細く濃く、上ほど太く淡く）
  for (const [wd, al] of [[18, 0.03], [8, 0.06], [3, 0.11]]) {
    for (let i = P.length - 2; i > 0; i--) {
      const a = P[i + 1], b = P[i], c = P[i - 1];
      const m0 = [(a.x + b.x) / 2, (a.y + b.y) / 2], m1 = [(b.x + c.x) / 2, (b.y + c.y) / 2];
      g.strokeStyle = `rgba(205,210,225,${al * clamp(b.life * 1.4, 0, 1)})`; g.lineWidth = wd * (0.4 + (1 - b.life) * 1.6);
      g.beginPath(); g.moveTo(m0[0], m0[1]); g.quadraticCurveTo(b.x, b.y, m1[0], m1[1]); g.stroke();
    }
  }
  g.restore();
}
/* 線香花火：上から手で持った「こより」。手から先 L は、ゆれるやわらかい部分 */
function drawStick() {
  const g = cx, h = S.hand, b = ballPos();
  const tx = h.x + (h.x - HOME.x) * 0.25, ty = -60;
  g.save(); g.lineCap = "round";
  // 持ち手側（かたい）
  const grad = g.createLinearGradient(0, ty, 0, h.y);
  grad.addColorStop(0, "rgba(199,106,147,0)"); grad.addColorStop(0.25, "#9b4a74"); grad.addColorStop(1, "#c76a93");
  g.strokeStyle = grad; g.lineWidth = 3.2;
  g.beginPath(); g.moveTo(tx, ty); g.lineTo(h.x, h.y); g.stroke();
  // ねじりの模様
  g.strokeStyle = "rgba(255,220,240,.35)"; g.lineWidth = 1;
  for (let i = 0; i < 18; i++) { const k = i / 18, x = lerp(tx, h.x, k), y = lerp(ty, h.y, k); if (y < 0) continue; g.beginPath(); g.moveTo(x - 1.8, y); g.lineTo(x + 1.8, y + 3); g.stroke(); }
  // 火薬の入った先（ゆれる）：手から火の玉まで
  if (S.ball || S.state === "title" || S.state === "ready") {
    const end = S.ball ? b : { x: h.x + Math.sin(S.th) * L, y: h.y + Math.cos(S.th) * L };
    const mx = (h.x + end.x) / 2 + Math.sin(S.th) * -8, my = (h.y + end.y) / 2;
    g.strokeStyle = S.life > 1 ? "#3a2a2a" : "#b4648a"; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(h.x, h.y); g.quadraticCurveTo(mx, my, end.x, end.y); g.stroke();
  }
  g.restore();
}
function ballPos() { return { x: S.hand.x + Math.sin(S.th) * L, y: S.hand.y + Math.cos(S.th) * L }; }
function drawBall() {
  if (!S.ball) return;
  const g = cx, b = ballPos(), r = S.r;
  if (r <= 0.2) return;
  // まわりの光（加算）
  g.save(); g.globalCompositeOperation = "lighter";
  const hal = 30 + r * 7 * S.glow;
  const rg = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, hal);
  rg.addColorStop(0, `rgba(255,170,80,${0.55 * S.glow + 0.1})`); rg.addColorStop(0.3, `rgba(255,110,40,${0.22 * S.glow})`); rg.addColorStop(1, "rgba(255,80,20,0)");
  g.fillStyle = rg; g.beginPath(); g.arc(b.x, b.y, hal, 0, 6.283); g.fill();
  g.restore();
  // 火の玉：落ちそうになるほど、しずくのようにのびる
  const st = clamp(S.stress, 0, 1), ang = S.th;
  g.save(); g.translate(b.x, b.y); g.rotate(-ang);
  const wob = 1 + Math.sin(S.t * 23) * 0.05 + Math.sin(S.t * 41) * 0.03;
  const ry = r * (1 + st * 0.7) * wob, rx = r * (1 - st * 0.15) / wob;
  const cg = g.createRadialGradient(-r * 0.2, -r * 0.2, 0, 0, 0, Math.max(rx, ry));
  const dim = S.state === "end" && !S.drop ? clamp(1 - (S.t - S.endAt) / 2.5, 0, 1) : 1;
  cg.addColorStop(0, `rgba(255,${Math.round(240 * dim + 15)},${Math.round(200 * dim)},1)`);
  cg.addColorStop(0.45, `rgba(255,${Math.round(120 * dim + 40)},${Math.round(40 * dim)},1)`);
  cg.addColorStop(1, `rgba(${Math.round(200 * dim + 40)},${Math.round(40 * dim + 10)},10,.95)`);
  g.fillStyle = cg;
  g.beginPath(); g.ellipse(0, (ry - r) * 0.6, rx, ry, 0, 0, 6.283); g.fill();
  // くびれ
  if (st > 0.35) { g.strokeStyle = `rgba(255,190,120,${(st - 0.35) * 1.2})`; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, -L * 0.15); g.lineTo(0, -ry * 0.6); g.stroke(); }
  g.restore();
}
function drawSparks() {
  const g = cx;
  g.save(); g.globalCompositeOperation = "lighter"; g.lineCap = "round";
  for (const p of S.sparks) {
    const a = clamp(p.life / p.max, 0, 1);
    g.strokeStyle = p.col.replace("A", (a * p.al).toFixed(3)); g.lineWidth = p.w;
    const tl = p.trail || 0.03;
    g.beginPath(); g.moveTo(p.x - p.vx * tl, p.y - p.vy * tl); g.lineTo(p.x, p.y); g.stroke();
  }
  g.restore();
}
function drawDrop() {
  const d = S.drop; if (!d) return;
  const g = cx;
  g.save(); g.globalCompositeOperation = "lighter";
  if (!d.landed) {
    const rg = g.createRadialGradient(d.x, d.y, 0, d.x, d.y, 18);
    rg.addColorStop(0, "rgba(255,200,120,1)"); rg.addColorStop(0.4, "rgba(255,110,40,.8)"); rg.addColorStop(1, "rgba(255,80,20,0)");
    g.fillStyle = rg; g.beginPath(); g.arc(d.x, d.y, 18, 0, 6.283); g.fill();
    g.strokeStyle = "rgba(255,140,60,.5)"; g.lineWidth = d.r * 1.4; g.lineCap = "round"; g.beginPath(); g.moveTo(d.x, d.y - d.vy * 0.02); g.lineTo(d.x, d.y); g.stroke();
  } else {
    const k = clamp(1 - (S.t - d.landAt) / 3, 0, 1);
    const rg = g.createRadialGradient(d.x, d.y, 0, d.x, d.y, 24);
    rg.addColorStop(0, `rgba(255,120,40,${k})`); rg.addColorStop(1, "rgba(255,80,20,0)");
    g.fillStyle = rg; g.beginPath(); g.ellipse(d.x, d.y, 24, 10, 0, 0, 6.283); g.fill();
  }
  g.restore();
}
function drawHud() {
  const g = cx, sf = KIT.safe(), top = 12 + sf.top, w = Math.min(vw - 80, 360);
  g.save();
  g.fillStyle = "rgba(11,15,30,.55)"; rr(g, 12, top, w, 54, 16); g.fill();
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "left";
  g.font = '800 21px "Shippori Mincho B1",serif';
  g.fillText(STAGES[S.stage].name, 28, top + 28);
  // 一生のゲージ
  const gx = 28 + 74, gw = w - 74 - 32 - 70;
  g.fillStyle = "rgba(255,255,255,.15)"; rr(g, gx, top + 24, gw, 6, 3); g.fill();
  STAGES.slice(0, -1).forEach(s => { g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(gx + gw * s.end / LIFE - 0.5, top + 21, 1, 12); });
  g.fillStyle = "#ffb15e"; rr(g, gx, top + 24, gw * clamp(S.life / LIFE, 0, 1), 6, 3); g.fill();
  g.textAlign = "right"; g.font = '700 19px "Zen Maru Gothic",sans-serif';
  g.fillText(`${S.life.toFixed(1)}秒`, 12 + w - 14, top + 28);
  // 風
  if (Math.abs(S.wind) > 120) {
    const dir = Math.sign(S.wind), a = clamp((Math.abs(S.wind) - 120) / 900, 0, 1);
    g.globalAlpha = a; g.fillStyle = "#cfe3ff"; g.textAlign = "center"; g.font = '700 17px "Zen Maru Gothic",sans-serif';
    const y = top + 82, x = vw / 2 + dir * (8 + Math.sin(S.t * 6) * 4);
    g.fillText(dir > 0 ? "風 ≫" : "≪ 風", x, y);
    g.globalAlpha = 1;
  }
  if (S.msg && S.t - S.msg.at < S.msg.dur) {
    const al = clamp((S.msg.dur - (S.t - S.msg.at)) / 0.3, 0, 1);
    g.globalAlpha = al; g.font = '700 19px "Zen Maru Gothic",sans-serif'; g.textAlign = "center";
    const tw = g.measureText(S.msg.text).width + 40, y = vh * 0.66;
    g.fillStyle = "rgba(11,15,30,.75)"; rr(g, vw / 2 - tw / 2, y, tw, 44, 22); g.fill();
    g.fillStyle = "#fff"; g.fillText(S.msg.text, vw / 2, y + 23);
    g.globalAlpha = 1;
  }
  g.restore();
}
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function say(text, dur = 1.8) { S.msg = { text, at: S.t, dur }; }

/* ---------- 入力：なぞった分だけ手が動く（どこから触っても手は飛ばない） ---------- */
let lastP = null;
function toWorld(e) { return { x: e.clientX / fit, y: e.clientY / fit }; }
cv.addEventListener("pointerdown", e => { lastP = toWorld(e); try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
cv.addEventListener("pointermove", e => {
  const p = toWorld(e);
  if (e.pointerType === "mouse" || e.buttons) {
    if (lastP) { S.handT.x += p.x - lastP.x; S.handT.y += p.y - lastP.y; }
    const half = Math.max(120, Math.min(260, view().lw / 2 - 70));
    S.handT.x = clamp(S.handT.x, HOME.x - half, HOME.x + half); S.handT.y = clamp(S.handT.y, HOME.y - 160, HOME.y + 200);
  }
  lastP = p;
});
const up = () => { lastP = null; };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") lastP = null; });

/* ---------- 音 ---------- */
let fizz = null;
function fizzNode() {
  const ac = KIT.ensure(); if (!ac) return null;
  if (!fizz) {

$("xBtn").addEventListener("click", () => KIT.tweet(shareText(), GAME_URL));
$("imgBtn").addEventListener("click", async () => { const r = await KIT.shareImage(shareCanvas(), "senkou.png", shareText()); if (r === "downloaded") toast("画像を保存しました"); });
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => t.hidden = true, 1800); }
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function muteIcon() { $("mute").innerHTML = KIT.muted ? ICON_OFF : ICON_ON; $("mute").setAttribute("aria-pressed", KIT.muted); }
$("mute").addEventListener("click", () => { KIT.setMuted(!KIT.muted); muteIcon(); if (!KIT.muted) KIT.ensure(); });

(async function boot() {
  resize(); muteIcon();
  const best = KIT.store.get("senkou-best", 0);
  $("best").textContent = best ? `自己ベスト ${best.toFixed(1)}秒` : "火の玉は、およそ42秒もちます";
  IMG = await KIT.loadImages(SRC);
  requestAnimationFrame(frame);
})();
window.__S = S;
</script>
