/* 画面：真上から見た雪の坂（Blender）。雪玉は下へころがり、景色が上へ流れる。ゴールの庭で雪だるまに組み立てる。 */

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;
  font-family:var(--pop);font-weight:800;font-size:1.1rem;background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main-d);transition:transform .08s,box-shadow .08s}

<body>

</script>
<script>
"use strict";
const GAME_TITLE = "雪玉ころがし";
const GAME_URL = "https://runococco.github.io/picoruno./yukidama.html";
const $ = id => document.getElementById(id);
const W = 540, H = 1080;
const GEO = __JSON_geo__;
const SRC = { slope: "__IMG_slope__", ball: "__IMG_ball__", obj: "__IMG_obj__", yard: "__IMG_yard__", parts: "__IMG_parts__" };
let IMG = {};
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const PX = 1.5;                 // 坂の 1cm ＝ 1.5（画面の単位）
const TILE = 1080;              // 坂の絵のたて（720cm）
const L = 8600;                 // 1本のコースの長さ
const D0 = 18;                  // はじめの雪玉（直径cm）
/* 障害物とごほうび。r は当たりの半径(cm) */
const KIND = {
  tree: { cell: 0, r: 46, hard: 0.72, label: "木" },
  rock: { cell: 1, r: 34, hard: 0.64, label: "岩" },
  bush: { cell: 2, r: 38, hard: 0.86, label: "しげみ" },
  dirt: { cell: 3, r: 66, flat: true },
  powder: { cell: 4, r: 70, flat: true },
  ice: { cell: 5, r: 84, flat: true }
};

const S = { state: "title", t: 0, run: 0, dist: 0, x: W / 2, vx: 0, tx: W / 2, d: D0, roll: 0, speed: 0, objs: [], deco: [], trail: [], parts: [], flakes: [],
  msg: null, shake: 0, sizes: [], hits: 0, powderT: 0, on: null, goalT: 0, fade: 0, build: null, res: null, hurt: 0, maxD: 0, keys: { l: 0, r: 0 } };

/* ---------- canvas ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  fit = Math.min(Math.max(vw / W, vh / H), vh / 900);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
}
window.addEventListener("resize", resize);
function view() { const lw = vw / fit, lh = vh / fit; return { lw, lh, ox: (lw - W) / 2, oy: clamp(lh * 0.5 - 540, lh - H, 0) }; }
function visX() { const v = view(); return [Math.max(0, -v.ox), Math.min(W, W + v.ox)]; }
function ballY() { const v = view(); return -v.oy + Math.min(300, v.lh * 0.3); }
function mk(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
const R = () => S.d / 2 * PX;   // 雪玉の半径（画面）

/* ---------- コースづくり ---------- */
function makeCourse(run) {
  const o = [], rnd = Math.random;
  let y = 700;
  const w = run === 0 ? { tree: 3, rock: 1.4, bush: 1.4, dirt: 1.3, powder: 2.4, ice: 0.9 } : { tree: 3.4, rock: 1.8, bush: 1.2, dirt: 1.5, powder: 2.0, ice: 1.2 };
  const pick = () => { let s = 0; for (const k in w) s += w[k]; let r = rnd() * s; for (const k in w) { if ((r -= w[k]) < 0) return k; } return "tree"; };
  while (y < L - 500) {
    const prog = y / L, n = rnd() < 0.35 + prog * 0.4 ? 2 : 1;
    const xs = [];
    for (let i = 0; i < n; i++) {
      let k = pick(), x = 0, ok = false;
      for (let tries = 0; tries < 12 && !ok; tries++) {
        x = lerp(70, W - 70, rnd());
        ok = xs.every(q => Math.abs(q - x) > 190);
      }
      if (!ok) continue;
      xs.push(x);
      o.push({ k, x, y: y + rnd() * 60, hit: false, rot: rnd() < 0.5 });
    }
    y += lerp(300, 200, prog) + rnd() * 160;
  }
  o.sort((a, b) => a.y - b.y);
  return o;
}
function makeDeco() {
  // 坂のそと（PC の広い画面）に木をならべる
  const d = [];
  for (let y = -400; y < L + 1600; y += 120 + Math.random() * 140) {
    d.push({ x: -60 - Math.random() * 380, y, s: lerp(0.8, 1.2, Math.random()) });
    d.push({ x: W + 60 + Math.random() * 380, y: y + 60, s: lerp(0.8, 1.2, Math.random()) });
  }
  return d;
}

/* ---------- 描画 ---------- */
function drawSlope(g, v, dist) {
  if (!IMG.slope) return;
  const off = ((dist % TILE) + TILE) % TILE;
  let ys = -off; while (ys > -v.oy) ys -= TILE;
  for (let x = -Math.ceil(v.ox / W) * W; x < W + v.ox + 1; x += W) {
    const flip = Math.abs(Math.round(x / W)) % 2 === 1;
    for (let y = ys; y < v.lh - v.oy; y += TILE) {
      if (flip) { g.save(); g.translate(x + W, y); g.scale(-1, 1); g.drawImage(IMG.slope, 0, 0, W, TILE + 1); g.restore(); }
      else g.drawImage(IMG.slope, x, y, W, TILE + 1);
    }
  }
  // コースの外は少し暗く（ここから先はころがれない）
  if (v.ox > 0) {
    g.fillStyle = "rgba(70,90,130,.10)";
    g.fillRect(-v.ox, -v.oy, v.ox, v.lh); g.fillRect(W, -v.oy, v.ox, v.lh);
  }
}
function drawObj(g, o, sy) {
  if (!IMG.obj) return;
  const k = KIND[o.k], ppc = GEO.oPxPerCm, cs = GEO.ocell * ppc;
  const sx = (k.cell % 3) * cs, syy = Math.floor(k.cell / 3) * cs;
  const size = GEO.ocell * PX, off = (GEO.ocell / 2 - 25) * PX;
  g.save();
  if (o.rot) { g.translate(o.x, sy); g.scale(k.flat ? -1 : 1, 1); g.translate(-o.x, -sy); }
  const sc = o.s || (o.k === "tree" ? 0.85 : 1);
  g.drawImage(IMG.obj, sx, syy, cs, cs, o.x - off * sc, sy - off * sc, size * sc, size * sc);
  g.restore();
}
function sparkle(g, o, sy) {
  // 新雪のきらきら（ここで大きくなる、の目じるし）
  g.save();
  const gr = g.createRadialGradient(o.x, sy, 10, o.x, sy, 110);
  gr.addColorStop(0, "rgba(255,255,255,.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.beginPath(); g.arc(o.x, sy, 110, 0, TAU); g.fill();
  for (let i = 0; i < 9; i++) {
    const a = i * 2.39 + o.x, d = 18 + (i * 37 % 80), px = o.x + Math.cos(a) * d, py = sy + Math.sin(a) * d * 0.8;
    const tw = Math.max(0, Math.sin(S.t * 3 + i * 1.7)), r = 2 + tw * 6;
    g.globalAlpha = 0.3 + tw * 0.7; g.fillStyle = "#fff";
    g.beginPath(); g.moveTo(px - r, py); g.lineTo(px, py - r * 0.2); g.lineTo(px + r, py); g.lineTo(px, py + r * 0.2); g.fill();
    g.beginPath(); g.moveTo(px, py - r); g.lineTo(px + r * 0.2, py); g.lineTo(px, py + r); g.lineTo(px - r * 0.2, py); g.fill();
  }
  g.restore();
}
function drawBall(g, x, y) {
  const r = R(), img = IMG.ball;
  // かげ（右下へ）
  g.save();
  g.fillStyle = "rgba(60,80,130,.22)";
  g.beginPath(); g.ellipse(x + r * 0.42, y + r * 0.5, r * 1.05, r * 0.92, 0.6, 0, TAU); g.fill();
  g.restore();
  if (!img) { g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); return; }
  const cell = GEO.ballCell, f = ((Math.floor(S.roll / (TAU / 12)) % 12) + 12) % 12;
  const size = r * 2 * GEO.ballCm / (GEO.ballR * 2);
  g.save();
  if (S.hurt > 0) { const k = S.hurt; g.translate(x, y); g.scale(1 + k * 0.08, 1 - k * 0.08); g.translate(-x, -y); }
  g.drawImage(img, f * cell, 0, cell, cell, x - size / 2, y - size / 2, size, size);
  g.restore();
}
function drawTrail(g, by) {
  const tr = S.trail;
  if (tr.length < 2) return;
  g.save(); g.lineCap = "round"; g.lineJoin = "round";
  // 太さが近い点ごとにまとめて1本の線に（重なりで濃くならないように）
  for (const pass of [0, 1]) {
    g.strokeStyle = pass ? "rgba(255,255,255,.25)" : "rgba(120,145,195,.22)";
    let i = 1;
    while (i < tr.length) {
      const w0 = tr[i].w;
      g.lineWidth = pass ? w0 * 0.35 : w0 * 0.9;
      const dx = pass ? -w0 * 0.12 : 0;
      g.beginPath(); g.moveTo(tr[i - 1].x + dx, by + (tr[i - 1].y - S.dist));
      while (i < tr.length && Math.abs(tr[i].w - w0) < 3) { g.lineTo(tr[i].x + dx, by + (tr[i].y - S.dist)); i++; }
      g.stroke();
    }
  }
  g.restore();
}
function drawParts(g, by) {
  for (const p of S.parts) {
    const y = p.world ? by + (p.y - S.dist) : p.y;
    g.globalAlpha = clamp(p.life / p.max, 0, 1) * (p.a || 1);
    g.fillStyle = p.c || "#fff";
    g.beginPath(); g.arc(p.x, y, p.r, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
}
function drawFlakes(g, v) {
  g.fillStyle = "rgba(255,255,255,.85)";
  for (const f of S.flakes) { g.globalAlpha = f.a; g.beginPath(); g.arc(f.x * v.lw - v.ox, f.y * v.lh - v.oy, f.r, 0, TAU); g.fill(); }
  g.globalAlpha = 1;
}
function render() {
  const v = view();
  cx.setTransform(dpr * fit, 0, 0, dpr * fit, 0, 0);
  cx.translate(v.ox, v.oy);
  if (S.shake > 0) cx.translate((Math.random() - 0.5) * S.shake * 10, (Math.random() - 0.5) * S.shake * 10);
  if (S.state === "yard" || S.state === "result") drawYard(cx, v);
  else {
    const by = ballY();
    drawSlope(cx, v, S.dist);
    // 平らなもの（土・新雪・氷）→ わだち → 岩としげみ → 雪玉 → 木
    const vis = o => { const sy = by + (o.y - S.dist); return sy > -v.oy - 260 && sy < v.lh - v.oy + 260; };
    for (const o of S.objs) if (KIND[o.k].flat && vis(o)) { drawObj(cx, o, by + (o.y - S.dist)); if (o.k === "powder") sparkle(cx, o, by + (o.y - S.dist)); }
    drawTrail(cx, by);
    for (const o of S.objs) if (!KIND[o.k].flat && o.k !== "tree" && vis(o)) drawObj(cx, o, by + (o.y - S.dist));
    if (S.state !== "title") drawGoal(cx, by + (L - S.dist));
    if (S.state !== "title") drawBall(cx, S.x, by);
    for (const o of S.objs) if (o.k === "tree" && vis(o)) drawObj(cx, o, by + (o.y - S.dist));
    for (const o of S.deco) { const sy = by + (o.y - S.dist); if (sy > -v.oy - 300 && sy < v.lh - v.oy + 300 && o.x > -v.ox - 200 && o.x < W + v.ox + 200) drawObj(cx, { k: "tree", x: o.x, s: o.s }, sy); }
    drawParts(cx, by);
  }
  drawFlakes(cx, v);
  if (S.fade > 0) { cx.fillStyle = `rgba(250,252,255,${S.fade})`; cx.fillRect(-v.ox - 20, -v.oy - 20, v.lw + 40, v.lh + 40); }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (S.state === "play" || S.state === "goal") drawHud();
  else if (S.state === "yard") drawMsg(KIT.safe().top + 20);
}
function drawGoal(g, y) {
  if (y < -100 || y > H + 400) return;
  // ゴールの赤白ロープと旗
  g.save();
  const n = 18;
  for (let i = 0; i < n; i++) {
    g.fillStyle = i % 2 ? "#fff" : "#d4513f";
    g.fillRect(-200 + i * (W + 400) / n, y - 5, (W + 400) / n + 1, 10);
  }
  g.fillStyle = "rgba(60,80,130,.18)"; g.fillRect(-200, y + 6, W + 400, 6);
  for (const x of [26, W - 26]) {
    g.fillStyle = "#6b4a2f"; g.fillRect(x - 4, y - 70, 8, 76);
    g.fillStyle = "#d4513f"; g.beginPath(); g.moveTo(x + 4, y - 70); g.lineTo(x + (x < W / 2 ? 54 : -46), y - 56); g.lineTo(x + 4, y - 42); g.fill();
  }
  g.fillStyle = "#2b3140"; g.font = '800 30px "M PLUS Rounded 1c",sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("ゴール", W / 2, y - 34);
  g.restore();
}
function drawHud() {
  const g = cx, sf = KIT.safe(), top = 12 + sf.top;
  g.save();
  const w = Math.min(vw - 24 - 56, 300), x = 12;
  g.fillStyle = "rgba(30,42,72,.72)"; rr(g, x, top, w, 70, 16); g.fill();
  g.textBaseline = "middle"; g.textAlign = "left";
  g.fillStyle = "#bcd0ee"; g.font = '700 13px "Zen Maru Gothic",sans-serif';
  g.fillText(S.run === 0 ? "1つめ：胴体をつくる" : "2つめ：頭をつくる", x + 14, top + 16);
  g.fillStyle = "#fff"; g.font = '800 30px "M PLUS Rounded 1c",sans-serif';
  const dt = `${Math.round(S.d)}`;
  g.fillText(dt, x + 14, top + 44);
  const tw = g.measureText(dt).width;

/* ---------- 入力 ---------- */

let drag = null;
cv.addEventListener("pointerdown", e => {

/* ---------- 音 ---------- */
let roll = null;
function rollStart() {

  const src = ctx.createBufferSource(); src.buffer = KIT.noiseBuffer(); src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700; lp.Q.value = 0.7;
  const bp = ctx.createBiquadFilter(); bp.type = "peaking"; bp.frequency.value = 2400; bp.gain.value = 6;
  const g = ctx.createGain(); g.gain.value = 0;

}

}
function sndPowder() {

  [0, 4, 7].forEach((d, i) => KIT.tone({ f: KIT.mtof(84 + d), t: i * 0.05, dur: 0.35, vol: 0.035, type: "sine", wet: 0.5 }));
}
function sndIce() { KIT.tone({ f: 2200, to: 3000, dur: 0.25, vol: 0.04, type: "sine", wet: 0.5 }); KIT.tone({ f: 3300, to: 2600, t: 0.05, dur: 0.3, vol: 0.03, type: "sine", wet: 0.5 }); }

/* ---------- 進行 ---------- */
let last = performance.now();
function frame(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(frame); }
function puff(x, y, n, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = opts.dir !== undefined ? opts.dir + (Math.random() - 0.5) * (opts.spread || 1.2) : Math.random() * TAU, sp = (opts.sp || 120) * (0.4 + Math.random());
    S.parts.push({ x: x + (Math.random() - 0.5) * (opts.w || 10), y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: (opts.r || 4) * (0.5 + Math.random()), life: opts.life || 0.7, max: opts.life || 0.7, world: true, c: opts.c, a: opts.a, drag: opts.drag || 2.5 });

}
function update(dt) {

  for (const f of S.flakes) { f.x += (f.vx + Math.sin(S.t + f.r * 5) * 0.01) * dt; f.y += f.vy * dt * (S.state === "play" ? 0.4 : 1); }

}

const RANKS = [[60, "ミニだるま"], [100, "ひざ丈だるま"], [140, "こどもの背たけ"], [175, "おとなの背たけ"], [1e9, "伝説の雪だるま"]];
function finish() {
  S.state = "result";
  const b = S.build, h = Math.round(b.h);
  const rank = b.toppled ? "頭でっかち" : RANKS.find(r => h < r[0])[1];
  S.res = { h, rank, body: Math.round(b.body), head: Math.round(b.head), toppled: b.toppled, hits: S.hits };
  $("rBig").innerHTML = `${h}<small>cm</small>`;
  $("rRank").textContent = rank;
  $("rStats").innerHTML = `<div class="stat"><small>胴体</small><b>${S.res.body}cm</b></div>`
    + `<div class="stat ${b.toppled ? "bad" : "good"}"><small>頭</small><b>${S.res.head}cm</b></div>`
    + `<div class="stat"><small>ぶつかった</small><b>${S.hits}回</b></div>`;
  const best = KIT.store.get("yukidama-best", null);
  if (best === null || h > best) KIT.store.set("yukidama-best", h);
  $("rNote").textContent = (b.toppled ? "頭は胴体より小さくすると、立ちます。　" : "") + (best === null || h > best ? "自己ベスト更新！" : `自己ベスト ${best}cm`);
  $("result").hidden = false;
  setTimeout(() => startMusic(true), 400);
}
function shareText() { const r = S.res; return `雪玉ころがしで、高さ${r.h}cmの雪だるまができた（胴体${r.body}cm・頭${r.head}cm）\nわたしは「${r.rank}」\n#雪玉ころがし`; }
function shareCanvas() {
  const c = mk(1200, 630), g = c.getContext("2d");
  g.save(); g.beginPath(); g.rect(0, 0, 600, 630); g.clip();
  const b = S.build, P = fitP(b.body, b.head, b.toppled);
  const sc = 600 / W * 0.95;
  g.fillStyle = "#2a3150"; g.fillRect(0, 0, 600, 630);
  g.translate(300, 630); g.scale(sc, sc); g.translate(-YG.ground[0], -(YG.ground[1] + 60));
  if (IMG.yard) g.drawImage(IMG.yard, 0, 0, W, H);
  snowman(g, YG.ground[0], YG.ground[1], P, b.body, b.head, 9, b.toppled);
  g.restore();
  g.fillStyle = "#fbfaf7"; g.fillRect(600, 0, 600, 630);
  g.fillStyle = "#d4513f"; g.fillRect(600, 0, 10, 630);
  g.textAlign = "left";
  g.fillStyle = "#2b3140"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText("雪玉ころがし", 650, 92);
  g.fillStyle = "#768095"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText("できた雪だるまの高さ", 650, 170);
  g.fillStyle = "#a33828"; g.font = '800 96px "M PLUS Rounded 1c",sans-serif';
  const t = String(S.res.h); g.fillText(t, 650, 274);
  const tw = g.measureText(t).width; g.font = '800 34px "M PLUS Rounded 1c",sans-serif'; g.fillText("cm", 660 + tw, 274);
  g.fillStyle = "#2b3140"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText(S.res.rank, 650, 350);
  g.fillStyle = "#768095"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText(`胴体 ${S.res.body}cm ・ 頭 ${S.res.head}cm`, 650, 400);
  g.fillText("#雪玉ころがし ・ picoruno.", 650, 580);
  return c;
}
function startMusic(calm) {

}
