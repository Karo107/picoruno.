<body>
<canvas id="cv" aria-label="ゲーム画面"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>目覚ましぜんぶ止め</h1>
  <p>朝7時。部屋じゅうの目覚ましが、つぎつぎ鳴りだす。となりの部屋から壁ドンされる前に、ぜんぶ止めよう。</p>

</script>
<script>
"use strict";
const GAME_TITLE = "目覚ましぜんぶ止め";
const GAME_URL = "https://runococco.github.io/picoruno./mezamashi.html";
const $ = id => document.getElementById(id);
const W = 540, H = 1080;
const GEO = __JSON_geo__;
const SRC = { room: "__IMG_room__", bell: "__IMG_bell__", digi: "__IMG_digi__", phone: "__IMG_phone__", runner: "__IMG_runner__" };
let IMG = {};
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const R = GEO.room, SP = R.spots, FH = R.floorH;
const BIG = 2.3;                                   // 目覚ましは実物より大きめに描く（タップしやすく）
const ANCH = 8 * Math.sin(34 * Math.PI / 180);     // スプライトの中心から足もとまで（cm）
const HOLD = 0.6;                                  // デジタルの長押し秒数
const SNOOZE = 4;                                  // スヌーズでまた鳴るまで

/* 床（cm）→ 画面 */
function floorPt(x, y) { const d = FH[6] * x + FH[7] * y + 1; return { x: (FH[0] * x + FH[1] * y + FH[2]) / d, y: (FH[3] * x + FH[4] * y + FH[5]) / d }; }
function floorScale(x, y) { const a = floorPt(x - 5, y), b = floorPt(x + 5, y); return Math.hypot(b.x - a.x, b.y - a.y) / 10; }

const KINDS = {
  bell: { name: "ベル", how: "タップ", sound: "ジリリリ", col: "#d6553c" },
  digi: { name: "デジタル", how: "長押し", sound: "ピピピッ", col: "#e0702f" },
  phone: { name: "スマホ", how: "スライド", sound: "♪〜", col: "#6a6fd6" },
  runner: { name: "にげる目覚まし", how: "追いかけてタップ", sound: "ジリリリ", col: "#d9962a" }
};
// 置き場所と種類（ベルは5色）
const LAYOUT = [
  { spot: "pillow", kind: "bell", col: 0 }, { spot: "sill", kind: "bell", col: 1 }, { spot: "desk", kind: "bell", col: 2 },
  { spot: "shelf", kind: "bell", col: 3 }, { spot: "basket", kind: "bell", col: 4 },
  { spot: "night", kind: "digi", col: 0 }, { spot: "dresser", kind: "digi", col: 1 },
  { spot: "phone", kind: "phone", col: 0 }, { spot: "rug", kind: "runner", col: 0 }
];

const S = { state: "title", t: 0, gt: 0, clocks: [], meter: 0, msg: null, fx: [], waves: [], dawn: 1, shake: 0, press: null, res: null, endAt: 0, don: 0, bird: 2, lastHit: {} };

/* ---------- canvas ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  fit = Math.min(Math.max(vw / W, vh / H), vh / 900, vw / W);   // 縦長の画面でも 540 幅はかならず見せる
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
}
window.addEventListener("resize", resize);
function view() { const lw = vw / fit, lh = vh / fit; return { lw, lh, ox: (lw - W) / 2, oy: lh > H ? (lh - H) / 2 : clamp(lh * 0.5 - 540, lh - H, 0) }; }
function visY() { const v = view(); return [Math.max(0, -v.oy), Math.min(H, v.lh - v.oy)]; }
function mk(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }

/* ---------- 目覚まし ---------- */
function makeClocks() {
  S.clocks = LAYOUT.map((L, i) => {
    const c = { i, kind: L.kind, col: L.col, spot: L.spot, state: "wait", at: 0, ringT: 0, ringFrom: 0, snoozes: 0, wob: 0, doneAt: 0, nextHit: 0, phase: Math.random() * 10, swipe: 0 };
    if (L.kind === "runner") { c.fx = 18; c.fy = -4; c.hd = 0; c.hda = -Math.PI / 2; c.tx = 18; c.ty = -4; c.spd = 0; }
    place(c); return c;
  });
}
function place(c) {
  if (c.kind === "runner") { const p = floorPt(c.fx, c.fy); c.x = p.x; c.y = p.y; c.s = floorScale(c.fx, c.fy); }
  else { const s = SP[c.spot]; c.x = s.x; c.y = s.y; c.s = s.s; }
}
function sheetOf(c) { return GEO[c.kind]; }
function frameOf(c) {
  const ring = c.state === "ring";
  if (c.kind === "bell") return c.col * 3 + (ring ? 1 + (Math.floor(S.t * 18 + c.phase) % 2) : 0);
  if (c.kind === "digi") return c.col * 2 + (ring && Math.floor(S.t * 4 + c.phase) % 2 === 0 ? 1 : 0);
  if (c.kind === "phone") return ring ? 1 : 0;
  // にげる目覚まし：進む向き（画面）から8方向
  const a = Math.atan2(Math.sin(c.hd), Math.cos(c.hd));
  return ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;
}
function size(c) { const g = sheetOf(c); return { k: BIG * c.s / g.pxcm, g }; }
function hitR(c) { return Math.max(46, 30 * BIG * c.s * 0.34); }
function drawClock(g, c) {
  const im = IMG[c.kind]; if (!im) return;
  const { k, g: sh } = size(c);
  const w = sh.cw * k, h = sh.ch * k, f = frameOf(c);
  const ring = c.state === "ring";
  let jx = 0, jy = 0, rot = 0;
  if (ring) {
    const amp = c.kind === "phone" ? 2.2 : 3.2;
    jx = Math.sin(S.t * 63 + c.phase) * amp; jy = Math.cos(S.t * 51 + c.phase) * amp * 0.5;
    rot = c.kind === "bell" || c.kind === "runner" ? Math.sin(S.t * 38 + c.phase) * 0.09 : 0;
  }
  if (c.wob > 0) rot += Math.sin(c.wob * 30) * c.wob * 0.25;
  const pop = c.doneAt && S.t - c.doneAt < 0.3 ? 1 + Math.sin((S.t - c.doneAt) / 0.3 * Math.PI) * 0.12 : 1;
  const ay = ANCH * BIG * c.s;   // 足もと
  g.save();
  g.translate(c.x + jx, c.y + jy); g.rotate(rot); g.scale(pop, pop);
  // スマホの光
  if (c.kind === "phone" && ring) {
    const r = 70 + Math.sin(S.t * 8) * 8, gr = g.createRadialGradient(0, -ay * 0.2, 4, 0, -ay * 0.2, r);
    gr.addColorStop(0, "rgba(170,180,255,.55)"); gr.addColorStop(1, "rgba(170,180,255,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(0, -ay * 0.2, r, 0, TAU); g.fill();
  }
  if (c.kind === "digi" && ring && f % 2 === 1) {
    const gr = g.createRadialGradient(0, -ay * 1.4, 2, 0, -ay * 1.4, 54);
    gr.addColorStop(0, "rgba(255,120,80,.5)"); gr.addColorStop(1, "rgba(255,120,80,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(0, -ay * 1.4, 54, 0, TAU); g.fill();
  }
  g.drawImage(im, f * sh.cw, 0, sh.cw, sh.ch, -w / 2, -h / 2 - ay, w, h);
  g.restore();
}

/* ---------- 予定（いつ、どれが鳴るか） ---------- */
function schedule() {
  const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bells = shuf(S.clocks.filter(c => c.kind === "bell")), digis = shuf(S.clocks.filter(c => c.kind === "digi"));
  const phone = S.clocks.find(c => c.kind === "phone"), run = S.clocks.find(c => c.kind === "runner");
  const plan = [[1.2, bells[0]], [4.2, bells[1]], [7.0, digis[0]], [9.4, bells[2]], [11.6, phone], [13.4, bells[3]], [14.6, digis[1]], [17.0, run], [19.2, bells[4]]];
  for (const [t, c] of plan) c.at = t + (Math.random() - 0.5) * 0.6;
}

/* ---------- 状態 ---------- */
function ring(c) {
  c.state = "ring"; c.ringFrom = S.gt; c.nextHit = 0;
  const L = KINDS[c.kind];
  S.waves.push({ c, t: S.t });
  if (c.kind === "runner") pickTarget(c);
  if (!S.lastHit[c.kind]) { S.lastHit[c.kind] = 1; say(`${L.name}は「${L.how}」で止める`, 2.0); }
}
function stop(c) {
  c.state = "done"; c.doneAt = S.t;
  stopSnd(c); KIT.vibrate(15);
  for (let i = 0; i < 14; i++) { const a = Math.random() * TAU, sp = 90 + Math.random() * 160; S.fx.push({ x: c.x, y: c.y - 30, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: 0.7 + Math.random() * 0.4, c: ["#ffd25e", "#fff", "#ffb08a"][i % 3], r: 2 + Math.random() * 3 }); }
  pop(c, "ピタッ", "#3e8a5a");
  if (S.clocks.every(k => k.state === "done")) clear();
}
function snooze(c) {
  c.state = "snooze"; c.snoozeAt = S.gt + SNOOZE; c.snoozes++;
  snoozeSnd(c); pop(c, "スヌーズ…", "#7a6a5e");
  say(c.kind === "digi" ? "スヌーズ！ デジタルは長押しで止まる" : "スヌーズ！ スマホは横にスライド", 2.2, true);
}
function pop(c, text, col) { S.fx.push({ text, x: c.x + (Math.random() - 0.5) * 30, y: c.y - 70, vy: -40, life: 1.1, col }); }
function say(text, dur = 1.6, warn = false) { S.msg = { text, at: S.t, dur, warn }; }

function pickTarget(c) {
  const b = R.run;
  for (let n = 0; n < 8; n++) {
    const tx = lerp(b.x0, b.x1, Math.random()), ty = lerp(b.y0, b.y1, Math.random());
    if (Math.hypot(tx - c.fx, ty - c.fy) > 40) { c.tx = tx; c.ty = ty; return; }
  }
  c.tx = lerp(b.x0, b.x1, 0.5); c.ty = lerp(b.y0, b.y1, 0.5);
}

/* ---------- 入力 ---------- */
const toWorld = e => { const v = view(); return { x: e.clientX / fit - v.ox, y: e.clientY / fit - v.oy }; };
function pick(p) {
  let best = null, bd = 1e9;
  for (const c of S.clocks) {
    const ay = ANCH * BIG * c.s, cy = c.y - ay - 14 * c.s;
    const d = Math.hypot(p.x - c.x, p.y - cy) - (c.state === "ring" ? 18 : 0);
    if (d < hitR(c) + 18 && d < bd) { bd = d; best = c; }
  }
  return best;
}
cv.addEventListener("pointerdown", e => {
  if (S.state !== "play") return;
  KIT.ensure();
  const p = toWorld(e), c = pick(p);
  S.taps.push({ x: p.x, y: p.y, t: S.t });
  if (!c) return;
  press(c, p, e.pointerId);
});
cv.addEventListener("pointermove", e => { if (S.press && S.press.id === e.pointerId) drag(toWorld(e)); });
const up = e => { if (S.press && S.press.id === e.pointerId) release(); };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
function press(c, p, id = 1) {
  if (c.state !== "ring") { c.wob = 0.5; tapSnd(); if (c.state === "wait") pop(c, "まだ鳴ってない", "#86766a"); return; }
  if (c.kind === "bell" || c.kind === "runner") { stop(c); return; }
  S.press = { c, id, at: S.gt, x0: p.x, y0: p.y };
  try { cv.setPointerCapture(id); } catch (er) {}
  if (c.kind === "digi") holdSnd();
}
function drag(p) {
  const P = S.press; if (!P) return;
  if (P.c.kind === "phone") { P.c.swipe = clamp((p.x - P.x0) / 110, 0, 1) ; if (Math.abs(p.x - P.x0) > 90) { S.press = null; P.c.swipe = 0; stop(P.c); } }
}
function release() {
  const P = S.press; S.press = null; if (!P) return;
  const c = P.c; c.swipe = 0;
  if (c.state !== "ring") return;
  if (c.kind === "digi" || c.kind === "phone") snooze(c);
}

/* ---------- 音 ---------- */
const panOf = c => clamp((c.x - 270) / 300, -0.8, 0.8);
function bellHit(c, hi) {
  const f = hi ? 3100 : 2500 + c.col * 140;
  KIT.tone({ f, dur: 0.06, vol: 0.05, type: "sine", wet: 0.12, pan: panOf(c) });
  KIT.tone({ f: f * 1.51, dur: 0.04, vol: 0.025, type: "sine", wet: 0.1, pan: panOf(c) });
  KIT.noise({ dur: 0.025, vol: 0.05, f: 6000, q: 2, wet: 0.05 });
}
function digiBeep(c) { KIT.tone({ f: c.col ? 2350 : 2050, dur: 0.07, vol: 0.06, type: "square", lp: 5000, wet: 0.05, pan: panOf(c) }); }
const RING = [76, 79, 84, 79, 81, 84, 88, 84];

/* ---------- 進行 ---------- */
let last = performance.now();
function frame(t) { const dt = Math.min(0.1, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(frame); }
function update(dt) {

    if (c.state === "snooze" && S.gt >= c.snoozeAt) { ring(c); pop(c, "また鳴った！", "#d6553c"); }
    if (c.state !== "ring") continue;
    n++; c.ringT += dt;
    rate += c.kind === "runner" ? 0.04 : c.kind === "bell" ? 0.032 : 0.028;
    // 音
    c.nextHit -= dt;
    if (c.nextHit <= 0) {
      if (c.kind === "bell") { bellHit(c, false); c.nextHit = 0.055; }
      else if (c.kind === "runner") { bellHit(c, true); c.nextHit = 0.06; c.mot = (c.mot || 0) + 1; if (c.mot % 3 === 0) motor(c); }

function wallDon() {

}
function clear() {

const RANKS = [[9, "静かな朝の達人"], [14, "てきぱき起床"], [20, "ふつうの朝"], [1e9, "ねぼすけ"]];
function totalRing() { return S.clocks.reduce((s, c) => s + c.ringT, 0); }

}
function shareText() { const r = S.res; return r.ok ? `目覚ましぜんぶ止めで、9個の目覚ましを鳴りっぱなし合計${r.tot.toFixed(1)}秒で止めた\nわたしは「${r.rank}」\n#目覚ましぜんぶ止め` : `目覚ましぜんぶ止めで、壁ドンされた…（${r.stopped}/9個）\n#目覚ましぜんぶ止め`; }

/* ---------- 描画 ---------- */
function drawRoom(g) {

  g.drawImage(im, -R.ox, 0, R.w, R.h);
  // 縦長の画面では、上は壁・下は床のはしを引きのばしてつなぐ
  const ex = 400, k = im.height / R.h;
  g.drawImage(im, 0, 0, im.width, 1, -R.ox, -ex, R.w, ex);
  g.drawImage(im, 0, im.height - 1, im.width, 1, -R.ox, R.h, R.w, ex);
}
function light(g) {
  // 窓からの光の筋とほこり
  g.save(); g.globalCompositeOperation = "screen";
  const t = S.t, w0 = SP.sill;
  for (let i = 0; i < 3; i++) {
    const x = w0.x - 120 + i * 70, a = 0.06 + 0.03 * Math.sin(t * 0.5 + i);
    const gr = g.createLinearGradient(x, 80, x - 80, 760); gr.addColorStop(0, `rgba(255,220,160,${a})`); gr.addColorStop(1, "rgba(255,220,160,0)");
    g.fillStyle = gr; g.beginPath(); g.moveTo(x, 90); g.lineTo(x + 50, 90); g.lineTo(x - 30, 760); g.lineTo(x - 140, 760); g.closePath(); g.fill();
  }
  g.fillStyle = "rgba(255,240,210,.7)";
  for (let i = 0; i < 26; i++) {
    const px = w0.x - 230 + ((i * 97 + t * 6 * (1 + (i % 3))) % 260), py = 160 + ((i * 53 + t * 10 * (1 + (i % 2))) % 520);

}
function drawWaves(g) {

    const c = w.c; if (c.state !== "ring") continue;
    const k = (S.t - w.t) / 0.8, ay = ANCH * BIG * c.s, y = c.y - ay - 12 * c.s * BIG;
    g.save(); g.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; g.lineWidth = 3.5; g.lineCap = "round";

    }

  }
}
function drawRingLabels(g) {
