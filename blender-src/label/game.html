<script>
"use strict";
const GAME_TITLE = "ラベルきれいに";
const GAME_URL = "https://runococco.github.io/picoruno./label.html";
const $ = id => document.getElementById(id);
const W = 720, H = 1080;
const GEO = __JSON_geo__;
const SRC = { bg_water: "__IMG_bg_water__", bg_tea: "__IMG_bg_tea__", bg_soda: "__IMG_bg_soda__" };
let IMG = {};
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const CIRC = 2 * Math.PI * GEO.r;           // ラベル1周の長さ（px）
const LH = GEO.y1 - GEO.y0;                 // ラベルの高さ（px）
const FRONT = -1.15;                        // はがれ目の角度（左の奥寄り、rad）
const BOTTLES = [
  { id: "water", name: "天然水", glue: [[0.3, 0.6], [0.62, 0.7], [0.97, 1]], vmax: 900 },
  { id: "tea", name: "緑茶", glue: [[0.2, 0.7], [0.45, 0.8], [0.72, 0.9], [0.97, 1]], vmax: 760 },
  { id: "soda", name: "サイダー", glue: [[0.15, 0.8], [0.35, 0.9], [0.55, 0.85], [0.78, 1], [0.97, 1]], vmax: 640 }
];
const S = { state: "title", t: 0, round: 0, p: 0, grip: null, anchor: 0, notch: 0, notchSide: 1, finger: { x: 0, y: 0 }, results: [], parts: [], msg: null,
  torn: null, peelV: 0, done: false, shake: 0 };
const B = () => BOTTLES[S.round];

/* ---------- ラベルの絵（canvas で作る。シンプルで平たいデザイン） ---------- */
const LAB = {};
function makeLabels() {
  const w = Math.round(CIRC), h = Math.round(LH);
  for (const b of BOTTLES) {
    const c = document.createElement("canvas"); c.width = w * 2; c.height = h * 2;
    const g = c.getContext("2d"); g.scale(2, 2);
    if (b.id === "water") {
      const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#e9f5fc"); gr.addColorStop(1, "#bfe0f4"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
      g.fillStyle = "#3f8fd0"; g.fillRect(0, h * 0.82, w, h * 0.18);
      for (let k = 0; k < 2; k++) {  // 山
        const x = w * (0.25 + k * 0.5);
        g.fillStyle = "#7fb8e0"; g.beginPath(); g.moveTo(x - 120, h * 0.82); g.lineTo(x - 30, h * 0.42); g.lineTo(x + 20, h * 0.58); g.lineTo(x + 70, h * 0.36); g.lineTo(x + 160, h * 0.82); g.fill();
        g.fillStyle = "#fff"; g.beginPath(); g.moveTo(x + 70, h * 0.36); g.lineTo(x + 52, h * 0.45); g.lineTo(x + 70, h * 0.43); g.lineTo(x + 86, h * 0.46); g.fill();
        g.fillStyle = "#245d8f"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.textAlign = "center"; g.fillText("やまのみず", x + 10, h * 0.28);
      }
      g.fillStyle = "#fff"; g.font = '700 15px "Zen Maru Gothic",sans-serif'; g.textAlign = "left";
      for (let k = 0; k < 4; k++) g.fillText("天然水 550ml", 20 + k * w / 4, h * 0.93);
    } else if (b.id === "tea") {
      g.fillStyle = "#f4f1e2"; g.fillRect(0, 0, w, h);
      g.fillStyle = "#3f8a4e"; g.fillRect(0, 0, w, h * 0.16); g.fillRect(0, h * 0.84, w, h * 0.16);
      for (let k = 0; k < 2; k++) {
        const x = w * (0.25 + k * 0.5);
        g.fillStyle = "#5aa36a"; g.beginPath(); g.ellipse(x - 70, h * 0.5, 34, 18, -0.6, 0, 6.283); g.fill();
        g.strokeStyle = "#2f6a3c"; g.lineWidth = 2; g.beginPath(); g.moveTo(x - 96, h * 0.6); g.lineTo(x - 44, h * 0.4); g.stroke();
        g.fillStyle = "#2f6a3c"; g.font = '800 38px "M PLUS Rounded 1c",sans-serif'; g.textAlign = "left"; g.fillText("まいにち", x - 20, h * 0.47);
        g.font = '800 52px "M PLUS Rounded 1c",sans-serif'; g.fillText("緑茶", x - 20, h * 0.71);
      }
      g.fillStyle = "#fff"; g.font = '700 15px "Zen Maru Gothic",sans-serif'; g.textAlign = "left";
      for (let k = 0; k < 4; k++) g.fillText("お茶 525ml", 20 + k * w / 4, h * 0.94);
    } else {
      const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#2a5fb8"); gr.addColorStop(1, "#173f86"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
      const rnd = KIT.rng(9);
      for (let k = 0; k < 60; k++) { g.strokeStyle = `rgba(255,255,255,${0.3 + rnd() * 0.5})`; g.lineWidth = 2; g.beginPath(); g.arc(rnd() * w, rnd() * h, 3 + rnd() * 12, 0, 6.283); g.stroke(); }
      for (let k = 0; k < 2; k++) {
        const x = w * (0.25 + k * 0.5);
        g.fillStyle = "#fff"; g.font = '800 34px "M PLUS Rounded 1c",sans-serif'; g.textAlign = "center"; g.fillText("しゅわっと", x, h * 0.42);
        g.font = '800 54px "M PLUS Rounded 1c",sans-serif'; g.fillText("サイダー", x, h * 0.66);
      }
      g.fillStyle = "#e84c4c"; g.fillRect(0, h * 0.86, w, h * 0.14);
    }
    // 継ぎ目（はじまりのつまみ）とミシン目なし
    g.fillStyle = "rgba(0,0,0,.08)"; g.fillRect(0, 0, 3, h);
    LAB[b.id] = c;
  }
}

/* ---------- canvas ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  fit = Math.min(Math.max(vw / W, vh / H), vh / 900);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
}
window.addEventListener("resize", resize);
function view() { const lw = vw / fit, lh = vh / fit; return { lw, lh, ox: (lw - W) / 2, oy: clamp(lh * 0.5 - (GEO.y0 + GEO.y1) / 2, lh - H, 0) }; }
function toWorld(e) { const v = view(); return { x: e.clientX / fit - v.ox, y: e.clientY / fit - v.oy }; }

function render() {
  const v = view();
  cx.setTransform(dpr * fit, 0, 0, dpr * fit, 0, 0);
  cx.translate(v.ox + (Math.random() - 0.5) * S.shake, v.oy);
  const bg = IMG["bg_" + B().id];
  if (bg && v.lw > W + 1) {
    cx.save(); cx.filter = "blur(16px)"; cx.drawImage(bg, -v.ox - 40, -v.oy - 40, v.lw + 80, v.lh + 80); cx.restore();
    cx.fillStyle = "rgba(241,236,228,.3)"; cx.fillRect(-v.ox, -v.oy, v.lw, v.lh);
  }
  if (bg) cx.drawImage(bg, 0, 0, W, H);
  drawLabel(cx);
  drawStrip(cx);
  for (const q of S.parts) { cx.globalAlpha = clamp(q.life, 0, 1); cx.fillStyle = q.c; cx.fillRect(q.x, q.y, q.r, q.r); }
  cx.globalAlpha = 1;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (S.state === "play") drawHud();
}
/* 円筒に巻いたラベル。u は 0..1（継ぎ目から）。p より先が、まだ貼りついている */
const rho = () => 2 * Math.PI * S.p - FRONT;
function edgeY(theta, top) { const c = Math.cos(theta); return top ? GEO.y0 + GEO.bulge0 * (c - 1) : GEO.y1 + GEO.bulge1 * (c - 1); }
function drawLabel(g) {
  const lab = LAB[B().id]; if (!lab) return;
  const r = GEO.r, x0 = GEO.cx, ro = rho();
  const step = 2;
  for (let x = -r + 0.5; x < r; x += step) {
    const th = Math.asin(clamp(x / r, -1, 1));
    const phi = th + ro, u = phi / (2 * Math.PI);
    if (u < S.p || u >= 1) continue;
    const yt = edgeY(th, true), yb = edgeY(th, false);
    const su = u * lab.width;
    g.drawImage(lab, su, 0, Math.max(1, step / (2 * Math.PI * r) * lab.width * (1 / Math.max(0.15, Math.cos(th)))), lab.height, x0 + x - 0.5, yt, step + 1, yb - yt);
  }
  // 円筒の陰影とつや
  g.save();
  g.beginPath(); g.rect(x0 - r, GEO.y0 - 20, 2 * r, LH + 40); g.clip();
  const sh = g.createLinearGradient(x0 - r, 0, x0 + r, 0);
  sh.addColorStop(0, "rgba(40,30,20,.45)"); sh.addColorStop(0.18, "rgba(40,30,20,.08)"); sh.addColorStop(0.32, "rgba(255,255,255,.28)"); sh.addColorStop(0.4, "rgba(255,255,255,0)");
  sh.addColorStop(0.75, "rgba(40,30,20,.05)"); sh.addColorStop(1, "rgba(40,30,20,.4)");
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = sh; g.fillRect(x0 - r, GEO.y0 - 20, 2 * r, LH + 40);
  g.restore();
  // 「のり」：はがれ目の先に、てかっと光るすじ
  for (const [gu, st] of B().glue) {
    if (gu < S.p) continue;
    const th = gu * 2 * Math.PI - ro; if (th < -1.5 || th > 1.5) continue;
    const x = x0 + r * Math.sin(th), a = (0.25 + st * 0.35) * Math.cos(th);
    g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x, edgeY(th, true) + 6); g.lineTo(x, edgeY(th, false) - 6); g.stroke();
    g.setLineDash([2, 6]); g.strokeStyle = `rgba(255,255,255,${a * 1.4})`; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x + 4, edgeY(th, true) + 8); g.lineTo(x + 4, edgeY(th, false) - 8); g.stroke(); g.setLineDash([]);
  }
  // はがれ目の裂け目（ずれるほど深くなる）
  const fx = x0 + r * Math.sin(FRONT);
  if (S.notch > 0.03 && !S.torn) {
    const top = S.notchSide < 0, d = S.notch * LH * 0.55;
    const ye = edgeY(FRONT, top);
    g.fillStyle = "rgba(60,45,30,.55)";
    g.beginPath(); g.moveTo(fx - 1, ye); g.lineTo(fx + 7 + S.notch * 8, top ? ye + d : ye - d); g.lineTo(fx + 12, ye); g.closePath(); g.fill();
  }
}
/* はがれた帯：はがれ目から指まで、たるみつつつながる。余りは指から垂れる */
function stripPath() {
  const fx = GEO.cx + GEO.r * Math.sin(FRONT), fy = (GEO.y0 + GEO.y1) / 2;
  const peeled = S.p * CIRC;
  if (peeled < 1) return null;
  const f = S.grip ? S.finger : (S.rest || { x: fx - 40, y: fy + 80 });
  const d = Math.hypot(f.x - fx, f.y - fy);
  const len = Math.min(peeled, S.grip ? S.anchor : peeled);
  const slack = Math.max(0, len - d);
  const pts = [];
  const n = 60;
  const reach = Math.min(1, len / Math.max(1, d));
  const ex = fx + (f.x - fx) * reach, ey = fy + (f.y - fy) * reach;
  const mx = (fx + ex) / 2, my = (fy + ey) / 2 + slack * 0.55;
  for (let i = 0; i <= n; i++) { const k = i / n; pts.push([(1 - k) * (1 - k) * fx + 2 * k * (1 - k) * mx + k * k * ex, (1 - k) * (1 - k) * fy + 2 * k * (1 - k) * my + k * k * ey]); }
  // 余り（指から下へ垂れる）
  const tail = peeled - len;
  if (tail > 2) { const sx = Math.sin(S.t * 2) * 6; for (let i = 1; i <= 10; i++) { const k = i / 10; pts.push([ex - tail * k * 0.75 + sx * k, ey + tail * k * k * 0.55]); } }
  return pts;
}
function drawStrip(g) {
  const pts = S.torn ? S.torn.pts : stripPath(); if (!pts || pts.length < 2) return;
  const lab = LAB[B().id]; if (!lab) return;
  const hh = LH * 0.5, pAt = S.torn ? S.torn.p : S.p;
  g.save();
  if (S.torn) g.translate(S.torn.dx, S.torn.dy);
  // はがれた帯は、印刷面がこちらを向く。はがれ目からの長さで、ラベルのどこかが決まる
  let sAcc = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]); if (len < 0.01) continue;
    const u0 = pAt - (sAcc + len) / CIRC, u1 = pAt - sAcc / CIRC;
    sAcc += len;
    if (u1 <= 0) break;
    const ua = Math.max(0, u0);
    // 帯の「上」はいつも画面の上。中心線にそって、ラベルの細い切れはしを平行四辺形にして並べる
    const k = (u1 - ua) / (u1 - u0), bx = a[0] + (b[0] - a[0]) * k, by = a[1] + (b[1] - a[1]) * k;
    const steep = Math.abs(b[1] - a[1]) / Math.max(1, len);
    g.save(); g.transform((a[0] - bx) * 1.06, (a[1] - by) * 1.06, 0, 1 - steep * 0.35, bx, by);
    g.drawImage(lab, ua * lab.width, 0, Math.max(1, (u1 - ua) * lab.width), lab.height, 0, -hh, 1, 2 * hh);
    g.fillStyle = `rgba(30,20,10,${0.06 + steep * 0.18})`; g.fillRect(0, -hh, 1, 2 * hh);
    g.restore();
  }
  g.restore();
}
function drawHud() {
  const g = cx, sf = KIT.safe(), top = 12 + sf.top, w = Math.min(vw - 80, 360);
  g.save();
  g.fillStyle = "rgba(58,52,48,.62)"; rr(g, 12, top, w, 54, 16); g.fill();
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "left";
  g.font = '800 20px "M PLUS Rounded 1c",sans-serif';
  g.fillText(`${S.round + 1}/3　${B().name}`, 28, top + 28);
  g.textAlign = "right"; g.fillText(`${Math.floor(S.p * 100)}%`, 12 + w - 14, top + 28);
  if (S.msg && S.t - S.msg.at < S.msg.dur) {
    const al = clamp((S.msg.dur - (S.t - S.msg.at)) / 0.3, 0, 1);
    g.globalAlpha = al; g.font = '700 18px "Zen Maru Gothic",sans-serif'; g.textAlign = "center";
    const tw = g.measureText(S.msg.text).width + 40, y = top + 66;
    g.fillStyle = "rgba(58,52,48,.85)"; rr(g, vw / 2 - tw / 2, y, tw, 42, 21); g.fill();
    g.fillStyle = "#fff"; g.fillText(S.msg.text, vw / 2, y + 22);
    g.globalAlpha = 1;
  }
  // つまむ場所のヒント
  if (S.p < 0.002 && !S.grip) {
    const v = view(), fx = (GEO.cx + GEO.r * Math.sin(FRONT) + v.ox) * fit, fy = ((GEO.y0 + GEO.y1) / 2 + v.oy) * fit;
    const k = (Math.sin(S.t * 4) + 1) / 2;
    g.strokeStyle = `rgba(255,255,255,${0.5 + k * 0.5})`; g.lineWidth = 3; g.beginPath(); g.arc(fx, fy, 16 + k * 8, 0, 6.283); g.stroke();
  }
  g.restore();
}
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function say(text, dur = 1.8) { S.msg = { text, at: S.t, dur }; }

/* ---------- 入力 ---------- */
const frontPt = () => ({ x: GEO.cx + GEO.r * Math.sin(FRONT), y: (GEO.y0 + GEO.y1) / 2 });
cv.addEventListener("pointerdown", e => {
  if (S.state !== "play") return;
  const p = toWorld(e), f = frontPt();
  const d = Math.hypot(p.x - f.x, p.y - f.y);
  if (S.p < 0.002 && d > 80) { say("ラベルのはし（光っている所）をつまんで", 1.6); return; }
  S.grip = { id: e.pointerId }; S.finger = p; S.anchor = Math.min(S.p * CIRC, d);
  S.lastMove = { x: p.x, y: p.y, t: S.t };
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  KIT.tone({ f: 900, dur: 0.03, vol: 0.04, type: "triangle", wet: 0 });
});
cv.addEventListener("pointermove", e => {
  if (!S.grip || S.state !== "play") return;
  S.finger = toWorld(e);
});
const release = () => { if (S.grip) { S.rest = { x: S.finger.x, y: S.finger.y }; S.grip = null; } };
cv.addEventListener("pointerup", release); cv.addEventListener("pointercancel", release);

/* ---------- 音 ---------- */
let peelAcc = 0;
function peelSound(v, glue) {
  peelAcc += v * (glue ? 0.05 : 0.09);
  while (peelAcc > 1) {
    peelAcc -= 1;
    KIT.noise({ dur: glue ? 0.05 : 0.025, vol: glue ? 0.09 : 0.05, f: glue ? 1300 : 2600 + Math.random() * 1500, q: glue ? 2.5 : 1.6, wet: 0.03 });
  }
}

/* ---------- 進行 ---------- */
let last = performance.now();
function frame(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(frame); }
function glueAt(u) { let s = 0; for (const [gu, st] of B().glue) { const d = Math.abs(u - gu); if (d < 0.03) s = Math.max(s, st * (1 - d / 0.03)); } return s; }
function update(dt) {
  S.t += dt; S.shake = Math.max(0, S.shake - dt * 40);
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 600 * dt; q.life -= dt * 1.5; }
  S.parts = S.parts.filter(q => q.life > 0);
  if (S.torn) { S.torn.vy += 1400 * dt; S.torn.dy += S.torn.vy * dt; S.torn.dx -= 30 * dt; }
  if (S.state !== "play") { S.notch = Math.max(0, S.notch - dt * 0.5); return; }
  if (S.grip) {
    const f = frontPt(), p = S.finger;
    const d = Math.hypot(p.x - f.x, p.y - f.y);
    if (d > S.anchor) {
      // ぴんと張った：はがれる
      const glue = glueAt(S.p);
      const dl = (d - S.anchor) * (1 - glue * 0.45);
      const v = dl / dt;
      S.peelV = lerp(S.peelV, v, 0.3);
      S.p = Math.min(1, S.p + dl / CIRC);
      S.anchor = d;
      // 引く向き：真横（左）からのずれ
      const ang = Math.atan2(p.y - f.y, f.x - p.x);   // 上向きが負
      const dev = Math.abs(ang) * 180 / Math.PI;
      const vlim = B().vmax * (1 - glue * 0.7);
      let grow = 0;
      if (p.x > f.x - 10) grow += dl * 0.02;          // うしろへ引いている
      if (dev > 16) grow += (dev - 16) * 0.0009 * dl;
      if (S.peelV > vlim) grow += (S.peelV - vlim) / vlim * dl * 0.03;
      if (grow > 0) { S.notch += grow; S.notchSide = Math.sign(ang) || 1; creak(); }
      else S.notch = Math.max(0, S.notch - dl * 0.004);
      peelSound(dl, glue > 0.2);
      if (S.notch >= 1) tear();
      else if (S.p >= 1) complete();
    } else S.peelV = lerp(S.peelV, 0, 0.2);
  }
  S.notch = Math.max(0, S.notch - dt * 0.03);
}
let creakT = 0;
function creak() {
  if (S.t - creakT < 0.08) return; creakT = S.t;
  KIT.tone({ f: 500 + S.notch * 900, dur: 0.06, vol: 0.03 + S.notch * 0.05, type: "sawtooth", lp: 2200, wet: 0 });
}
function tear() {
  const pts = stripPath();
  S.torn = { pts: pts || [], dx: 0, dy: 0, vy: -80, p: S.p };
  S.grip = null;
  KIT.noise({ dur: 0.35, vol: 0.2, f: 3500, to: 1200, q: 0.9, wet: 0.1 });
  KIT.tone({ f: 300, to: 150, dur: 0.3, vol: 0.06, type: "triangle", wet: 0.1 });
  KIT.vibrate([30, 30, 30]); S.shake = 8;
  const f = frontPt();
  for (let i = 0; i < 16; i++) S.parts.push({ x: f.x, y: f.y + (S.notchSide < 0 ? -LH / 2 : LH / 2) * 0.6, vx: (Math.random() - 0.7) * 200, vy: -Math.random() * 200, r: 2 + Math.random() * 3, life: 1, c: "#f4f1ea" });
  endRound(false);
}
function complete() {
  S.torn = { pts: stripPath() || [], dx: 0, dy: 0, vy: -200, p: S.p };
  S.grip = null;
  [0, 4, 7, 12].forEach((d, i) => KIT.inst.bell(72 + d, i * 0.08, 0.4, 0.12));
  KIT.noise({ dur: 0.2, vol: 0.08, f: 2400, q: 1, wet: 0.1 });
  KIT.vibrate([20, 40, 20]);
  endRound(true);
}
function endRound(ok) {
  S.state = "judge"; S.judgeAt = S.t;
  const pct = ok ? 100 : Math.floor(S.p * 100);
  S.results.push({ name: B().name, id: B().id, pct, ok });
  const pt = $("jPt"); pt.className = "pt" + (ok ? "" : " ng"); pt.innerHTML = `${pct}<small>%</small>`;
  $("jHead").textContent = ok ? `${B().name}　1周きれいに！` : `${B().name}　ビリッ…`;
  $("jDetail").textContent = ok ? "ちぎれずに、まるごと1枚" : pct < 30 ? "まだはじまったばかりだった" : pct < 70 ? "半分くらいで、ちぎれた" : "あと少しだった";
  setTimeout(() => { $("judge").hidden = false; }, 700);
}
function nextRound() {
  if (S.t - S.judgeAt < 1.0) return;
  $("judge").hidden = true;
  KIT.tone({ f: 880, dur: 0.05, vol: 0.08, type: "triangle", wet: 0 });
  if (S.round < 2) startRound(S.round + 1); else finish();
}
function startRound(i) {
  S.round = i; S.state = "play"; S.p = 0; S.grip = null; S.anchor = 0; S.notch = 0; S.torn = null; S.rest = null; S.peelV = 0;
  say(["左のはしをつまんで、真横へ", "緑茶は、のりが多め", "サイダーのラベルは、ぴったり貼りつく"][i], 2.2);
}
function startGame() {
  KIT.ensure();
  $("title").hidden = true; $("result").hidden = true; $("judge").hidden = true;
  S.results = [];
  startMusic(false); KIT.countPlay(GAME_TITLE);
  startRound(0);
}
const RANKS = [[300, "ラベルはがしの達人"], [260, "分別の優等生"], [200, "わりときれい派"], [120, "ちぎれがち"], [0, "ビリビリ派"]];
function finish() {
  S.state = "result";
  const total = S.results.reduce((a, r) => a + r.pct, 0);
  S.total = Math.round(total / 3); S.rank = RANKS.find(r => total >= r[0])[1];
  $("rBig").innerHTML = `${S.total}<small>%</small>`;
  $("rRank").textContent = S.rank;
  $("rLaps").innerHTML = S.results.map(r => `<div class="lap${r.ok ? " ok" : ""}"><small>${r.name}</small><b>${r.ok ? "1周！" : r.pct + "%"}</b></div>`).join("");
  const best = KIT.store.get("label-best", null);
  if (best === null || S.total > best) KIT.store.set("label-best", S.total);
  const n = S.results.filter(r => r.ok).length;
  $("rNote").textContent = `${n}本、まるごとはがせた。` + (best === null || S.total > best ? "自己ベスト更新！" : `自己ベスト ${best}%`);
  $("result").hidden = false;
  KIT.music.stop(); setTimeout(() => startMusic(true), 500);
}
function shareText() { return `ラベルきれいに、3本のラベルを平均 ${S.total}% きれいにはがせた\nわたしは「${S.rank}」\n${S.results.map(r => `${r.name} ${r.ok ? "1周！" : r.pct + "%"}`).join("・")}\n#ラベルきれいに`; }
function shareCanvas() {
  const c = document.createElement("canvas"); c.width = 1200; c.height = 630;
  const g = c.getContext("2d");
  g.fillStyle = "#f1ece4"; g.fillRect(0, 0, 1200, 630);
  // はがしたラベルを、平らにならべる（ちぎれたところはギザギザ）
  S.results.forEach((r, i) => {
    const lab = LAB[r.id], y = 70 + i * 150, w = 540, h = 120, cut = w * r.pct / 100;
    g.save(); g.translate(40, y); g.rotate((i - 1) * -0.03);
    g.fillStyle = "rgba(0,0,0,.08)"; g.fillRect(6, 8, cut, h);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(cut, 0);
    if (!r.ok) { const rnd = KIT.rng(i + 3); for (let k = 0; k <= 8; k++) g.lineTo(cut + (rnd() - 0.5) * 18, h * k / 8); }
    else g.lineTo(cut, h);
    g.lineTo(0, h); g.closePath(); g.clip();
    g.drawImage(lab, 0, 0, lab.width * r.pct / 100, lab.height, 0, 0, cut, h);
    g.restore();
    g.fillStyle = r.ok ? "#4f9a6a" : "#d65a4a"; g.font = '800 26px "M PLUS Rounded 1c",sans-serif'; g.textAlign = "left";
    g.fillText(r.ok ? "1周！" : `${r.pct}%`, 40 + Math.max(cut, 60) + 16, y + 72);
  });
  g.fillStyle = "#fffdf9"; g.fillRect(720, 0, 480, 630);
  g.fillStyle = "#3f8fd0"; g.fillRect(720, 0, 10, 630);
  g.textAlign = "left";
  g.fillStyle = "#3a3430"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText("ラベルきれいに", 770, 100);
  g.fillStyle = "#857a70"; g.font = '700 22px "Zen Maru Gothic",sans-serif'; g.fillText("3本のラベル、きれいにはがせた", 770, 180);
  g.fillStyle = "#2c6ea6"; g.font = '800 110px "M PLUS Rounded 1c",sans-serif';
  const t = String(S.total); g.fillText(t, 770, 300);
  const tw = g.measureText(t).width; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText("%", 780 + tw, 300);
  g.fillStyle = "#3a3430"; g.font = '800 34px "M PLUS Rounded 1c",sans-serif'; g.fillText(S.rank, 770, 380);
  g.fillStyle = "#857a70"; g.font = '700 20px "Zen Maru Gothic",sans-serif'; g.fillText("#ラベルきれいに ・ picoruno.", 770, 590);
  return c;
}
function startMusic(calm) {
  KIT.music.start(calm
    ? { bpm: 74, key: 67, chords: [[0, 4, 7, 11], [9, 12, 16, 19], [5, 9, 12, 16], [7, 11, 14, 17]], lead: "pluck", chord: "pad", beat: "none", seed: 81, leadVol: 0.07, chordVol: 0.05, density: 0.5 }
    : { bpm: 96, key: 67, chords: [[0, 4, 7, 11], [5, 9, 12, 16], [9, 12, 16, 19], [7, 11, 14, 17]], lead: "pluck", chord: "epiano", beat: "lofi", seed: 29, leadVol: 0.06, chordVol: 0.05, density: 0.6, swing: 0.12 });
}

/* ---------- ボタン ---------- */
$("start").addEventListener("click", startGame);
$("again").addEventListener("click", startGame);
$("judge").addEventListener("click", nextRound);
$("xBtn").addEventListener("click", () => KIT.tweet(shareText(), GAME_URL));
$("imgBtn").addEventListener("click", async () => { const r = await KIT.shareImage(shareCanvas(), "label.png", shareText()); if (r === "downloaded") toast("画像を保存しました"); });
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => t.hidden = true, 1800); }
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function muteIcon() { $("mute").innerHTML = KIT.muted ? ICON_OFF : ICON_ON; $("mute").setAttribute("aria-pressed", KIT.muted); }
$("mute").addEventListener("click", () => { KIT.setMuted(!KIT.muted); muteIcon(); if (!KIT.muted) KIT.ensure(); });

(async function boot() {
  resize(); muteIcon();
  const best = KIT.store.get("label-best", null);
  $("best").textContent = best !== null ? `自己ベスト ${best}%` : "3本のラベルを、1周まるごと";
  IMG = await KIT.loadImages(SRC);
  try { await document.fonts.ready; } catch (e) {}
  makeLabels();
  requestAnimationFrame(frame);
})();
window.__S = S; window.__T = { frontPt, CIRC, view, fit: () => fit };
