<script>
"use strict";
const GAME_TITLE = "コードほどき";
const GAME_URL = "https://runococco.github.io/picoruno./code.html";
const $ = id => document.getElementById(id);
const W = 720, H = 1080;
const GEO = __JSON_geo__;
const SRC = { bg: "__IMG_bg__", plugS: "__IMG_plugS__", plugM: "__IMG_plugM__" };
let IMG = {};
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

const CABW = 15;                                   // ケーブルの太さ
const PLUG_K = 2.2;                                // プラグは実物の 2.2 倍（ケーブルが太いので）
const PCW = GEO.pcell * GEO.ppc * PLUG_K;          // プラグの絵 1 つの大きさ
const BAGS = [{ n: 4, pts: 4 }, { n: 6, pts: 4 }, { n: 8, pts: 4 }];
const PENALTY = 2;
const COLS = [
  { name: "しろ", c: [236, 234, 228] }, { name: "くろ", c: [46, 46, 50] }, { name: "グレー", c: [150, 152, 156] }, { name: "コーラル", c: [228, 122, 96] },
  { name: "ミント", c: [128, 200, 176] }, { name: "水色", c: [120, 170, 220] }, { name: "からし", c: [222, 178, 68] }, { name: "ラベンダー", c: [170, 150, 210] }
];
const LIGHT = (() => { const l = [-0.45, -0.55, 0.7], n = Math.hypot(...l); return l.map(v => v / n); })();

const S = { state: "title", t: 0, bag: 0, time: 0, miss: 0, cables: [], cross: [], pulling: null, msg: null, parts: [], flash: [], res: null, lock: 0, bagTimes: [], snap: null, dirty: true };

/* ---------- canvas ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  fit = Math.min(Math.max(vw / W, vh / H), vh / 900);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  S.dirty = true;
}
window.addEventListener("resize", resize);
function view() { const lw = vw / fit, lh = vh / fit; return { lw, lh, ox: (lw - W) / 2, oy: clamp(lh * 0.5 - 560, lh - H, 0) }; }
function visX() { const v = view(); return [Math.max(GEO.inner[0][0], -v.ox), Math.min(GEO.inner[1][0], W + v.ox)]; }
function mk(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }

/* ---------- ケーブルの形 ---------- */
function catmull(P, step) {     // P: 点の列 → なめらかな折れ線（ほぼ等間隔）
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    const n = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  out.push(P[P.length - 1].slice());
  return out;
}
function smooth(P) {      // するどい折れ目をならす（はしの近くはそのまま）
  let Q = P.map(p => p.slice());
  for (let it = 0; it < 30; it++) {
    const R = Q.map(p => p.slice());
    for (let i = 10; i < Q.length - 10; i++) { R[i][0] = (Q[i - 1][0] + Q[i][0] * 2 + Q[i + 1][0]) / 4; R[i][1] = (Q[i - 1][1] + Q[i][1] * 2 + Q[i + 1][1]) / 4; }
    for (let i = 4; i < 10; i++) for (const j of [i, Q.length - 1 - i]) { const k = (i - 4) / 6; R[j][0] = lerp(Q[j][0], (Q[j - 1][0] + Q[j][0] * 2 + Q[j + 1][0]) / 4, k); R[j][1] = lerp(Q[j][1], (Q[j - 1][1] + Q[j][1] * 2 + Q[j + 1][1]) / 4, k); }
    Q = R;
  }
  // 長いあいだ間隔がのびちぢみしないよう、6px ごとに取りなおす
  const out = [Q[0]]; let acc = 0;
  for (let i = 1; i < Q.length; i++) {
    let a = Q[i - 1], b = Q[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    while (acc + d >= 6) { const k = (6 - acc) / d; const p = [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; out.push(p); a = p; d = Math.hypot(b[0] - a[0], b[1] - a[1]); acc = 0; }
    acc += d;
  }
  out.push(Q[Q.length - 1]);
  return out;
}
function segX(a, b, c, d) {      // 線分 ab と cd の交点（t, u）
  const r0 = b[0] - a[0], r1 = b[1] - a[1], s0 = d[0] - c[0], s1 = d[1] - c[1], den = r0 * s1 - r1 * s0;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((c[0] - a[0]) * s1 - (c[1] - a[1]) * s0) / den, u = ((c[0] - a[0]) * r1 - (c[1] - a[1]) * r0) / den;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? [t, u] : null;
}
function crossings(A, B, self) {
  const out = [];
  for (let i = 0; i < A.length - 1; i++) {
    const a = A[i], b = A[i + 1];
    const minx = Math.min(a[0], b[0]), maxx = Math.max(a[0], b[0]), miny = Math.min(a[1], b[1]), maxy = Math.max(a[1], b[1]);
    for (let j = self ? i + 3 : 0; j < B.length - 1; j++) {
      const c = B[j], d = B[j + 1];
      if (Math.max(c[0], d[0]) < minx || Math.min(c[0], d[0]) > maxx || Math.max(c[1], d[1]) < miny || Math.min(c[1], d[1]) > maxy) continue;
      const h = segX(a, b, c, d);
      if (h) out.push({ ia: i + h[0], ib: j + h[1], x: lerp(a[0], b[0], h[0]), y: lerp(a[1], b[1], h[0]) });
    }
  }
  return out;
}
function makeBag(r, spec) {
  const [x0, x1] = visX(), v = view(), y0 = Math.max(GEO.inner[0][1], -v.oy) + 150, y1 = Math.min(GEO.inner[1][1], v.lh - v.oy) - 140;
  const cx0 = x0 + PCW * 0.82, cx1 = x1 - PCW * 0.82, ctr = [(cx0 + cx1) / 2, (y0 + y1) / 2];
  const inw = p => { const d = Math.hypot(ctr[0] - p[0], ctr[1] - p[1]); return [p[0] + (ctr[0] - p[0]) / d * 70, p[1] + (ctr[1] - p[1]) / d * 70]; };
  const near = (pts, e, R) => { for (let i = 0; i < pts.length; i += 2) if (Math.hypot(pts[i][0] - e[0], pts[i][1] - e[1]) < R) return true; return false; };
  for (let attempt = 0; attempt < 40; attempt++) {
    makeBag.tries = attempt;
    const colors = COLS.slice().sort(() => r() - 0.5);
    // はしは、ふちにそって散らばる
    const ends = [], per = (cx1 - cx0) * 2 + (y1 - y0) * 2, off = r() * per;
    for (let i = 0; i < spec.n * 2; i++) {
      let d = (off + per * (i + 0.2 + r() * 0.6) / (spec.n * 2)) % per, p;
      if (d < cx1 - cx0) p = [cx0 + d, y0]; else if ((d -= cx1 - cx0) < y1 - y0) p = [cx1, y0 + d]; else if ((d -= y1 - y0) < cx1 - cx0) p = [cx1 - d, y1]; else { d -= cx1 - cx0; p = [cx0, y1 - d]; }
      ends.push(p);
    }
    const order = ends.map((_, i) => i).sort(() => r() - 0.5);
    const cables = [], cross = [];
    let ok = true;
    for (let k = 0; k < spec.n && ok; k++) {
      const A = ends[order[k * 2]], B = ends[order[k * 2 + 1]], a1 = inw(A), b1 = inw(B);
      let got = null;
      for (let t = 0; t < 50 && !got; t++) {
        // A から B へ、ゆらゆらと寄り道しながら進む
        const P = [A, a1];
        for (let q = 1; q <= spec.pts; q++) {
          const kk = q / (spec.pts + 1), bx = lerp(a1[0], b1[0], kk), by = lerp(a1[1], b1[1], kk);
          const dx = b1[0] - a1[0], dy = b1[1] - a1[1], dl = Math.hypot(dx, dy) || 1;
          const sw = (r() - 0.5) * 2 * Math.min(240, (cx1 - cx0) * 0.5);
          P.push([clamp(bx - dy / dl * sw, cx0 + 30, cx1 - 30), clamp(by + dx / dl * sw, y0 + 40, y1 - 40)]);
        }
        P.push(b1, B);
        const pts = smooth(catmull(P, 6));
        if (crossings(pts, pts, true).length) continue;
        // 急な折れ曲がり（ヘアピン）はなし
        let sharp = false;
        for (let i = 3; i < pts.length - 3 && !sharp; i++) { const a = pts[i - 3], b = pts[i], c = pts[i + 3]; const t1 = Math.atan2(b[1] - a[1], b[0] - a[0]), t2 = Math.atan2(c[1] - b[1], c[0] - b[0]); let d = Math.abs(t2 - t1); if (d > Math.PI) d = TAU - d; if (d > 1.15) sharp = true; }
        if (sharp) continue;
        // プラグのそばは通らない
        let bad = false;
        const plugPts = q => { const out = []; for (const [e, f] of [[q[0], q[3]], [q[q.length - 1], q[q.length - 4]]]) { const ux = e[0] - f[0], uy = e[1] - f[1], ul = Math.hypot(ux, uy) || 1; for (const k of [0, 40, 80, 115]) out.push([e[0] + ux / ul * k, e[1] + uy / ul * k]); } return out; };
        const mp = plugPts(pts);
        for (const c of cables) { if (plugPts(c.pts).some(e => near(pts, e, 32)) || mp.some(e => near(c.pts, e, 32))) { bad = true; break; } }
        if (bad) continue;
        // 交差どうしが近すぎると、どっちが上か見分けにくい
        const mine = [];
        for (const c of cables) for (const h of crossings(c.pts, pts, false)) mine.push({ a: c.id, b: k, ia: h.ia, ib: h.ib, x: h.x, y: h.y });
        const all = cross.concat(mine);
        for (const m of mine) { for (const o of all) if (o !== m && Math.hypot(o.x - m.x, o.y - m.y) < 24) { bad = true; break; } if (bad) break; }
        if (bad) continue;
        got = { pts, mine };
      }
      if (!got) { ok = false; break; }
      const jack = r() < 0.18;
      cables.push({ id: k, pts: got.pts, col: colors[k % colors.length], kinds: [jack ? "jack" : r() < 0.5 ? "usbc" : "light", jack ? "jack" : r() < 0.6 ? "usba" : "usbc"], gone: false });
      cross.push(...got.mine);
    }
    if (!ok || cross.length < spec.n * 1.4) continue;
    if (cables.some(c => !cross.some(x => x.a === c.id || x.b === c.id))) continue;   // どのケーブルも、どこかで重なっている
    // ぬく順番をきめて、先にぬくほうを上にする（かならず解ける）
    const rank = cables.map((_, i) => i).sort(() => r() - 0.5);
    const pos = []; rank.forEach((id, i) => pos[id] = i);
    for (const c of cross) c.over = pos[c.a] < pos[c.b] ? c.a : c.b;
    return { cables, cross, solution: rank };
  }
  return null;
}

/* ---------- 描く：光の向きをそろえた筒 ---------- */
function shadeAt(nx, ny, t) {   // 断面の位置 t（-1〜1）の明るさ
  const z = Math.sqrt(Math.max(0, 1 - t * t)), sx = nx * t, sy = ny * t;
  const d = Math.max(0, sx * LIGHT[0] + sy * LIGHT[1] + z * LIGHT[2]);
  const hv = [LIGHT[0], LIGHT[1], LIGHT[2] + 1], hn = Math.hypot(...hv);
  const sp = Math.pow(Math.max(0, (sx * hv[0] + sy * hv[1] + z * hv[2]) / hn), 40);
  return { d: 0.32 + 0.78 * d, s: sp };
}
const STOPS = 7;
function segPaint(g, a, b, col, w, alpha) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy); if (L < 0.01) return;
  const ux = dx / L, uy = dy / L, nx = -uy, ny = ux, hw = w / 2;
  const gr = g.createLinearGradient(a[0] - nx * hw, a[1] - ny * hw, a[0] + nx * hw, a[1] + ny * hw);
  for (let i = 0; i <= STOPS; i++) {
    const t = -1 + 2 * i / STOPS, s = shadeAt(nx, ny, t), e = Math.min(1, Math.abs(t)) > 0.92 ? 0.75 : 1;
    const c = col.map(v => Math.min(255, Math.round(v * s.d * e + 255 * s.s * 0.55)));
    gr.addColorStop(i / STOPS, `rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
  }
  g.fillStyle = gr;
  const ex = 1.2;   // つなぎ目のすきまをかくす
  g.beginPath();
