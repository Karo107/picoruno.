<style>
/* 画面：引っ越し部屋に立てたテープのロールを1枚の canvas に。タイトル・結果は重ねるカード。 */
:root{
  --room:#3a2a1d; --kraft:#c9a46b; --kraft-d:#9c7a45; --card:#f6eedf; --ink:#3b2c20; --sub:#86715c; --line:#e3d4bc;

  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
html,body{margin:0;height:100%;background:var(--room);overflow:hidden}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);font-weight:500;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}

.sheet{position:fixed;left:50%;transform:translateX(-50%);z-index:20;width:min(430px,calc(100% - 24px));box-sizing:border-box;background:var(--card);border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 24px);overflow-y:auto}
.sheet::before{content:"";position:absolute;left:50%;top:-10px;width:120px;height:26px;transform:translateX(-50%) rotate(-2deg);background:rgba(226,170,79,.78);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:14px;cursor:pointer;
  font-family:var(--pop);font-size:1.12rem;background:var(--black);color:#fff;box-shadow:0 4px 0 #000;transition:transform .08s,box-shadow .08s}

<body>
<canvas id="cv" aria-label="ゲーム画面"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>テープのはし</h1>
  <p>引っ越しの段ボールが5箱。でもガムテープの「はし」が、どこにあるのかわからない。ロールを回して、爪でこすって、見つけたら一気にひっぱろう。</p>
  <div class="how">
    <b>回す</b><span>上下にスワイプ（PCはホイールも）</span>
    <b>探す</b><span>テープの上を横にこする。「カリッ」としたら近い</span>
    <b>はがす</b><span>めくれたら下へひっぱる。速すぎるとちぎれる</span>
  </div>
  <button class="btn" id="start" type="button">箱づめをはじめる</button>
  <div class="best" id="best"></div>
</section>

<section class="sheet" id="result" hidden>
  <div class="rank"><small>5箱とじるまで</small><div class="time" id="rTime">0<small>秒</small></div></div>
  <div class="rank"><small>あなたは</small><b id="rRank"></b></div>
  <div class="laps" id="rLaps"></div>
  <div class="note" id="rNote"></div>
  <div class="row"><button class="btn" id="xBtn" type="button">𝕏 にポスト</button><button class="btn sub" id="imgBtn" type="button">画像で保存</button></div>
  <button class="btn tape" id="again" type="button">もう一度</button>
</section>
<div class="toast" id="toast" hidden></div>

<script>
/* ==== KIT：BGM・効果音・保存・シェアの共通部品（各ゲームに埋め込んで使う） ==== */
const KIT = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- 音 ---------- */
  let ctx = null, master, musicBus, sfxBus, verb, muted = store.get("picoruno-mute", false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      // 残響（生成したインパルス応答）
      verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = ir;
      const vg = ctx.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const now = () => (ctx ? ctx.currentTime : 0);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* 1音。f: 周波数, to: 終わりの周波数, t: 開始までの秒, dur: 長さ */
  function tone(o) {
    if (!ensure()) return;
    const { f = 440, to = null, t = 0, dur = 0.2, type = "sine", vol = 0.3, a = 0.005, rel = null, bus = sfxBus, wet = 0.15, lp = null, detune = 0, pan = 0 } = o;
    const s = now() + t, g = ctx.createGain(), osc = ctx.createOscillator();
    osc.type = type; osc.frequency.setValueAtTime(f, s); osc.detune.value = detune;
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.linearRampToValueAtTime(vol, s + a);
    g.gain.exponentialRampToValueAtTime(0.0001, s + (rel || dur));
    let node = osc;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; node.connect(fl); node = fl; }
    node.connect(g);
    let out = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(verb); }
    osc.start(s); osc.stop(s + (rel || dur) + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ensure()) return;
    const { t = 0, dur = 0.2, vol = 0.3, f = 1200, to = null, q = 0.8, type = "bandpass", a = 0.004, bus = sfxBus, wet = 0.1 } = o;
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = now() + t, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, s); fl.Q.value = q;
    if (to) fl.frequency.exponentialRampToValueAtTime(to, s + dur);
    g.gain.setValueAtTime(0.0001, s); g.gain.linearRampToValueAtTime(vol, s + a); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    src.connect(fl); fl.connect(g); g.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
    src.start(s, Math.random()); src.stop(s + dur + 0.05);
  }

  /* 楽器 */
  const inst = {
    epiano(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 1.6, vol: v, type: "sine", bus: musicBus, wet: 0.25, a: 0.004 }); tone({ f: f * 2, t, dur: 0.5, vol: v * 0.35, type: "sine", bus: musicBus, wet: 0.2 }); tone({ f: f * 3.01, t, dur: 0.18, vol: v * 0.12, type: "sine", bus: musicBus, wet: 0.1 }); },
    bell(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 2.2, vol: v, bus: musicBus, wet: 0.35 }); tone({ f: f * 3.98, t, dur: 0.35, vol: v * 0.25, bus: musicBus, wet: 0.35 }); },
    marimba(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: 0.45, vol: v, bus: musicBus, wet: 0.2 }); tone({ f: f * 4, t, dur: 0.07, vol: v * 0.3, bus: musicBus, wet: 0.1 }); },
    pluck(m, t, d, v) { tone({ f: mtof(m), t, dur: Math.min(0.6, d * 1.2), vol: v, type: "triangle", lp: 2400, bus: musicBus, wet: 0.25 }); },
    flute(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.95, vol: v * 0.8, type: "sine", a: 0.06, bus: musicBus, wet: 0.4 }); tone({ f: mtof(m) * 2, t, dur: d * 0.9, vol: v * 0.08, type: "triangle", a: 0.08, bus: musicBus, wet: 0.4 }); },
    chip(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.45, type: "square", lp: 3000, bus: musicBus, wet: 0.08 }); },
    pad(m, t, d, v) { const f = mtof(m); for (const dt of [-7, 7]) tone({ f, t, dur: d, vol: v * 0.5, type: "sawtooth", a: d * 0.35, lp: 900, detune: dt, bus: musicBus, wet: 0.5 }); },
    koto(m, t, d, v) { const f = mtof(m); tone({ f, to: f * 0.995, t, dur: 0.9, vol: v, type: "triangle", lp: 3200, a: 0.002, bus: musicBus, wet: 0.35 }); tone({ f: f * 2, t, dur: 0.25, vol: v * 0.3, type: "sine", bus: musicBus, wet: 0.2 }); },
    bass(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v, type: "triangle", lp: 600, bus: musicBus, wet: 0 }); tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.6, type: "sine", bus: musicBus, wet: 0 }); },
    kick(t, v) { tone({ f: 130, to: 42, t, dur: 0.28, vol: v, type: "sine", bus: musicBus, wet: 0 }); },
    snare(t, v) { noise({ t, dur: 0.16, vol: v * 0.6, f: 1900, q: 0.7, bus: musicBus, wet: 0.2 }); },
    hat(t, v) { noise({ t, dur: 0.04, vol: v * 0.35, f: 8000, type: "highpass", bus: musicBus, wet: 0 }); },
    shaker(t, v) { noise({ t, dur: 0.07, vol: v * 0.25, f: 6000, q: 2, bus: musicBus, wet: 0.05 }); }
  };

  /* ---------- BGM（シード付きの自動作曲。4小節のフレーズをくりかえす） ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  let song = null, timer = null, nextT = 0, step = 0;
  /* opts: {bpm, key(midi), chords:[[度数...]...], lead, chord, beat:"lofi"|"waltz"|"none"|"chip"|"shaker", seed, scale:[...], swing, leadVol, density} */
  function musicStart(opts) {
    if (!ensure()) return;
    musicStop();
    const r = rng(opts.seed || 7);
    const scale = opts.scale || [0, 2, 4, 7, 9];      // ペンタトニック
    const beats = opts.beat === "waltz" ? 3 : 4;
    const steps = beats * 4;                           // 16分音符
    // 4小節ぶんのメロディを作る（2小節目と4小節目は少し変える）
    const motif = [];
    for (let bar = 0; bar < 4; bar++) {
      const line = [];
      let deg = Math.floor(r() * scale.length);
      for (let s = 0; s < steps; s++) {
        const strong = s % 4 === 0;
        if (r() < (strong ? 0.62 : 0.2) * (opts.density || 1)) {
          deg = Math.max(0, Math.min(scale.length * 2 - 1, deg + Math.floor(r() * 5) - 2));
          const len = strong && r() < 0.5 ? 4 : 2;
          line.push({ s, deg, len });
        }
      }
      motif.push(line);
    }
    motif[2] = motif[0].map(n => ({ ...n }));          // 3小節目は1小節目のくりかえし
    song = { ...opts, beats, steps, motif, scale };
    nextT = now() + 0.1; step = 0;
    timer = setInterval(schedule, 40);
  }
  function schedule() {
    if (!song || !ctx) return;
    const spb = 60 / song.bpm, sixteenth = spb / 4;
    while (nextT < now() + 0.25) {
      const bar = Math.floor(step / song.steps), s = step % song.steps;
      const chordDegs = song.chords[bar % song.chords.length];
      const key = song.key || 60;
      const sw = (s % 2 === 1) ? (song.swing || 0) * sixteenth : 0;
      const t = nextT + sw - now();
      // コード
      if (s === 0) chordDegs.forEach((d, i) => (inst[song.chord || "epiano"])(key + d, t + i * 0.012, spb * song.beats * 0.9, (song.chordVol || 0.08)));
      if (song.beat === "waltz" && (s === 4 || s === 8)) chordDegs.slice(1).forEach(d => inst[song.chord || "epiano"](key + d, t, spb * 0.8, (song.chordVol || 0.08) * 0.6));
      // ベース
      if (song.bassOn !== false) {
        if (s === 0) inst.bass(key - 24 + chordDegs[0], t, spb * 1.8, 0.22);
        if (song.beat !== "waltz" && s === 8) inst.bass(key - 24 + chordDegs[0] + (bar % 2 ? 7 : 0), t, spb * 1.6, 0.18);
      }
      // リズム
      const bt = song.beat || "lofi";
      if (bt === "lofi") { if (s === 0 || s === 10) inst.kick(t, 0.38); if (s === 4 || s === 12) inst.snare(t, 0.25); if (s % 2 === 0) inst.hat(t, s % 4 === 2 ? 0.5 : 0.3); }
      else if (bt === "chip") { if (s % 4 === 0) inst.kick(t, 0.3); if (s === 4 || s === 12) inst.snare(t, 0.2); if (s % 2 === 1) inst.hat(t, 0.3); }
      else if (bt === "waltz") { if (s === 0) inst.kick(t, 0.25); if (s === 4 || s === 8) inst.shaker(t, 0.6); }
      else if (bt === "shaker") { if (s % 2 === 0) inst.shaker(t, s % 4 === 0 ? 0.7 : 0.4); if (s === 0) inst.kick(t, 0.2); }
      // メロディ
      if (song.lead) {
        const line = song.motif[bar % 4];
        for (const n of line) if (n.s === s) {
          const oct = Math.floor(n.deg / song.scale.length), d = song.scale[n.deg % song.scale.length];
          inst[song.lead](key + 12 + oct * 12 + d, t, sixteenth * n.len, song.leadVol || 0.1);
        }
      }
      nextT += sixteenth; step++;
    }
  }
  function musicStop() { if (timer) clearInterval(timer); timer = null; song = null; }
  function setMuted(m) {
    muted = m; store.set("picoruno-mute", m);
    if (master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
  }

  /* ---------- そのほか ---------- */
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function tweet(text, url) {
    const u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + (url ? "&url=" + encodeURIComponent(url) : "");
    window.open(u, "_blank", "noopener");
  }
  async function shareImage(canvas, name, text) {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], name, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return "shared"; }
    } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return "downloaded";
  }
  function loadImages(map) {
    const out = {};
    return Promise.all(Object.entries(map).map(([k, src]) => new Promise(res => {
      const im = new Image(); im.onload = () => { out[k] = im; res(); }; im.onerror = () => { out[k] = null; res(); }; im.src = src;
    }))).then(() => out);
  }

  /* 遊んだ回数を数える（トップページの ▶ 回数）。同じタブでの再読みこみは1回だけ。 */
  function countPlay(G) {
    const K = "picoruno-played:" + G;
    try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, "1"); } catch (e) {}
    const KEY = "sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
    fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play", { method: "POST", keepalive: true,
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ g: G }) })
      .then(r => { if (!r.ok) throw 0; })
      .catch(() => { try { const d = JSON.parse(localStorage.getItem("picoruno-stats") || "{}"); d[G] = d[G] || { plays: 0, likes: 0 }; d[G].plays++; localStorage.setItem("picoruno-stats", JSON.stringify(d)); } catch (e) {} });
  }

  /* セーフエリア（ノッチなど）の大きさ(px) */
  let safeEl = null;
  function safe() {
    if (!safeEl) {
      safeEl = document.createElement("div");
      safeEl.style.cssText = "position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
      document.body.appendChild(safeEl);
    }
    const cs = getComputedStyle(safeEl);

function roundRect(x, y, w, h, r) { roundRectG(cx, x, y, w, h, r); }
function roundRectG(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.min(r, Math.abs(h) / 2)); else g.rect(x, y, w, h); }
function say(text, dur = 1.8) { S.msg = { text, at: S.t, dur }; }

/* ---------- 更新 ---------- */
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); render();
  requestAnimationFrame(frame);
}
let tickAcc = 0;
function update(dt) {
  S.t += dt; S.shake = Math.max(0, S.shake - dt * 40);
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 400 * dt; q.life -= dt * q.dec; }
  S.parts = S.parts.filter(q => q.life > 0);
  S.boxIn = Math.min(1, (S.boxIn || 0) + dt * 2.2);
  if (S.boxAnim > 0) S.boxAnim += dt * 3;
  if (S.state === "title") { S.theta += dt * 12; return; }
  if (S.state === "hunt" || S.state === "pull") S.roundT += dt;
  if (S.state === "hunt") {
    if (!drag || drag.mode !== "rot") { S.theta += S.omega * dt; S.omega *= Math.pow(0.12, dt); if (Math.abs(S.omega) < 2) S.omega = 0; }
    tickAcc += Math.abs(S.omega * dt);
    if (tickAcc > 14) { tickAcc = 0; KIT.noise({ dur: 0.02, vol: 0.05, f: 900, q: 4, wet: 0 }); }
    S.flap = Math.max(0, S.flap - dt);
  }
  if (S.state === "done") {
    S.doneT += dt;
    if (S.doneT > 1.1 && !S.nextQueued) { S.nextQueued = true; if (S.round + 1 < BOXES) startRound(S.round + 1); else finish(); }
  }
}

/* ---------- 操作 ---------- */
let drag = null;
cv.addEventListener("pointerdown", e => {
  if (S.state !== "hunt" && S.state !== "pull") return;
  e.preventDefault(); KIT.ensure();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = toWorld(e);
  drag = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, t: performance.now(), mode: S.state === "pull" ? "pull" : null, rub: 0, vy: 0 };
  if (S.state === "hunt") S.omega = 0;
});
cv.addEventListener("pointermove", e => {
  if (!drag || drag.id !== e.pointerId) return;
  const p = toWorld(e), now = performance.now(), dtm = Math.max(1, now - drag.t) / 1000;
  const dx = p.x - drag.x, dy = p.y - drag.y;
  if (!drag.mode) {
    const tx = p.x - drag.x0, ty = p.y - drag.y0;
    if (Math.hypot(tx, ty) > 8) drag.mode = Math.abs(ty) > Math.abs(tx) * 1.1 ? "rot" : "rub";
  }
  if (S.state === "hunt" && drag.mode === "rot") {
    const dth = -dy / RPX * 180 / Math.PI;     // 指といっしょに表面が動く
    S.theta += dth; S.omega = lerp(S.omega, dth / dtm, 0.5);
  } else if (S.state === "hunt" && drag.mode === "rub") {
    rub(p, Math.hypot(dx, dy));
  } else if (S.state === "pull") {
    const sp = dy / Math.max(dtm, 0.008);
    drag.vy = lerp(drag.vy, sp, 0.6);
    if (dy > 0) {
      S.pull += dy; S.pullX = clamp(S.pullX + dx * 0.4, -40, 40);
      peelSfx(sp);
      if (drag.vy > 2400 && S.pull > 40) tear();
      else if (S.pull >= 300 && !S.ready) { S.ready = true; KIT.tone({ f: 1046, dur: 0.12, vol: 0.12, type: "triangle" }); say("はなすと貼れる！", 1.2); }
    }
  }
  drag.x = p.x; drag.y = p.y; drag.t = now;
});
const endDrag = e => {
  if (!drag || (e && drag.id !== e.pointerId)) return;
  if (S.state === "pull") {
    if (S.ready) complete();
    else if (S.pull > 0) { say("もっとひっぱって！", 1.2); }
  }
  drag = null;
};
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("wheel", e => { if (S.state === "hunt") { e.preventDefault(); S.omega += -e.deltaY * 0.9; } }, { passive: false });

let rubAcc = 0, lastNear = 0;
function rub(p, dist) {
  if (p.x < BAND.x0 - 30 || p.x > BAND.x1 + 30) return;
  const phi = phiAtY(p.y); if (phi === null) return;
  const edgePhi = wrap(S.edge + S.theta);
  const diff = Math.abs(wrap(phi - edgePhi));
  drag.rub += dist; rubAcc += dist;
  if (diff < 2.6 && drag.rub > 36) return catchEdge();
  if (rubAcc > 26) {
    rubAcc = 0;
    if (diff < 9) { // 爪が段差に引っかかる
      KIT.noise({ dur: 0.03, vol: 0.22, f: 3400, q: 3, wet: 0 }); KIT.tone({ f: 2200, dur: 0.02, vol: 0.06, type: "square", wet: 0 }); KIT.vibrate(12);
      if (S.t - lastNear > 1.5) { lastNear = S.t; say("カリッ…近い？", 1.0); }
    } else KIT.noise({ dur: 0.06, vol: 0.06, f: 5000, q: 0.8, wet: 0 });
  }
  if (Math.random() < 0.3) S.parts.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 40, vy: -20, r: 1.2, life: 0.5, dec: 2, c: "rgba(255,248,230,.9)", al: 0.6 });
}
function catchEdge() {
  S.state = "pull"; S.pull = 0; S.pullX = 0; S.ready = false; S.torn = false; drag.mode = "pull";
  S.flap = 1;
  // ペリッ
  KIT.noise({ dur: 0.18, vol: 0.3, f: 4000, to: 1200, q: 1.5 });
  KIT.tone({ f: 660, to: 1320, dur: 0.12, vol: 0.12, type: "triangle" });
  KIT.vibrate(25);
  say("見つけた！ 下へひっぱる", 1.4);
  // はしが手前の下に来るまで回す（見た目のつじつま）
  S.theta = -90 - S.edge;
}
let peelAt = 0;
function peelSfx(sp) {
  const now = KIT.ensure() ? performance.now() : 0;
  if (now - peelAt < 45) return; peelAt = now;
  const f = clamp(400 + sp * 0.6, 500, 3200);
  KIT.noise({ dur: 0.07, vol: 0.18, f, q: 6, wet: 0 });
  KIT.tone({ f: f * 0.5, dur: 0.05, vol: 0.03, type: "sawtooth", lp: 2000, wet: 0 });
}
function tear() {
  S.tears++; S.totalTears++;
  KIT.noise({ dur: 0.22, vol: 0.4, f: 2200, to: 600, q: 0.9 }); KIT.tone({ f: 300, to: 120, dur: 0.2, vol: 0.12, type: "sawtooth", lp: 900 });
  KIT.vibrate([20, 30, 40]); S.shake = 8;
  say("ビリッ… ちぎれた！ また探そう", 1.8);
  const p = proj(-88);
  for (let i = 0; i < 14; i++) S.parts.push({ x: lerp(p[0][0], p[2][0], Math.random()), y: p[0][1] + S.pull * Math.random(), vx: (Math.random() - 0.5) * 200, vy: -100 - Math.random() * 120, r: 2 + Math.random() * 2, life: 1, dec: 1.2, c: "rgba(235,180,95,.9)", al: 0.9 });
  // ちぎれたはしは、さっきより少し見えにくい
  S.state = "hunt"; S.edge = Math.random() * 360; S.flap = 0; drag && (drag.mode = null);
}
function complete() {
  S.state = "done"; S.doneT = 0; S.nextQueued = false;
  const lap = S.roundT; S.laps.push(lap); S.total += lap;
  // ジャッ（カッターの刃で切る）→ 箱にぺたっ
  KIT.noise({ dur: 0.12, vol: 0.35, f: 6000, to: 2500, q: 1 });
  setTimeout(() => {
    S.boxTaped = true; S.boxAnim = 0.01; S.shake = 6;
    KIT.noise({ dur: 0.1, vol: 0.25, f: 500, type: "lowpass", q: 0.5 });
    KIT.tone({ f: 140, to: 60, dur: 0.18, vol: 0.4 });
    [0, 4, 7, 12].forEach((d, i) => KIT.inst.marimba(72 + d + (lap < 4 ? 2 : 0), 0.05 + i * 0.06, 0.2, 0.15));
    const comments = lap < 3 ? "はやい！" : lap < 6 ? "いいね！" : lap < 12 ? "とじた！" : "やっと…！";
    say(`${S.round + 1}箱目 ${lap.toFixed(1)}秒　${comments}`, 1.2);
    for (let i = 0; i < 18; i++) S.parts.push({ x: 520 + (Math.random() - 0.5) * 140, y: 820, vx: (Math.random() - 0.5) * 300, vy: -200 - Math.random() * 200, r: 2 + Math.random() * 3, life: 1, dec: 1, c: ["#e2aa4f", "#fff3d6", "#c9a46b"][i % 3], al: 0.9 });
  }, 160);
}

/* ---------- 進行 ---------- */
function startRound(i) {
  S.round = i; S.state = "hunt"; S.roundT = 0; S.tears = 0; S.flap = 0; S.pull = 0; S.boxTaped = false; S.boxAnim = 0; S.boxIn = 0;
  // はしは、最初は見えない側にあることが多い
  S.edge = Math.random() * 360; S.theta = 0; S.omega = 0;
  makeSpecks();
  KIT.noise({ dur: 0.25, vol: 0.12, f: 300, type: "lowpass" }); // 箱をずらす音
  if (i === 0) say("上下で回す・横にこすって探す", 2.6);
  else if (i === BOXES - 1) say("ラスト1箱！", 1.4);
}
function startGame() {
  KIT.ensure();
  $("title").hidden = true; $("result").hidden = true;
  S.laps = []; S.total = 0; S.totalTears = 0; S.parts = [];
  startMusic(false);
  KIT.countPlay(GAME_TITLE);
  startRound(0);
}
const RANKS = [[12, "テープの達人"], [20, "引っ越しのプロ"], [32, "手ぎわのいい人"], [50, "ふつうの人"], [80, "爪がみじかい人"], [1e9, "テープにきらわれている人"]];
function finish() {
  S.state = "result";
  const rank = RANKS.find(r => S.total < r[0])[1];
  S.rank = rank;
  $("rTime").innerHTML = `${S.total.toFixed(1)}<small>秒</small>`;
  $("rRank").textContent = rank;
  $("rLaps").innerHTML = S.laps.map((l, i) => `<div class="lap"><small>${i + 1}箱目</small><b>${l.toFixed(1)}</b></div>`).join("");
  const best = KIT.store.get("tape-best", 0);
  const isBest = !best || S.total < best;
  if (isBest) KIT.store.set("tape-best", +S.total.toFixed(1));
  $("rNote").textContent = (isBest ? "自己ベスト更新！ " : `自己ベスト ${best}秒　`) + (S.totalTears ? `ちぎれた回数 ${S.totalTears}回` : "1回もちぎらなかった！");
  $("result").hidden = false;
  KIT.music.stop(); setTimeout(() => startMusic(true), 500);
  [0, 4, 7, 11, 14].forEach((d, i) => KIT.inst.bell(67 + d, 0.05 + i * 0.09, 0.4, 0.1));
}
function shareText() { return `テープのはし、5箱とじるのに ${S.total.toFixed(1)}秒\nわたしは「${S.rank}」でした\n#テープのはし`; }
function shareCanvas() {
  const c = document.createElement("canvas"); c.width = 1200; c.height = 630;
  const g = c.getContext("2d");
  if (IMG.scene) g.drawImage(IMG.scene, 240, 330, 840, 882, 0, 0, 600, 630);
  g.fillStyle = "#f6eedf"; g.fillRect(600, 0, 600, 630);
  g.fillStyle = "rgba(226,170,79,.85)"; g.save(); g.translate(600, 0); g.rotate(-0.04); g.fillRect(-20, 40, 640, 46); g.restore();
  g.fillStyle = "#3b2c20"; g.font = '400 30px "Dela Gothic One",sans-serif'; g.textAlign = "left"; g.fillText("テープのはし", 640, 76);
  g.fillStyle = "#86715c"; g.font = '700 26px "Zen Maru Gothic",sans-serif'; g.fillText("5箱とじるまで", 640, 170);
  g.fillStyle = "#3b2c20"; g.font = '400 96px "Dela Gothic One",sans-serif'; g.fillText(S.total.toFixed(1), 640, 280);
  const tw = g.measureText(S.total.toFixed(1)).width; g.font = '700 34px "Zen Maru Gothic",sans-serif'; g.fillText("秒", 650 + tw, 280);
  g.fillStyle = "#86715c"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText("わたしは", 640, 350);
  g.fillStyle = "#3b2c20"; g.font = '400 44px "Dela Gothic One",sans-serif'; g.fillText(S.rank, 640, 406);
  if (IMG.box1) S.laps.forEach((l, i) => { g.drawImage(IMG.box1, 630 + i * 108, 440, 110, 110); g.fillStyle = "#3b2c20"; g.font = '700 20px "Zen Maru Gothic",sans-serif'; g.textAlign = "center"; g.fillText(l.toFixed(1) + "秒", 685 + i * 108, 560); g.textAlign = "left"; });
  g.fillStyle = "#86715c"; g.font = '700 20px "Zen Maru Gothic",sans-serif'; g.fillText("#テープのはし ・ picoruno.", 640, 604);
  return c;
}
function startMusic(calm) {
  KIT.music.start(calm
    ? { bpm: 84, key: 62, chords: [[0, 4, 7, 11], [5, 9, 12, 16], [9, 12, 16, 19], [7, 11, 14, 17]], lead: "bell", chord: "epiano", beat: "none", seed: 33, leadVol: 0.07, density: 0.6 }
    : { bpm: 116, key: 62, chords: [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]], lead: "pluck", chord: "marimba", beat: "shaker", seed: 12, leadVol: 0.09, chordVol: 0.09, swing: 0.12 });
}

/* ---------- ボタン ---------- */
$("start").addEventListener("click", startGame);
$("again").addEventListener("click", startGame);
$("xBtn").addEventListener("click", () => KIT.tweet(shareText(), GAME_URL));
$("imgBtn").addEventListener("click", async () => { const r = await KIT.shareImage(shareCanvas(), "tape.png", shareText()); if (r === "downloaded") toast("画像を保存しました"); });
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => t.hidden = true, 1800); }
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function muteIcon() { $("mute").innerHTML = KIT.muted ? ICON_OFF : ICON_ON; $("mute").setAttribute("aria-pressed", KIT.muted); }
$("mute").addEventListener("click", () => { KIT.setMuted(!KIT.muted); muteIcon(); if (!KIT.muted) KIT.ensure(); });

(async function boot() {
  resize(); muteIcon(); makeSpecks();
  const best = KIT.store.get("tape-best", 0);
  $("best").textContent = best ? `自己ベスト ${best}秒` : "5箱とじるまでのタイムアタック";
  IMG = await KIT.loadImages(SRC);
  requestAnimationFrame(frame);
})();
window.__S = S; window.__T = { proj, wrap, toScreen: (x, y) => ({ x: (x + offX) * fit, y: (y + offY) * fit }) };
</script>
