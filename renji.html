<style>

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;

<body>
<canvas id="cv" aria-label="ゲーム画面"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>レンジ何秒？</h1>
  <p>冷やごはん、牛乳、肉まん…。電子レンジで「ちょうどいい」秒数を当てよう。</p>
  <div class="how">
    <b>ボタン</b><span>1分・10秒で時間をきめて、スタート</span>
    <b>採点</b><span>ちょうどいい温かさに近いほど高得点。5品で500点</span>
    <b>注意</b><span>温めすぎると、ふきこぼれたり、はじけたり…</span>
  </div>
  <button class="btn" id="start" type="button">台所に立つ</button>
  <div class="best" id="best"></div>
</section>

<section class="sheet" id="result" hidden>
  <div class="cap">5品の合計</div>
  <div class="big" id="rBig">0<small>点</small></div>
  <div class="rank" id="rRank"></div>
  <div class="list" id="rList"></div>
  <div class="note" id="rNote"></div>
  <div class="row"><button class="btn x" id="xBtn" type="button">𝕏 にポスト</button><button class="btn sub" id="imgBtn" type="button">画像で保存</button></div>
  <button class="btn" id="again" type="button">もう一回あたためる</button>
</section>
<div class="toast" id="toast" hidden></div>

<script>
/* ==== KIT：BGM・効果音・保存・シェアの共通部品（各ゲームに埋め込んで使う） ==== */
const KIT = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- 音 ---------- */
  let ctx = null, master, musicBus, sfxBus, verb, muted = store.get("picoruno-mute", false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      // 残響（生成したインパルス応答）
      verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = ir;
      const vg = ctx.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const now = () => (ctx ? ctx.currentTime : 0);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* 1音。f: 周波数, to: 終わりの周波数, t: 開始までの秒, dur: 長さ */
  function tone(o) {
    if (!ensure()) return;
    const { f = 440, to = null, t = 0, dur = 0.2, type = "sine", vol = 0.3, a = 0.005, rel = null, bus = sfxBus, wet = 0.15, lp = null, detune = 0, pan = 0 } = o;
    const s = now() + t, g = ctx.createGain(), osc = ctx.createOscillator();
    osc.type = type; osc.frequency.setValueAtTime(f, s); osc.detune.value = detune;
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.linearRampToValueAtTime(vol, s + a);
    g.gain.exponentialRampToValueAtTime(0.0001, s + (rel || dur));
    let node = osc;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; node.connect(fl); node = fl; }
    node.connect(g);
    let out = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(verb); }
    osc.start(s); osc.stop(s + (rel || dur) + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ensure()) return;
    const { t = 0, dur = 0.2, vol = 0.3, f = 1200, to = null, q = 0.8, type = "bandpass", a = 0.004, bus = sfxBus, wet = 0.1 } = o;
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = now() + t, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, s); fl.Q.value = q;
    if (to) fl.frequency.exponentialRampToValueAtTime(to, s + dur);
    g.gain.setValueAtTime(0.0001, s); g.gain.linearRampToValueAtTime(vol, s + a); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    src.connect(fl); fl.connect(g); g.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
    src.start(s, Math.random()); src.stop(s + dur + 0.05);
  }

  /* 楽器 */
  const inst = {
    epiano(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 1.6, vol: v, type: "sine", bus: musicBus, wet: 0.25, a: 0.004 }); tone({ f: f * 2, t, dur: 0.5, vol: v * 0.35, type: "sine", bus: musicBus, wet: 0.2 }); tone({ f: f * 3.01, t, dur: 0.18, vol: v * 0.12, type: "sine", bus: musicBus, wet: 0.1 }); },
    bell(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 2.2, vol: v, bus: musicBus, wet: 0.35 }); tone({ f: f * 3.98, t, dur: 0.35, vol: v * 0.25, bus: musicBus, wet: 0.35 }); },
    marimba(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: 0.45, vol: v, bus: musicBus, wet: 0.2 }); tone({ f: f * 4, t, dur: 0.07, vol: v * 0.3, bus: musicBus, wet: 0.1 }); },
    pluck(m, t, d, v) { tone({ f: mtof(m), t, dur: Math.min(0.6, d * 1.2), vol: v, type: "triangle", lp: 2400, bus: musicBus, wet: 0.25 }); },
    flute(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.95, vol: v * 0.8, type: "sine", a: 0.06, bus: musicBus, wet: 0.4 }); tone({ f: mtof(m) * 2, t, dur: d * 0.9, vol: v * 0.08, type: "triangle", a: 0.08, bus: musicBus, wet: 0.4 }); },
    chip(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.45, type: "square", lp: 3000, bus: musicBus, wet: 0.08 }); },
    pad(m, t, d, v) { const f = mtof(m); for (const dt of [-7, 7]) tone({ f, t, dur: d, vol: v * 0.5, type: "sawtooth", a: d * 0.35, lp: 900, detune: dt, bus: musicBus, wet: 0.5 }); },
    koto(m, t, d, v) { const f = mtof(m); tone({ f, to: f * 0.995, t, dur: 0.9, vol: v, type: "triangle", lp: 3200, a: 0.002, bus: musicBus, wet: 0.35 }); tone({ f: f * 2, t, dur: 0.25, vol: v * 0.3, type: "sine", bus: musicBus, wet: 0.2 }); },
    bass(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v, type: "triangle", lp: 600, bus: musicBus, wet: 0 }); tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.6, type: "sine", bus: musicBus, wet: 0 }); },
    kick(t, v) { tone({ f: 130, to: 42, t, dur: 0.28, vol: v, type: "sine", bus: musicBus, wet: 0 }); },
    snare(t, v) { noise({ t, dur: 0.16, vol: v * 0.6, f: 1900, q: 0.7, bus: musicBus, wet: 0.2 }); },
    hat(t, v) { noise({ t, dur: 0.04, vol: v * 0.35, f: 8000, type: "highpass", bus: musicBus, wet: 0 }); },
    shaker(t, v) { noise({ t, dur: 0.07, vol: v * 0.25, f: 6000, q: 2, bus: musicBus, wet: 0.05 }); }
  };

  /* ---------- BGM（シード付きの自動作曲。4小節のフレーズをくりかえす） ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  let song = null, timer = null, nextT = 0, step = 0;
  /* opts: {bpm, key(midi), chords:[[度数...]...], lead, chord, beat:"lofi"|"waltz"|"none"|"chip"|"shaker", seed, scale:[...], swing, leadVol, density} */
  function musicStart(opts) {
    if (!ensure()) return;
    musicStop();
    const r = rng(opts.seed || 7);
    const scale = opts.scale || [0, 2, 4, 7, 9];      // ペンタトニック
    const beats = opts.beat === "waltz" ? 3 : 4;
    const steps = beats * 4;                           // 16分音符
    // 4小節ぶんのメロディを作る（2小節目と4小節目は少し変える）
    const motif = [];
    for (let bar = 0; bar < 4; bar++) {
      const line = [];
      let deg = Math.floor(r() * scale.length);
      for (let s = 0; s < steps; s++) {
        const strong = s % 4 === 0;
        if (r() < (strong ? 0.62 : 0.2) * (opts.density || 1)) {
          deg = Math.max(0, Math.min(scale.length * 2 - 1, deg + Math.floor(r() * 5) - 2));
          const len = strong && r() < 0.5 ? 4 : 2;
          line.push({ s, deg, len });
        }
      }
      motif.push(line);
    }
    motif[2] = motif[0].map(n => ({ ...n }));          // 3小節目は1小節目のくりかえし
    song = { ...opts, beats, steps, motif, scale };
    nextT = now() + 0.1; step = 0;
    timer = setInterval(schedule, 40);
  }
  function schedule() {
    if (!song || !ctx) return;
    const spb = 60 / song.bpm, sixteenth = spb / 4;
    while (nextT < now() + 0.25) {
      const bar = Math.floor(step / song.steps), s = step % song.steps;
      const chordDegs = song.chords[bar % song.chords.length];
      const key = song.key || 60;
      const sw = (s % 2 === 1) ? (song.swing || 0) * sixteenth : 0;
      const t = nextT + sw - now();
      // コード
      if (s === 0) chordDegs.forEach((d, i) => (inst[song.chord || "epiano"])(key + d, t + i * 0.012, spb * song.beats * 0.9, (song.chordVol || 0.08)));
      if (song.beat === "waltz" && (s === 4 || s === 8)) chordDegs.slice(1).forEach(d => inst[song.chord || "epiano"](key + d, t, spb * 0.8, (song.chordVol || 0.08) * 0.6));
      // ベース
      if (song.bassOn !== false) {
        if (s === 0) inst.bass(key - 24 + chordDegs[0], t, spb * 1.8, 0.22);
        if (song.beat !== "waltz" && s === 8) inst.bass(key - 24 + chordDegs[0] + (bar % 2 ? 7 : 0), t, spb * 1.6, 0.18);
      }
      // リズム
      const bt = song.beat || "lofi";
      if (bt === "lofi") { if (s === 0 || s === 10) inst.kick(t, 0.38); if (s === 4 || s === 12) inst.snare(t, 0.25); if (s % 2 === 0) inst.hat(t, s % 4 === 2 ? 0.5 : 0.3); }
      else if (bt === "chip") { if (s % 4 === 0) inst.kick(t, 0.3); if (s === 4 || s === 12) inst.snare(t, 0.2); if (s % 2 === 1) inst.hat(t, 0.3); }
      else if (bt === "waltz") { if (s === 0) inst.kick(t, 0.25); if (s === 4 || s === 8) inst.shaker(t, 0.6); }
      else if (bt === "shaker") { if (s % 2 === 0) inst.shaker(t, s % 4 === 0 ? 0.7 : 0.4); if (s === 0) inst.kick(t, 0.2); }
      // メロディ
      if (song.lead) {
        const line = song.motif[bar % 4];
        for (const n of line) if (n.s === s) {
          const oct = Math.floor(n.deg / song.scale.length), d = song.scale[n.deg % song.scale.length];
          inst[song.lead](key + 12 + oct * 12 + d, t, sixteenth * n.len, song.leadVol || 0.1);
        }
      }
      nextT += sixteenth; step++;
    }
  }
  function musicStop() { if (timer) clearInterval(timer); timer = null; song = null; }
  function setMuted(m) {
    muted = m; store.set("picoruno-mute", m);
    if (master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
  }

  /* ---------- そのほか ---------- */
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function tweet(text, url) {
    const u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + (url ? "&url=" + encodeURIComponent(url) : "");
    window.open(u, "_blank", "noopener");
  }
  async function shareImage(canvas, name, text) {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], name, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return "shared"; }
    } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return "downloaded";
  }
  function loadImages(map) {
    const out = {};
    return Promise.all(Object.entries(map).map(([k, src]) => new Promise(res => {
      const im = new Image(); im.onload = () => { out[k] = im; res(); }; im.onerror = () => { out[k] = null; res(); }; im.src = src;
    }))).then(() => out);
  }

  /* 遊んだ回数を数える（トップページの ▶ 回数）。同じタブでの再読みこみは1回だけ。 */
  function countPlay(G) {
    const K = "picoruno-played:" + G;
    try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, "1"); } catch (e) {}
    const KEY = "sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
    fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play", { method: "POST", keepalive: true,
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ g: G }) })
      .then(r => { if (!r.ok) throw 0; })
      .catch(() => { try { const d = JSON.parse(localStorage.getItem("picoruno-stats") || "{}"); d[G] = d[G] || { plays: 0, likes: 0 }; d[G].plays++; localStorage.setItem("picoruno-stats", JSON.stringify(d)); } catch (e) {} });
  }

  /* セーフエリア（ノッチなど）の大きさ(px) */
  let safeEl = null;
  function safe() {
    if (!safeEl) {
      safeEl = document.createElement("div");
      safeEl.style.cssText = "position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
      document.body.appendChild(safeEl);

/* ---------- canvas ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  fit = Math.min(Math.max(vw / W, vh / H), vh / 900);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
}
window.addEventListener("resize", resize);
function view() { const lw = vw / fit, lh = vh / fit; return { lw, lh, ox: (lw - W) / 2, oy: clamp(lh * 0.5 - 520, lh - H, 0) }; }
function visX() { const v = view(); return [Math.max(0, -v.ox), Math.min(W, W + v.ox)]; }
function visY() { const v = view(); return [Math.max(0, -v.oy), Math.min(H, v.lh - v.oy)]; }
function mk(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const jtime = s => s >= 60 ? `${Math.floor(s / 60)}分${s % 60 ? (s % 60) + "秒" : ""}` : `${s}秒`;

/* ---------- ボタン（カウンターの上） ---------- */
function keys() {
  const [xa, xb] = visX(), [ya, yb] = visY();
  const x0 = Math.max(xa + 14, 34), x1 = Math.min(xb - 14, W - 34), w = x1 - x0;
  const top = Math.min(GEO.mw[0][1] + 40, yb - 280), gap = 12, bw = (w - gap * 2) / 3, bh = 70;
  return [
    { id: "m10", label: "10分", sub: "", x: x0, y: top, w: bw, h: bh, add: 600 },
    { id: "m1", label: "1分", sub: "", x: x0 + bw + gap, y: top, w: bw, h: bh, add: 60 },
    { id: "s10", label: "10秒", sub: "", x: x0 + (bw + gap) * 2, y: top, w: bw, h: bh, add: 10 },
    { id: "clr", label: "とりけし", x: x0, y: top + bh + gap, w: bw, h: bh },
    { id: "go", label: "スタート", x: x0 + bw + gap, y: top + bh + gap, w: bw * 2 + gap, h: bh, main: true },
    { id: "skip", label: "温めないで出す", x: x0 + w / 2 - 110, y: top + (bh + gap) * 2 + 2, w: 220, h: 44, small: true }
  ];
}
function drawKeys(g) {
  const on = S.state === "set";
  for (const k of keys()) {
    const pr = S.press && S.press.id === k.id && S.t - S.press.at < 0.12;
    const dy = pr ? 4 : 0;
    g.save(); g.globalAlpha = on ? 1 : 0.55;
    if (k.small) {
      g.fillStyle = "rgba(255,252,246,.82)"; rr(g, k.x, k.y + dy, k.w, k.h, 22); g.fill();
      g.strokeStyle = "rgba(120,100,80,.35)"; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = "#6c6152"; g.font = '700 17px "Zen Maru Gothic",sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(k.label, k.x + k.w / 2, k.y + k.h / 2 + dy + 1);
      g.restore(); continue;
    }
    g.fillStyle = k.main ? "#2c6449" : "#b9b1a5"; rr(g, k.x, k.y + 6, k.w, k.h, 18); g.fill();
    const gr = g.createLinearGradient(0, k.y + dy, 0, k.y + k.h + dy);
    if (k.main) { gr.addColorStop(0, "#5cae86"); gr.addColorStop(1, "#3f8a66"); } else { gr.addColorStop(0, "#fffdf9"); gr.addColorStop(1, "#eee8de"); }
    g.fillStyle = gr; rr(g, k.x, k.y + dy, k.w, k.h, 18); g.fill();
    g.fillStyle = k.main ? "#fff" : "#3a332c"; g.font = `800 ${k.main ? 28 : 24}px "M PLUS Rounded 1c",sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(k.label, k.x + k.w / 2, k.y + k.h / 2 + dy + 1);
    g.restore();
  }
}

/* ---------- 描画 ---------- */
function foodFrame() { const n = FG.n; return S.over ? n : ((Math.round(S.rot / (TAU / n)) % n) + n) % n; }
function drawFood(g, x, y, k, alpha = 1) {
  // x,y：食べもの枠の左上（画面座標）、k：倍率
  if (!IMG.food || !S.f) return;
  const fr = foodFrame(), row = S.f.row;
  g.save(); g.globalAlpha = alpha;
  g.drawImage(IMG.food, fr * FG.cw, row * FG.ch, FG.cw, FG.ch, x, y, FG.cw / FS * k, FG.ch / FS * k);
  g.restore();
}
function foodPos() { return { x: FG.rect[0] + FG.off[0] / FS, y: FG.rect[1] + FG.off[1] / FS, w: FG.cw / FS, h: FG.ch / FS }; }
function drawLcd(g) {
  const a = GEO.lcd[0], b = GEO.lcd[1];
  const w = b[0] - a[0], h = b[1] - a[1];
  g.save();
  g.fillStyle = "rgba(10,22,18,.9)"; rr(g, a[0] + 1, a[1] + 1, w - 2, h - 2, 3); g.fill();
  let txt = "";
  if (S.state === "set") txt = S.set ? mmss(S.set) : "0:00";
  else if (S.state === "heat") txt = mmss(Math.max(0, S.set - S.run));
  else if (S.state === "done" || S.state === "show") txt = "End";
  else txt = clockText();
  g.fillStyle = "#a6f2c4"; g.shadowColor = "rgba(120,255,180,.8)"; g.shadowBlur = 6;
  g.font = `700 ${Math.round(h * 0.82)}px "Courier New",monospace`; g.textAlign = "right"; g.textBaseline = "middle";
  g.fillText(txt, b[0] - 7, a[1] + h / 2 + 1);
  g.restore();
}
function clockText() { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; }
function drawDoor(g) {
  if (!IMG.door || S.doorK <= 0.01) return;
  const d = GEO.door, hx = GEO.hinge[0];
  g.save();
  g.translate(hx, 0); g.scale(S.doorK, 1); g.translate(-hx, 0);
  g.drawImage(IMG.door, d[0], d[1], d[2] - d[0], d[3] - d[1]);
  if (S.doorK < 0.98) { g.fillStyle = `rgba(40,30,20,${(1 - S.doorK) * 0.35})`; g.fillRect(d[0], d[1], d[2] - d[0], d[3] - d[1]); }
  g.restore();
}
function drawGlow(g) {
  if (S.lamp <= 0) return;
  const q = GEO.cavity, x0 = q[3][0], y0 = q[3][1], x1 = q[1][0], y1 = q[1][1];
  g.save(); g.globalAlpha = S.lamp;
  if (IMG.lit) { const r = GEO.lit; g.drawImage(IMG.lit, r[0], r[1], r[2] - r[0], r[3] - r[1]); }
  g.globalCompositeOperation = "soft-light";
  const gr = g.createRadialGradient(x0 + 40, y0 + 10, 10, x0 + 60, y0 + 40, x1 - x0);
  gr.addColorStop(0, "rgba(255,190,90,1)"); gr.addColorStop(1, "rgba(255,150,60,.5)");
  g.fillStyle = gr; g.fillRect(x0, y0, x1 - x0, y1 - y0);
  g.restore();
}
function drawGlowOver(g) {
  // 扉ごしの、あたたかい光
  if (S.lamp <= 0 || S.doorK < 0.5) return;
  const q = GEO.cavity, x0 = q[3][0], y0 = q[3][1], x1 = q[1][0], y1 = q[1][1];
  g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = S.lamp * 0.32;
  const gr = g.createRadialGradient((x0 + x1) / 2, (y0 + y1) / 2, 10, (x0 + x1) / 2, (y0 + y1) / 2, (x1 - x0) * 0.6);
  gr.addColorStop(0, "rgba(255,170,70,1)"); gr.addColorStop(1, "rgba(255,120,40,0)");
  g.fillStyle = gr; g.fillRect(x0, y0, x1 - x0, y1 - y0);
  g.restore();
}
function drawOrder(g) {

function press(k) {

  else if (k.id === "clr") { S.set = 0; beep(); beep(false, 0.09); }

/* ---------- 音 ---------- */
function beep(bad = false, t = 0) { KIT.tone({ f: bad ? 520 : 2100, dur: bad ? 0.16 : 0.07, vol: 0.08, type: "square", lp: 3500, wet: 0.02, t }); }

let hum = null;
function humStart() {

}
function humStop() { if (!hum) return; const ctx = KIT.ensure(), h = hum; hum = null; h.g.gain.setTargetAtTime(0, ctx.currentTime, 0.06); setTimeout(() => { try { h.o.stop(); h.n.stop(); } catch (e) {} }, 500); }
function sndChin() { for (const [f, v] of [[2093, 0.12], [4186, 0.04], [2637, 0.05]]) KIT.tone({ f, dur: 1.6, vol: v, type: "sine", wet: 0.35, a: 0.002 }); }

  KIT.tone({ f: 160, to: 40, dur: 0.4, vol: 0.45, type: "sine", wet: 0.2 });
  KIT.noise({ dur: 0.5, vol: 0.5, f: 1500, to: 300, q: 0.5, wet: 0.3 });

function sndBubble() { for (let i = 0; i < 6; i++) KIT.tone({ f: 300 + Math.random() * 500, to: 700 + Math.random() * 500, t: i * 0.07 + Math.random() * 0.05, dur: 0.06, vol: 0.05, type: "sine", wet: 0.1 }); }
function sndResult(p) {
  if (p >= 80) [0, 4, 7, 12].forEach((d, i) => KIT.inst.marimba(72 + d, i * 0.08, 0.3, 0.12));
  else if (p >= 40) [0, 4, 7].forEach((d, i) => KIT.inst.marimba(67 + d, i * 0.1, 0.3, 0.1));
  else [7, 3, 0].forEach((d, i) => KIT.inst.marimba(60 + d, i * 0.14, 0.4, 0.1));

/* ---------- 進行 ---------- */
let last = performance.now();
function frame(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(frame); }
function temp(f, s) {
  if (f.trap) return Math.round(f.t0 + s * 1.5);
  const k = s / f.ideal;
  return Math.round(Math.min(98, f.t0 + (f.tg - f.t0) * (k < 1 ? k : 1 + (k - 1) * 1.2)));
}
function update(dt) {
  S.t += dt;
  S.doorK = lerp(S.doorK, S.doorTo, 1 - Math.exp(-dt * 16));
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 2.5);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.5);
  S.slide = clamp(S.slide + dt * 3, 0, S.f ? 1 : 0);
  for (const p of S.steam) { p.x += p.vx * dt + Math.sin(S.t * 2 + p.ph) * 8 * dt; p.y += p.vy * dt; p.r += dt * 14; p.life -= dt; }

  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }

  if (S.state === "heat") {
    S.lamp = Math.min(1, S.lamp + dt * 4);
    // 表示は早送り：長くても 3 秒ほどで終わる
    const rate = Math.max(S.set / 2.8, 12);

    S.rot += dt * 1.6;

    if (!f.trap && !S.over && S.run >= f.over) { S.over = true; if (S.f === FOOD.milk) { sndBubble(); say("ふきこぼれてる！", 1.2, true); } }
    if (S.over && S.f === FOOD.milk && Math.random() < dt * 4) sndBubble();

  } else if (S.state === "done") {

      const h = (k[5].y + k[5].h + 6) - top;
      S.steam.push({ card: true, x: x + w * 0.3 + (Math.random() - 0.5) * 70, y: top + h * 0.5 - 10, vx: (Math.random() - 0.5) * 10, vy: -40 - Math.random() * 30, r: 10 + Math.random() * 10, life: 1.6, max: 1.6, ph: Math.random() * 6 });
    }
    if (Math.random() < dt * 10 * n) S.steam.push({ x: GEO.tt[0] + (Math.random() - 0.5) * 50, y: GEO.tt[1] - 30, vx: (Math.random() - 0.5) * 8, vy: -30 - Math.random() * 20, r: 8 + Math.random() * 8, life: 2, max: 2, ph: Math.random() * 6 });
  }
}
function burst() {
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * TAU, sp = 200 + Math.random() * 400;
    S.parts.push({ x: GEO.tt[0], y: GEO.tt[1] - 20, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, r: 2 + Math.random() * 4, life: 0.6 + Math.random() * 0.4, max: 1, c: Math.random() < 0.3 ? "#ffb32e" : "#fffbef" });

}
function startHeat() {
  S.state = "heat"; S.run = 0; S.over = false; S.popped = false;
  S.doorTo = 1; sndDoor(true);
  setTimeout(humStart, 160);
}
function finishRound() {
  const f = S.f;
  const used = S.state === "set" ? 0 : S.set;
  let pts, word, tp = temp(f, used), col;
  if (f.trap) {
    if (!used) { pts = 100; word = "正解！ 殻つき卵はチン禁止"; tp = f.t0; }
    else { pts = 0; word = f.burn; }
  } else {
    const d = Math.abs(used - f.ideal);
    if (d <= f.tol) pts = Math.round(100 - d / Math.max(1, f.tol) * 12);
    else pts = Math.max(0, Math.round(88 - (d - f.tol) / (f.ideal * 0.6) * 88));
    if (!used) pts = 0;
    word = S.over ? f.burn : d <= f.tol ? f.hot : used < f.ideal ? (tp < 25 ? f.cold : f.warm) : "ちょっと熱すぎ。ふーふーして";
  }
  col = tp >= 80 ? "#c8553d" : tp >= 50 ? "#e08a2c" : tp >= 30 ? "#b5822a" : "#4b7fb3";
  const hint = f.trap ? "目安：温めない（爆発します）" : `目安：${f.w}Wで${jtime(f.ideal)}くらい`;

  S.res.push({ name: f.name, set: used, pts, ideal: f.ideal, trap: !!f.trap });

  startRound();
}
function startRound() {

function makeOrder() {

  return base;
}

  $("rBig").innerHTML = `${total}<small>点</small>`;
  $("rRank").textContent = rank;
