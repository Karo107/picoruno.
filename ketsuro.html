<style>
/* 画面：冬の夜の窓（Blender でくもった窓・すきとおった窓の2枚）。なぞったところだけ、すきとおった絵を見せる。 */

  --night:#1a1d2e; --card:#fbf8f4; --ink:#33303d; --sub:#7d7889; --line:#e6e0d8;
  --wood:#c08a5a; --wood-d:#8e6038; --blue:#5b7fd0; --warn:#c8574a; --ok:#4f8f6a;

}
html,body{margin:0;height:100%;background:var(--night);overflow:hidden}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);font-weight:500;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}

  border:2px solid rgba(255,255,255,.85);background:rgba(26,29,46,.45);color:#fff;cursor:pointer;display:grid;place-items:center}

  box-shadow:0 18px 50px rgba(0,0,0,.45);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 24px);overflow-y:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;cursor:pointer;
  font-family:var(--pop);font-weight:800;font-size:1.1rem;background:var(--wood);color:#fff;box-shadow:0 4px 0 var(--wood-d);transition:transform .08s,box-shadow .08s}

<body>
<canvas id="cv" aria-label="ゲーム画面"></canvas>
<button class="mute" id="mute" type="button" aria-label="音のオン・オフ"></button>

<section class="sheet" id="title">
  <div class="kicker">picoruno. 新作</div>
  <h1>結露のまど</h1>
  <p>冬の夜。あたたかい部屋の窓が、まっ白にくもっている。指でなぞると、外の街の灯りが見える。</p>
  <div class="how">
    <b>なぞる</b><span>窓にうっすら見えるお題の線を、指でなぞる</span>
    <b>採点</b><span>線をどれだけなぞれたか、はみださなかったか</span>
    <b>3まい</b><span>1まい15秒。終わったら、はーっと息でくもらせて次へ</span>
  </div>
  <button class="btn" id="start" type="button">窓の前に立つ</button>
  <div class="best" id="best"></div>
</section>

<button class="btn done" id="act" type="button" hidden>できた！</button>

<section class="sheet" id="result" hidden>
  <div class="cap">3まいの平均</div>
  <div class="big" id="rBig">0<small>点</small></div>
  <div class="rank" id="rRank"></div>
  <div class="stats" id="rStats"></div>
  <div class="note" id="rNote"></div>
  <div class="row"><button class="btn x" id="xBtn" type="button">𝕏 にポスト</button><button class="btn sub" id="imgBtn" type="button">画像で保存</button></div>
  <button class="btn" id="again" type="button">もう一度くもらせる</button>
</section>
<div class="toast" id="toast" hidden></div>

<script>
/* ==== KIT：BGM・効果音・保存・シェアの共通部品（各ゲームに埋め込んで使う） ==== */
const KIT = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- 音 ---------- */
  let ctx = null, master, musicBus, sfxBus, verb, muted = store.get("picoruno-mute", false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      // 残響（生成したインパルス応答）
      verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = ir;
      const vg = ctx.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const now = () => (ctx ? ctx.currentTime : 0);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* 1音。f: 周波数, to: 終わりの周波数, t: 開始までの秒, dur: 長さ */
  function tone(o) {
    if (!ensure()) return;
    const { f = 440, to = null, t = 0, dur = 0.2, type = "sine", vol = 0.3, a = 0.005, rel = null, bus = sfxBus, wet = 0.15, lp = null, detune = 0, pan = 0 } = o;
    const s = now() + t, g = ctx.createGain(), osc = ctx.createOscillator();
    osc.type = type; osc.frequency.setValueAtTime(f, s); osc.detune.value = detune;
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.linearRampToValueAtTime(vol, s + a);
    g.gain.exponentialRampToValueAtTime(0.0001, s + (rel || dur));
    let node = osc;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; node.connect(fl); node = fl; }
    node.connect(g);
    let out = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(verb); }
    osc.start(s); osc.stop(s + (rel || dur) + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ensure()) return;
    const { t = 0, dur = 0.2, vol = 0.3, f = 1200, to = null, q = 0.8, type = "bandpass", a = 0.004, bus = sfxBus, wet = 0.1 } = o;
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = now() + t, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    fl.type = type; fl.frequency.setValueAtTime(f, s); fl.Q.value = q;
    if (to) fl.frequency.exponentialRampToValueAtTime(to, s + dur);
    g.gain.setValueAtTime(0.0001, s); g.gain.linearRampToValueAtTime(vol, s + a); g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    src.connect(fl); fl.connect(g); g.connect(bus);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(verb); }
    src.start(s, Math.random()); src.stop(s + dur + 0.05);
  }

  /* 楽器 */
  const inst = {
    epiano(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 1.6, vol: v, type: "sine", bus: musicBus, wet: 0.25, a: 0.004 }); tone({ f: f * 2, t, dur: 0.5, vol: v * 0.35, type: "sine", bus: musicBus, wet: 0.2 }); tone({ f: f * 3.01, t, dur: 0.18, vol: v * 0.12, type: "sine", bus: musicBus, wet: 0.1 }); },
    bell(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: d * 2.2, vol: v, bus: musicBus, wet: 0.35 }); tone({ f: f * 3.98, t, dur: 0.35, vol: v * 0.25, bus: musicBus, wet: 0.35 }); },
    marimba(m, t, d, v) { const f = mtof(m); tone({ f, t, dur: 0.45, vol: v, bus: musicBus, wet: 0.2 }); tone({ f: f * 4, t, dur: 0.07, vol: v * 0.3, bus: musicBus, wet: 0.1 }); },
    pluck(m, t, d, v) { tone({ f: mtof(m), t, dur: Math.min(0.6, d * 1.2), vol: v, type: "triangle", lp: 2400, bus: musicBus, wet: 0.25 }); },
    flute(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.95, vol: v * 0.8, type: "sine", a: 0.06, bus: musicBus, wet: 0.4 }); tone({ f: mtof(m) * 2, t, dur: d * 0.9, vol: v * 0.08, type: "triangle", a: 0.08, bus: musicBus, wet: 0.4 }); },
    chip(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.45, type: "square", lp: 3000, bus: musicBus, wet: 0.08 }); },
    pad(m, t, d, v) { const f = mtof(m); for (const dt of [-7, 7]) tone({ f, t, dur: d, vol: v * 0.5, type: "sawtooth", a: d * 0.35, lp: 900, detune: dt, bus: musicBus, wet: 0.5 }); },
    koto(m, t, d, v) { const f = mtof(m); tone({ f, to: f * 0.995, t, dur: 0.9, vol: v, type: "triangle", lp: 3200, a: 0.002, bus: musicBus, wet: 0.35 }); tone({ f: f * 2, t, dur: 0.25, vol: v * 0.3, type: "sine", bus: musicBus, wet: 0.2 }); },
    bass(m, t, d, v) { tone({ f: mtof(m), t, dur: d * 0.9, vol: v, type: "triangle", lp: 600, bus: musicBus, wet: 0 }); tone({ f: mtof(m), t, dur: d * 0.9, vol: v * 0.6, type: "sine", bus: musicBus, wet: 0 }); },
    kick(t, v) { tone({ f: 130, to: 42, t, dur: 0.28, vol: v, type: "sine", bus: musicBus, wet: 0 }); },
    snare(t, v) { noise({ t, dur: 0.16, vol: v * 0.6, f: 1900, q: 0.7, bus: musicBus, wet: 0.2 }); },
    hat(t, v) { noise({ t, dur: 0.04, vol: v * 0.35, f: 8000, type: "highpass", bus: musicBus, wet: 0 }); },
    shaker(t, v) { noise({ t, dur: 0.07, vol: v * 0.25, f: 6000, q: 2, bus: musicBus, wet: 0.05 }); }
  };

  /* ---------- BGM（シード付きの自動作曲。4小節のフレーズをくりかえす） ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  let song = null, timer = null, nextT = 0, step = 0;
  /* opts: {bpm, key(midi), chords:[[度数...]...], lead, chord, beat:"lofi"|"waltz"|"none"|"chip"|"shaker", seed, scale:[...], swing, leadVol, density} */
  function musicStart(opts) {
    if (!ensure()) return;
    musicStop();
    const r = rng(opts.seed || 7);
    const scale = opts.scale || [0, 2, 4, 7, 9];      // ペンタトニック
    const beats = opts.beat === "waltz" ? 3 : 4;
    const steps = beats * 4;                           // 16分音符
    // 4小節ぶんのメロディを作る（2小節目と4小節目は少し変える）
    const motif = [];
    for (let bar = 0; bar < 4; bar++) {
      const line = [];
      let deg = Math.floor(r() * scale.length);
      for (let s = 0; s < steps; s++) {
        const strong = s % 4 === 0;
        if (r() < (strong ? 0.62 : 0.2) * (opts.density || 1)) {
          deg = Math.max(0, Math.min(scale.length * 2 - 1, deg + Math.floor(r() * 5) - 2));
          const len = strong && r() < 0.5 ? 4 : 2;
          line.push({ s, deg, len });
        }
      }
      motif.push(line);
    }
    motif[2] = motif[0].map(n => ({ ...n }));          // 3小節目は1小節目のくりかえし
    song = { ...opts, beats, steps, motif, scale };
    nextT = now() + 0.1; step = 0;
    timer = setInterval(schedule, 40);
  }
  function schedule() {
    if (!song || !ctx) return;
    const spb = 60 / song.bpm, sixteenth = spb / 4;
    while (nextT < now() + 0.25) {
      const bar = Math.floor(step / song.steps), s = step % song.steps;
      const chordDegs = song.chords[bar % song.chords.length];
      const key = song.key || 60;
      const sw = (s % 2 === 1) ? (song.swing || 0) * sixteenth : 0;
      const t = nextT + sw - now();
      // コード
      if (s === 0) chordDegs.forEach((d, i) => (inst[song.chord || "epiano"])(key + d, t + i * 0.012, spb * song.beats * 0.9, (song.chordVol || 0.08)));
      if (song.beat === "waltz" && (s === 4 || s === 8)) chordDegs.slice(1).forEach(d => inst[song.chord || "epiano"](key + d, t, spb * 0.8, (song.chordVol || 0.08) * 0.6));
      // ベース
      if (song.bassOn !== false) {
        if (s === 0) inst.bass(key - 24 + chordDegs[0], t, spb * 1.8, 0.22);
        if (song.beat !== "waltz" && s === 8) inst.bass(key - 24 + chordDegs[0] + (bar % 2 ? 7 : 0), t, spb * 1.6, 0.18);
      }
      // リズム
      const bt = song.beat || "lofi";
      if (bt === "lofi") { if (s === 0 || s === 10) inst.kick(t, 0.38); if (s === 4 || s === 12) inst.snare(t, 0.25); if (s % 2 === 0) inst.hat(t, s % 4 === 2 ? 0.5 : 0.3); }
      else if (bt === "chip") { if (s % 4 === 0) inst.kick(t, 0.3); if (s === 4 || s === 12) inst.snare(t, 0.2); if (s % 2 === 1) inst.hat(t, 0.3); }
      else if (bt === "waltz") { if (s === 0) inst.kick(t, 0.25); if (s === 4 || s === 8) inst.shaker(t, 0.6); }
      else if (bt === "shaker") { if (s % 2 === 0) inst.shaker(t, s % 4 === 0 ? 0.7 : 0.4); if (s === 0) inst.kick(t, 0.2); }
      // メロディ
      if (song.lead) {
        const line = song.motif[bar % 4];
        for (const n of line) if (n.s === s) {
          const oct = Math.floor(n.deg / song.scale.length), d = song.scale[n.deg % song.scale.length];
          inst[song.lead](key + 12 + oct * 12 + d, t, sixteenth * n.len, song.leadVol || 0.1);
        }
      }
      nextT += sixteenth; step++;
    }
  }
  function musicStop() { if (timer) clearInterval(timer); timer = null; song = null; }
  function setMuted(m) {
    muted = m; store.set("picoruno-mute", m);
    if (master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
  }

  /* ---------- そのほか ---------- */
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function tweet(text, url) {
    const u = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + (url ? "&url=" + encodeURIComponent(url) : "");
    window.open(u, "_blank", "noopener");
  }
  async function shareImage(canvas, name, text) {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], name, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return "shared"; }
    } catch (e) { if (e && e.name === "AbortError") return "cancel"; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return "downloaded";
  }
  function loadImages(map) {
    const out = {};
    return Promise.all(Object.entries(map).map(([k, src]) => new Promise(res => {
      const im = new Image(); im.onload = () => { out[k] = im; res(); }; im.onerror = () => { out[k] = null; res(); }; im.src = src;
    }))).then(() => out);
  }

  /* 遊んだ回数を数える（トップページの ▶ 回数）。同じタブでの再読みこみは1回だけ。 */
  function countPlay(G) {
    const K = "picoruno-played:" + G;
    try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, "1"); } catch (e) {}
    const KEY = "sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
    fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play", { method: "POST", keepalive: true,
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ g: G }) })
      .then(r => { if (!r.ok) throw 0; })
      .catch(() => { try { const d = JSON.parse(localStorage.getItem("picoruno-stats") || "{}"); d[G] = d[G] || { plays: 0, likes: 0 }; d[G].plays++; localStorage.setItem("picoruno-stats", JSON.stringify(d)); } catch (e) {} });
  }

  /* セーフエリア（ノッチなど）の大きさ(px) */
  let safeEl = null;
  function safe() {

const toScr = p => [BOX.cx + p[0] * BOX.s, BOX.cy + p[1] * BOX.s];
function resample(strokes, step) {   // 線を等間隔の点に
  const out = [];
  for (const st of strokes) {
    const P = st.map(toScr);
    out.push(P[0]);
    let carry = 0;
    for (let i = 1; i < P.length; i++) {
      const a = P[i - 1], b = P[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      let s = step - carry;
      while (s <= d) { out.push([lerp(a[0], b[0], s / d), lerp(a[1], b[1], s / d)]); s += step; }
      carry = d - (s - step);

const S = { state: "title", t: 0, round: 0, order: [], left: ROUND_T, shape: null, target: [], drawn: [], scores: [], msg: null, drips: [], snow: [], refog: 0, res: null, best: null };

/* ---------- canvas とうら画面 ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const MASK = mk(W * RES, H * RES), mx = MASK.getContext("2d");      // ふいたところ（白）
const BEAD = mk(W * RES, H * RES), bx = BEAD.getContext("2d");      // ふちの水玉
const CLR = mk(W * RES, H * RES), clx = CLR.getContext("2d");       // すきとおった窓＋雪 → マスクで切りぬく
let fit = 1, dpr = 1, vw = 0, vh = 0;
function resize() {

function view() { const lw = vw / fit, lh = vh / fit; return { lw, lh, ox: (lw - W) / 2, oy: clamp(lh * 0.48 - BOX.cy, lh - H, 0) }; }

function render() {

    cx.fillStyle = "rgba(20,18,28,.35)"; cx.fillRect(-v.ox, -v.oy, v.lw, v.lh);

}
function drawScene(g, t) {
  if (!IMG.fog) return;

  g.save(); g.beginPath(); g.rect(GL.x0, GL.y0, GL.x1 - GL.x0, GL.y1 - GL.y0); g.clip();

}
function drawHud() {

  g.save();
  g.fillStyle = "rgba(26,29,46,.66)"; rr(g, 12, top, w, 62, 16); g.fill();
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "left";
  g.font = '800 19px "M PLUS Rounded 1c",sans-serif';
  g.fillText(`${S.round + 1}まいめ「${S.shape ? S.shape.name : ""}」`, 28, top + 24);
  g.textAlign = "right"; g.fillStyle = S.left < 4 ? "#ffb4a2" : "#fff";
  g.fillText(`${Math.ceil(S.left)}秒`, 12 + w - 14, top + 24);
  g.fillStyle = "rgba(255,255,255,.2)"; rr(g, 28, top + 44, w - 32, 7, 4); g.fill();
  g.fillStyle = "#cfe0ff"; rr(g, 28, top + 44, (w - 32) * clamp(S.left / ROUND_T, 0, 1), 7, 4); g.fill();

function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }

/* ---------- ふく ---------- */
function wipe(a, b) {
  for (const c of [mx]) {
    c.save(); c.setTransform(RES, 0, 0, RES, 0, 0);
    c.beginPath(); c.rect(GL.x0, GL.y0, GL.x1 - GL.x0, GL.y1 - GL.y0); c.clip();
    c.strokeStyle = "#fff"; c.lineCap = "round"; c.lineJoin = "round";
    c.shadowColor = "#fff"; c.shadowBlur = 10 * RES;

    c.restore();
  }

  const d = Math.hypot(b.x - a.x, b.y - a.y) || 1, nx = -(b.y - a.y) / d, ny = (b.x - a.x) / d;
  bx.save(); bx.setTransform(RES, 0, 0, RES, 0, 0);
  for (let i = 0; i < d / 6; i++) {
    const k = Math.random(), side = Math.random() < 0.5 ? -1 : 1, off = PEN / 2 + 1 + Math.random() * 3;
    const x = lerp(a.x, b.x, k) + nx * off * side, y = lerp(a.y, b.y, k) + ny * off * side, r = 0.8 + Math.random() * 1.8;
    if (x < GL.x0 || x > GL.x1 || y < GL.y0 || y > GL.y1) continue;
    bx.fillStyle = "rgba(255,255,255,.75)"; bx.beginPath(); bx.arc(x, y, r, 0, TAU); bx.fill();
    bx.fillStyle = "rgba(30,30,50,.3)"; bx.beginPath(); bx.arc(x, y + r * 0.4, r * 0.6, 0, Math.PI); bx.fill();
  }
  bx.restore();
  // 太い線の下からは、ときどきしずくが流れる
  if (Math.random() < d / 220) S.drips.push({ x: lerp(a.x, b.x, Math.random()) + (Math.random() - 0.5) * PEN * 0.5, y: Math.max(a.y, b.y) + PEN * 0.45, r: 2.2 + Math.random() * 1.6, v: 0, wait: 0.6 + Math.random() * 1.2, life: 2 + Math.random() * 3 });
}
let lastP = null;
const toWorld = e => { const v = view(); return { x: e.clientX / fit - v.ox, y: e.clientY / fit - v.oy }; };
cv.addEventListener("pointerdown", e => { if (S.state !== "play") return; lastP = toWorld(e); S.drawn.push([lastP.x, lastP.y]); wipe(lastP, { x: lastP.x + 0.1, y: lastP.y }); try { cv.setPointerCapture(e.pointerId); } catch (er) {} squeak(0.6); });
cv.addEventListener("pointermove", e => {
  if (!lastP || S.state !== "play") return;
  const p = toWorld(e), d = Math.hypot(p.x - lastP.x, p.y - lastP.y);
  if (d < 2) return;
  wipe(lastP, p);
  for (let k = 4; k < d; k += 4) S.drawn.push([lerp(lastP.x, p.x, k / d), lerp(lastP.y, p.y, k / d)]);
  S.drawn.push([p.x, p.y]);

const up = () => { lastP = null; };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

/* ---------- 音 ---------- */
let sq = null;
function soundInit() {
  const ac = KIT.ensure(); if (!ac || sq) return;
  const src = ac.createBufferSource(); src.buffer = KIT.noiseBuffer(); src.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 14;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(bp); bp.connect(g); g.connect(KIT.bus()); src.start();
  const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = 1400;
  const og = ac.createGain(); og.gain.value = 0; o.connect(og); og.connect(KIT.bus()); o.start();
  sq = { bp, g, o, og };
}
function squeak(k) { if (!sq) return; const now = KIT.ensure().currentTime; sq.og.gain.setTargetAtTime(0.012 * k, now, 0.01); }
function soundUpdate() {
  if (!sq) return;
  const now = KIT.ensure().currentTime, sp = lastP ? clamp((S.speed || 0) / 14, 0, 1) : 0;
  sq.g.gain.setTargetAtTime(sp * 0.08, now, 0.03);
  sq.bp.frequency.setTargetAtTime(1800 + sp * 1200 + Math.sin(S.t * 30) * 150, now, 0.02);
  sq.o.frequency.setTargetAtTime(1100 + sp * 900 + Math.sin(S.t * 23) * 200, now, 0.02);
  sq.og.gain.setTargetAtTime(lastP ? sp * 0.014 * (Math.random() < 0.3 ? 1.6 : 0.6) : 0, now, 0.03);
  S.speed = lerp(S.speed || 0, 0, 0.1);
}
function breath() {   // はーっ
  const t0 = KIT.ensure().currentTime;
  KIT.noise({ t: t0, dur: 1.4, vol: 0.1, f: 700, to: 450, q: 0.6, type: "lowpass", wet: 0.1, a: 0.25 });
  KIT.noise({ t: t0, dur: 1.2, vol: 0.03, f: 2400, q: 1, wet: 0.05, a: 0.3 });
}

/* ---------- 進行 ---------- */
let last = performance.now();
function frame(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(frame); }
function update(dt) {
  S.t += dt;
  // 雪
  for (const f of S.snow) { f.y += f.v * dt; f.x += Math.sin(S.t * f.w + f.p) * 12 * dt; if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; } }
  // しずく：少し待って、つーっと流れる（通ったあとはすきとおる）
  for (const d of S.drips) {
    if (d.wait > 0) { d.wait -= dt; continue; }
    d.v = lerp(d.v, 40 + Math.random() * 80, 0.1); const ny = d.y + d.v * dt;
    mx.save(); mx.setTransform(RES, 0, 0, RES, 0, 0); mx.strokeStyle = "rgba(255,255,255,.8)"; mx.lineWidth = d.r * 1.3; mx.lineCap = "round";
    mx.beginPath(); mx.moveTo(d.x, d.y); d.x += (Math.random() - 0.5) * 1.2; mx.lineTo(d.x, ny); mx.stroke(); mx.restore();
    d.y = ny; d.life -= dt;
  }
  S.drips = S.drips.filter(d => d.life > 0 && d.y < GL.y1 - 4);
  // 時間がたつと、またくもる（ゆっくり）。次の窓へは息で一気に
  // （8bitのアルファは小さい値だと減らないので、ゆっくりの方はまとめて引く）
  let fade = 0;
  if (S.refog > 0) { fade = dt * 1.6; S.refog -= dt; if (S.refog <= 0) { mx.clearRect(0, 0, MASK.width, MASK.height); bx.clearRect(0, 0, BEAD.width, BEAD.height); } }
  else if ((S.fogAcc = (S.fogAcc || 0) + dt) >= 2) { fade = S.fogAcc * 0.012; S.fogAcc = 0; }
  if (fade > 0) for (const c of [mx, bx]) { c.save(); c.globalCompositeOperation = "destination-out"; c.fillStyle = `rgba(0,0,0,${fade})`; c.fillRect(0, 0, MASK.width, MASK.height); c.restore(); }
  if (S.state === "wait" && (S.waitT -= dt) <= 0 && S.refog <= 0) {
    S.state = "play"; $("act").hidden = false;
    say(`お題「${S.shape.name}」`, 1.6);
  }
  if (S.state === "play") {
    S.left = Math.max(0, S.left - dt);
    if (S.left <= 0) judge();
  }

}
function judge() {
  if (S.state !== "play") return;
  S.state = "judge"; lastP = null; $("act").hidden = true;
  const T = S.target, D = S.drawn, R1 = 20, R2 = 26;
  const near = (p, Q, R) => { for (const q of Q) if ((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 < R * R) return true; return false; };
  const cov = T.length ? T.filter(p => near(p, D, R1)).length / T.length : 0;
  const pre = D.length ? D.filter(p => near(p, T, R2)).length / D.length : 0;
  // ていねいさ：かいた点からお題の線までの平均きょり
  let sd = 0; for (const p of D) { let m = 1e9; for (const q of T) m = Math.min(m, (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2); sd += Math.sqrt(m); }
  const neat = D.length ? clamp(1.2 - sd / D.length / 25, 0, 1) : 0;
  const pt = Math.round(100 * Math.pow(cov, 1.2) * Math.pow(pre, 0.7) * neat);
  S.scores.push({ name: S.shape.name, pt, cov, pre, neat });
  if (!S.best || pt >= S.best.pt) S.best = { pt, snap: snapshot() };
  const w = pt >= 90 ? "きれい！" : pt >= 70 ? "いい線" : pt >= 45 ? "まあまあ" : "うーん…";
  say(`${w} ${pt}点（なぞれた ${Math.round(cov * 100)}%・はみだし ${Math.round((1 - pre) * 100)}%）`, 2.2, pt < 45);
  KIT.inst.bell(pt >= 70 ? 84 : 79, KIT.ensure().currentTime, 0.4, 0.08);

}
function snapshot() {   // シェア用に、いまの窓を残す

}
function nextRound() {

  S.target = resample(S.shape.strokes, 6); S.drawn = [];
  S.left = ROUND_T;

  S.state = "wait";
}
function startGame() {
  KIT.ensure(); soundInit();
  $("title").hidden = true; $("result").hidden = true;
  const idx = SHAPES.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  S.order = idx.slice(0, ROUNDS); S.round = 0; S.scores = []; S.best = null;
  mx.clearRect(0, 0, MASK.width, MASK.height); bx.clearRect(0, 0, BEAD.width, BEAD.height);
  nextRound();
  startMusic(false); KIT.countPlay(GAME_TITLE);
}
$("act").addEventListener("click", () => judge());
const RANKS = [[90, "窓の画家"], [75, "なぞり上手"], [55, "冬の落書き"], [35, "くもりの向こう"], [-1, "ただの手のあと"]];
function finish() {
  S.state = "result";
  const avg = Math.round(S.scores.reduce((a, s) => a + s.pt, 0) / S.scores.length);
  const rank = RANKS.find(r => avg >= r[0])[1];
  S.res = { avg, rank };
  $("rBig").innerHTML = `${avg}<small>点</small>`;
  $("rRank").textContent = rank;
  $("rStats").innerHTML = S.scores.map(s => `<div class="stat"><small>${s.name}</small><b>${s.pt}点</b></div>`).join("");
  const best = KIT.store.get("ketsuro-best", null);
  if (best === null || avg > best) KIT.store.set("ketsuro-best", avg);
  $("rNote").textContent = best === null || avg > best ? "自己ベスト更新！" : `自己ベスト ${best}点`;
  $("result").hidden = false;
  [0, 4, 7, 12].slice(0, avg >= 75 ? 4 : avg >= 45 ? 3 : 2).forEach((d, i) => KIT.inst.bell(76 + d, KIT.ensure().currentTime + i * 0.15, 0.5, 0.08));
  KIT.music.stop(); setTimeout(() => startMusic(true), 900);
}
function shareText() { const r = S.res; return `結露のまど、3まいの平均 ${r.avg}点（${S.scores.map(s => s.name + s.pt).join("・")}）\nわたしは「${r.rank}」\n#結露のまど`; }
function shareCanvas() {
  const c = mk(1200, 630), g = c.getContext("2d");
  g.fillStyle = "#1a1d2e"; g.fillRect(0, 0, 600, 630);
  const snap = S.best ? S.best.snap : snapshot();
  const sc = 630 / (BOX.s * 2 + 120);
  g.save(); g.beginPath(); g.rect(0, 0, 600, 630); g.clip();
  g.translate(300, 315); g.scale(sc, sc); g.translate(-BOX.cx, -BOX.cy);
  g.drawImage(snap, 0, 0); g.restore();
  g.fillStyle = "#fbf8f4"; g.fillRect(600, 0, 600, 630);
  g.fillStyle = "#c08a5a"; g.fillRect(600, 0, 10, 630);
  g.textAlign = "left";
  g.fillStyle = "#33303d"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText("結露のまど", 650, 92);
  g.fillStyle = "#7d7889"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText("くもった窓に、3まいなぞった", 650, 170);

  const t = String(S.res.avg); g.fillText(t, 650, 274);
  const tw = g.measureText(t).width; g.font = '800 34px "M PLUS Rounded 1c",sans-serif'; g.fillText("点", 660 + tw, 274);
  g.fillStyle = "#33303d"; g.font = '800 40px "M PLUS Rounded 1c",sans-serif'; g.fillText(S.res.rank, 650, 350);
  g.fillStyle = "#7d7889"; g.font = '700 24px "Zen Maru Gothic",sans-serif'; g.fillText(S.scores.map(s => `${s.name} ${s.pt}`).join("　"), 650, 400);
  g.fillText("#結露のまど ・ picoruno.", 650, 580);
  return c;
}
