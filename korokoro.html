<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<title>ころころおやつ</title>
<meta name="description" content="となりのおやつと入れかえて、3ついじょう並べて消すパズル。時間内にお客さんの注文をそろえて、ステージをどんどん進もう。ボムやほしクッキーで一気に消して、コンボをつなげるとフィーバー！">
<meta property="og:type" content="website">
<meta property="og:title" content="ころころおやつ">
<meta property="og:description" content="おやつを3つそろえて消すパズル。注文をこなして、あなたは何ステージまで行ける？">
<meta property="og:url" content="https://runococco.github.io/picoruno./korokoro.html">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://runococco.github.io/picoruno./og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://runococco.github.io/picoruno./og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7f2e8'/%3E%3Cpath d='M16 4q3 0 10 15q2 7-10 7q-12 0-10-7q7-15 10-15z' fill='%23fbf8f2' stroke='%235b4d45' stroke-width='1.6'/%3E%3Crect x='11' y='19' width='10' height='7' rx='1' fill='%234d4a48'/%3E%3Ccircle cx='13' cy='14' r='1.3' fill='%235b4d45'/%3E%3Ccircle cx='19' cy='14' r='1.3' fill='%235b4d45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one phone column. Title → play (status rows above an 8×8 board drawn on canvas) → result card made for screenshots. Muted picoruno palette, sweets with tiny faces. */
:root{
  --bg:#f7f2e8;
  --card:#fffdf8;
  --ink:#5b4d45;
  --sub:#8e8077;
  --line:#e6ddcf;
  --accent:#e8877f;    /* メイン：くすみコーラル */
  --egg:#fbe9b7;       /* サブ：たまご色 */
  --sky:#cfe3ef;       /* 共有：みずいろ */
  --leaf:#9cc58a;
  --gold:#e3c26b;
  --fever:#f3b65f;
  --pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --box:clamp(256px,min(calc(100vw - 32px),calc(100svh - 290px)),440px);
  color-scheme:light;
}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
.wrap{max-width:472px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;min-height:100svh;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;align-items:center;flex:1;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:3px solid var(--ink);border-radius:20px;cursor:pointer;
  font-family:var(--pop);font-size:1.05rem;padding:12px 20px;min-height:56px;box-sizing:border-box;width:100%;
  background:var(--accent);color:#fff;text-shadow:0 2px 0 rgba(91,77,69,.35);box-shadow:4px 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.light{background:var(--egg);color:var(--ink);text-shadow:none}
.btn.sky{background:var(--sky);color:var(--ink);text-shadow:none}
.btn.plain{background:var(--card);color:var(--ink);text-shadow:none;font-size:.95rem;min-height:48px}
.btn.dark{background:var(--ink);color:var(--card);text-shadow:none}
.btn:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.8rem;cursor:pointer;font-weight:700;color:var(--ink)}
.row{display:flex;gap:10px;width:100%}
.row .btn{flex:1;min-width:0;font-size:.95rem;padding:12px 10px}

/* ---- タイトル ---- */
.logo{font-family:var(--pop);font-size:clamp(2.1rem,11.5vw,3.2rem);letter-spacing:.04em;margin:14px 0 0;line-height:1.1;text-align:center}
.logo span{display:inline-block;animation:hop 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
.logo .c0{color:#e39aa6}.logo .c1{color:#c9935f}.logo .c2{color:#e3a165}.logo .c3{color:#8fb07c}.logo .c4{color:#7f9fc0}.logo .c5{color:#a88bc9}.logo .c6{color:#ec7a74}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.catch{margin:0;color:var(--sub);font-weight:700;text-align:center}
.parade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:400px;margin:4px 0}
.parade i{display:block;aspect-ratio:1;max-width:100%;animation:hop 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}
.parade svg{width:100%;height:100%;display:block}
.howto{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:0;font-size:.88rem;line-height:1.75;width:100%;box-sizing:border-box}
.howto b{font-family:var(--pop);font-weight:400;color:var(--accent)}
.specials{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}
.sp{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;font-size:.72rem;line-height:1.4}
.sp svg{width:44px;height:44px;display:block;margin:0 auto 2px}
.sp b{display:block;font-family:var(--pop);font-weight:400;font-size:.8rem}
.best{font-family:var(--pop);font-size:.95rem;margin:0;color:var(--sub)}
.foot{font-size:.75rem;color:var(--sub);margin:4px 0 0;display:flex;gap:12px;align-items:center}
.foot a{color:var(--sub)}

/* ---- プレイ ---- */
#play{gap:8px}
.hud{display:flex;align-items:center;gap:8px;width:var(--box);max-width:100%}
.stage{font-family:var(--pop);font-size:.85rem;background:var(--ink);color:var(--card);border-radius:999px;padding:4px 12px;white-space:nowrap}
.score{font-family:var(--pop);font-size:1.35rem;margin-left:auto;font-variant-numeric:tabular-nums}
.timebar{position:relative;width:var(--box);max-width:100%;height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;box-sizing:border-box}
.timebar i{position:absolute;inset:0;transform-origin:left;background:var(--leaf);border-radius:999px}
.timebar.warn i{background:var(--accent);animation:blink .5s steps(2) infinite}
.timebar.frozen i{background:var(--fever)}
.timebar b{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.7rem;font-family:var(--pop);font-weight:400;font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.55}}
.order{display:flex;align-items:center;gap:8px;width:var(--box);max-width:100%;background:var(--card);border:2px dashed #d6c9b6;border-radius:14px;padding:4px 8px;box-sizing:border-box}
.order>span{font-family:var(--pop);font-size:.72rem;color:var(--sub);writing-mode:vertical-rl;letter-spacing:.1em}
.quota{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;flex:1;min-width:0}
.q{position:relative;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:10px;padding:2px;transition:background .2s}
.q svg{width:min(40px,9vw);aspect-ratio:1;display:block;flex:none}
.q b{font-family:var(--pop);font-weight:400;font-size:.95rem;line-height:1;font-variant-numeric:tabular-nums}
.q b small{font-size:.65em;color:var(--sub)}
.q.done{background:#e6f1dc}
.q.done b{color:#5f8c50}
.q.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.12)}}
.meters{display:flex;align-items:center;gap:8px;width:var(--box);max-width:100%;min-height:26px}
.combo{font-family:var(--pop);font-size:1rem;min-width:7.5em;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.25;transition:opacity .15s}
.combo.on{opacity:1}
.combo small{font-size:.65em;margin-left:2px}
.fever{position:relative;flex:1;height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.fever i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#f6d48a,var(--fever),#ec9b86)}
.fever.on i{animation:shine .6s linear infinite}
@keyframes shine{50%{filter:brightness(1.15)}}
.fevlabel{font-family:var(--pop);font-size:.7rem;color:var(--sub)}
.board{position:relative;width:var(--box);height:var(--box);max-width:100%;border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);background:var(--card);overflow:hidden;box-sizing:content-box}
.board.fev{box-shadow:4px 4px 0 var(--ink),0 0 0 4px var(--fever)}
.board.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 12px}
.banner p{margin:0;font-family:var(--pop);font-size:clamp(1.6rem,8.5vw,2.5rem);color:var(--card);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.banner small{display:block;margin-top:6px;font-family:var(--pop);font-size:.95rem;color:var(--ink);background:var(--egg);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;animation:pop .35s .1s both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ctrl{display:flex;gap:8px;width:var(--box);max-width:100%;justify-content:space-between}

/* ---- 結果 ---- */
.rcard{width:100%;background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);padding:18px 16px 14px;box-sizing:border-box;text-align:center}
.rhead{font-family:var(--pop);color:var(--sub);font-size:.9rem;margin:0}
.rlabel{margin:10px 0 0;color:var(--sub);font-weight:700;font-size:.9rem}
.rank{font-family:var(--pop);font-size:clamp(1.5rem,7.5vw,2.1rem);margin:2px 0 6px;text-wrap:balance}
.rbig{font-family:var(--pop);font-size:2.4rem;margin:0;font-variant-numeric:tabular-nums;line-height:1.1}
.rbig small{font-size:.45em;color:var(--sub);margin-left:4px}
.newbest{display:inline-block;background:var(--accent);color:#fff;font-family:var(--pop);font-size:.75rem;border-radius:999px;padding:2px 10px;margin-top:4px}
.rstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:12px 0 8px}
.rstats div{background:var(--bg);border-radius:12px;padding:6px 4px}
.rstats span{display:block;font-size:.7rem;color:var(--sub);font-weight:700}
.rstats b{font-family:var(--pop);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.catches{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.catches div{font-family:var(--pop);font-size:.75rem;font-variant-numeric:tabular-nums}
.catches svg{width:100%;aspect-ratio:1;display:block}
.fav{margin:10px 0 0;font-size:.85rem;font-weight:700}
.site{margin:8px 0 0;font-size:.72rem;color:var(--sub)}

.modal{position:fixed;inset:0;background:rgba(62,51,45,.55);display:flex;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:10;overflow-y:auto}
.sheet{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:18px;width:100%;max-width:400px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;text-align:center}
.sheet h2{font-family:var(--pop);font-weight:400;font-size:1.2rem;margin:0}
.sheet img{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;width:100%;border-radius:14px;border:2px solid var(--line);aspect-ratio:1;background:var(--bg)}
.sheet p{margin:0;font-size:.8rem;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:999px;padding:10px 18px;font-size:.85rem;z-index:20;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.logo span,.parade i{animation:none}.board.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== タイトル ===== -->
<section class="screen" id="title">
  <h1 class="logo" id="logo">ころころおやつ</h1>
  <p class="catch">となりと入れかえて、3つそろえて消そう！</p>
  <div class="parade" id="parade" aria-hidden="true"></div>
  <p class="howto">
    <b>①</b> おやつをスワイプして、となりと入れかえ<br>
    <b>②</b> たて・よこに3ついじょう並ぶと消える<br>
    <b>③</b> 時間内に<b>お客さんの注文</b>をそろえるとステージクリア<br>
    <b>④</b> すばやく消し続けると<b>コンボ</b>、たまると<b>フィーバー</b>！
  </p>
  <div class="specials" id="specials"></div>
  <button class="btn" id="startBtn" type="button">あそぶ</button>
  <p class="best" id="bestLine"></p>
  <p class="foot"><a href="https://runococco.github.io/picoruno./">別のゲーム</a><button class="iconbtn" id="muteBtn" type="button" aria-pressed="false">おと：オン</button></p>
</section>

<!-- ===== プレイ ===== -->
<section class="screen" id="play" hidden>
  <div class="hud">
    <span class="stage" id="stageLbl">ステージ 1</span>
    <span class="score" id="scoreLbl">0</span>
  </div>
  <div class="timebar" id="timebar" role="progressbar" aria-label="のこり時間"><i id="timeFill"></i><b id="timeTxt">60</b></div>
  <div class="order"><span>ちゅうもん</span><div class="quota" id="quota"></div></div>
  <div class="meters">
    <span class="combo" id="comboLbl">0<small>コンボ</small></span>
    <span class="fevlabel">フィーバー</span>
    <div class="fever" id="feverBar"><i id="feverFill"></i></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" aria-label="パズルの盤面"></canvas>
    <div class="banner" id="banner" hidden></div>
  </div>
  <div class="ctrl">
    <button class="iconbtn" id="pauseBtn" type="button">いちじ停止</button>
    <button class="iconbtn" id="muteBtn2" type="button" aria-pressed="false">おと：オン</button>
  </div>
</section>

<!-- ===== 結果 ===== -->
<section class="screen" id="result" hidden>
  <div class="rcard">
    <p class="rhead">ころころおやつ ・ けっか</p>
    <p class="rlabel">あなたの称号は…</p>
    <p class="rank" id="rRank"></p>
    <p class="rbig" id="rScore"></p>
    <span class="newbest" id="rNew" hidden>じこベスト更新！</span>
    <div class="rstats">
      <div><span>とうたつ</span><b id="rStage"></b></div>
      <div><span>さいだいコンボ</span><b id="rCombo"></b></div>
      <div><span>ボム・ほし</span><b id="rSp"></b></div>
    </div>
    <div class="catches" id="rCatches"></div>
    <p class="fav" id="rFav"></p>
    <p class="site">#ころころおやつ ・ picoruno.</p>
  </div>
  <div class="row">
    <a class="btn dark" id="xBtn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">𝕏 に投稿</a>
    <button class="btn sky" id="imgBtn" type="button">画像でシェア</button>
  </div>
  <button class="btn" id="againBtn" type="button">もういちど</button>
  <button class="btn plain" id="homeBtn" type="button">タイトルへ</button>
</section>

</div>

<div class="modal" id="pauseModal" hidden>
  <div class="sheet">
    <h2>いちじ停止中</h2>
    <button class="btn" id="resumeBtn" type="button">つづける</button>
    <button class="btn plain" id="giveupBtn" type="button">ここでおわる</button>
  </div>
</div>

<div class="modal" id="shareModal" hidden>
  <div class="sheet">
    <h2>結果の画像</h2>
    <img id="shareImg" alt="結果の画像">
    <p>スマホは画像を長押しでも保存できます</p>
    <button class="btn sky" id="shareGo" type="button">保存・シェアする</button>
    <button class="btn plain" id="copyTxt" type="button">シェア文をコピー</button>
    <button class="btn plain" id="shareClose" type="button">とじる</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const GAME_URL='https://runococco.github.io/picoruno./korokoro.html';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY_BEST='korokoro-best', KEY_MUTE='korokoro-mute';
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== おやつ（オリジナルのSVG。viewBox 0 0 100 100）。形と色の両方で見分けられるようにしています ===== */
const INK='#5b4d45';
// 絵柄：線なし・ハイライトなしのフラットな形に、点の目と小さな口
const eyes=(y,dx=11)=>`<circle cx="${50-dx}" cy="${y}" r="3.8" fill="${INK}"/><circle cx="${50+dx}" cy="${y}" r="3.8" fill="${INK}"/>`;
const cheeks=(y,dx,col)=>`<ellipse cx="${50-dx}" cy="${y}" rx="5" ry="3.2" fill="${col}" opacity=".75"/><ellipse cx="${50+dx}" cy="${y}" rx="5" ry="3.2" fill="${col}" opacity=".75"/>`;
const mouth=y=>`<path d="M47 ${y} q3 3 6 0" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;
const face=(y,dx=11,ck='#f19c9c')=>eyes(y,dx)+cheeks(y+6,dx+7,ck)+mouth(y+4);
const SWEETS=[
  {id:'cake',name:'ショートケーキ',emoji:'🍰',col:'#ec7a74',svg:
    `<rect x="14" y="40" width="72" height="48" rx="9" fill="#fbf1e0"/>
     <rect x="14" y="70" width="72" height="8" fill="#f2cf8a"/><rect x="14" y="56" width="72" height="5" fill="#f4a7a7"/>
     <path d="M30 42 q-4 -12 8 -12 q2 -8 12 -6 q10 -2 12 6 q12 0 8 12 Z" fill="#fff8ee"/>
     <path d="M50 30 C41 29 39 17 50 11 C61 17 59 29 50 30Z" fill="#ec7a74"/><path d="M44 13 L50 8 L56 13 L50 15 Z" fill="#8cc276"/>
     ${face(48,11,'#f7b0a8')}`},
  {id:'purin',name:'プリン',emoji:'🍮',col:'#f3d27a',svg:
    `<ellipse cx="50" cy="85" rx="42" ry="8" fill="#e6ddd0"/>
     <path d="M23 83 L31 34 Q50 25 69 34 L77 83 Q50 89 23 83 Z" fill="#f4d47c"/>
     <path d="M31 34 Q50 25 69 34 L67.4 44 Q50 50 32.6 44 Z" fill="#b97a52"/>
     ${face(61,11,'#f0a58a')}`},
  {id:'donut',name:'ドーナツ',emoji:'🍩',col:'#f2a9b8',svg:
    `<path fill-rule="evenodd" d="M50 13a37 37 0 1 0 .01 0Z M50 30a9 9 0 1 0 .01 0Z" fill="#e8bf8c"/>
     <path fill-rule="evenodd" d="M50 17a33 33 0 0 0 -33 33 q3 6 8 2 q5 6 10 1 q5 6 11 2 q5 5 11 1 q5 5 11 0 q6 4 10 -2 q4 4 5 -4 a33 33 0 0 0 -33 -33Z M50 30a9 9 0 1 0 .01 0Z" fill="#f2a9b8"/>
     <g stroke-width="3" stroke-linecap="round"><path d="M28 34 l4 -3" stroke="#fff6d6"/><path d="M70 30 l3 4" stroke="#9cc2e4"/><path d="M76 46 l-1 5" stroke="#fff6d6"/><path d="M24 48 l2 4" stroke="#9cc2e4"/><path d="M60 22 l4 1" stroke="#a9cc85"/></g>
     ${face(64,11,'#e98f9e')}`},
  {id:'soda',name:'ソーダアイス',emoji:'🍧',col:'#9cc2e4',svg:

function randType(){

  const w=G.quota.map(q=>q>0?1.15:.85), sum=w.reduce((a,b)=>a+b,0);

function at(r,c){return r>=0&&r<N&&c>=0&&c<N?G.grid[r][c]:null}
function typeAt(r,c){const t=at(r,c);return t?t.t:-1}
function fillBoard(){
  G.grid=[];
  for(let r=0;r<N;r++){G.grid.push([]);for(let c=0;c<N;c++){
    let t; do{t=Math.floor(Math.random()*NT)}while((c>=2&&typeAt(r,c-1)===t&&typeAt(r,c-2)===t)||(r>=2&&typeAt(r-1,c)===t&&typeAt(r-2,c)===t));
    G.grid[r].push(newTile(t,r,c,r-N-1-(N-r)*.15));
  }}
  if(!findMove()) fillBoard();
}
function findMatches(){
  const groups=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const t=typeAt(r,c);let e=c+1;while(e<N&&typeAt(r,e)===t)e++;
    if(t>=0&&e-c>=3){const g=[];for(let k=c;k<e;k++)g.push([r,k]);groups.push({t,cells:g})} c=e}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const t=typeAt(r,c);let e=r+1;while(e<N&&typeAt(e,c)===t)e++;
    if(t>=0&&e-r>=3){const g=[];for(let k=r;k<e;k++)g.push([k,c]);groups.push({t,cells:g})} r=e}}
  return groups;
}
function lineAt(r,c){ // (r,c) を含む3連以上があるか
  const t=typeAt(r,c); if(t<0) return false;
  let h=1;for(let k=c-1;typeAt(r,k)===t;k--)h++;for(let k=c+1;typeAt(r,k)===t;k++)h++;
  let v=1;for(let k=r-1;typeAt(k,c)===t;k--)v++;for(let k=r+1;typeAt(k,c)===t;k++)v++;
  return h>=3||v>=3;
}
function rawSwap(a,b){const A=G.grid[a[0]][a[1]],B=G.grid[b[0]][b[1]];G.grid[a[0]][a[1]]=B;G.grid[b[0]][b[1]]=A;
  if(A){A.r=b[0];A.c=b[1]} if(B){B.r=a[0];B.c=a[1]}}
function findMove(){
  const opts=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc; if(r2>=N||c2>=N) continue;
    const A=at(r,c),B=at(r2,c2); if(!A||!B) continue;
    if(A.sp===2||B.sp===2){opts.push([[r,c],[r2,c2]]);continue}
    if(A.t===B.t) continue;
    rawSwap([r,c],[r2,c2]); const ok=lineAt(r,c)||lineAt(r2,c2); rawSwap([r,c],[r2,c2]);
    if(ok) opts.push([[r,c],[r2,c2]]);
  }
  return opts.length?opts[Math.floor(Math.random()*opts.length)]:null;
}

/* ===== 時間（ゲーム内時計。いちじ停止で止まる） ===== */
function wait(sec){return new Promise(res=>G.timers.push({t:G.clock+sec,res}))}
function settled(){for(const row of G.grid)for(const t of row){if(t&&(t.y!==t.r||t.x!==t.c||t.tw))return false}return true}
function waitSettle(){const g=G;return new Promise(res=>{const chk=()=>{if(G!==g||settled())res();else g.timers.push({t:g.clock+.016,res:chk})};chk()})}
function tween(t,dur){t.tw={fx:t.x,fy:t.y,t:0,d:dur}}

/* ===== 1手 ===== */
async function trySwap(a,b){
  if(G.busy||G.over||G.paused) return;
  const A=at(...a),B=at(...b); if(!A||!B) return;
  const g=G;
  G.busy=true; G.sel=null; G.hint=null; G.idle=0; sfx.swap();
  rawSwap(a,b); tween(A,.13); tween(B,.13); await waitSettle();
  if(G!==g) return;
  if(A.sp===2||B.sp===2){
    // ほしクッキー：相手と同じおやつを全部。ほしクッキー同士なら盤面ぜんぶ
    const other=A.sp===2?B:A, cells=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=G.grid[r][c];
      if(t===A||t===B||(other.sp===2?true:(t.t===other.t&&t.sp!==2))) cells.push([r,c])}
    sfx.egg(); shake();
    await resolve([a,b],cells);
  }else if(!(lineAt(...a)||lineAt(...b))){
    sfx.bad(); rawSwap(a,b); tween(A,.13); tween(B,.13); await waitSettle();
    if(G!==g) return;
    G.busy=false; return;
  }else await resolve([a,b],null);
  if(G!==g) return;
  G.busy=false; G.idle=0;
  if(G.stageClearPending) await stageClear();
  if(G===g&&G.time<=0) endGame();
}
async function resolve(moved,preset){
  const g=G, movedKeys=new Set(moved.map(([r,c])=>r*N+c));
  let first=true;
  while(G===g){
    const groups=preset?[]:findMatches();
    if(!preset&&!groups.length) break;
    const gone=new Map(), make=new Map();
    if(preset){
      preset.forEach(([r,c])=>gone.set(r*N+c,[r,c]));
      G.combo++; G.comboT=COMBO_WIN; G.maxCombo=Math.max(G.maxCombo,G.combo);
      const [er,ec]=moved[1]; addScore(150*preset.length,ec,er);
      preset=null;
    }
    // 2本のラインが重なったマス（L字・T字）
    const cnt=new Map();
    groups.forEach(gr=>gr.cells.forEach(([r,c])=>cnt.set(r*N+c,(cnt.get(r*N+c)||0)+1)));
    for(const gr of groups){
      G.combo++; G.comboT=COMBO_WIN; G.maxCombo=Math.max(G.maxCombo,G.combo);
      const len=gr.cells.length;
      let cr=0,cc=0; gr.cells.forEach(([r,c])=>{cr+=r;cc+=c}); cr/=len; cc/=len;
      addScore(100+(len-3)*120,cc,cr);
      if(len>=4){
        // 4つでボム、5つでほしクッキー。動かしたマスがあればそこに、なければ真ん中に
        const pick=(first&&gr.cells.find(([r,c])=>movedKeys.has(r*N+c)))||gr.cells.find(([r,c])=>cnt.get(r*N+c)>1)||gr.cells[len>>1];
        const k=pick[0]*N+pick[1], sp=len>=5?2:1;
        make.set(k,Math.max(make.get(k)||0,sp));
      }
      if(G.feverT<=0){G.fever=Math.min(100,G.fever+3+Math.min(G.combo,20)*.2+(len-3)*4); if(G.fever>=100) startFever()}
      for(const [r,c] of gr.cells) gone.set(r*N+c,[r,c]);
    }
    for(const [k,n] of cnt) if(n>1&&!make.has(k)) make.set(k,1);
    // ボムの爆発（3×3）。巻きこんだボムも連鎖
    const queue=[...gone.values()], blasted=new Set(), flying=new Map();
    let booms=0;
    while(queue.length){
      const [r,c]=queue.pop(), t=G.grid[r][c];
      if(!t||t.sp!==1||blasted.has(t.id)) continue;
      blasted.add(t.id); booms++; flying.set(r*N+c,[r,c]);
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        const rr=r+dr,cc=c+dc,n=at(rr,cc),k=rr*N+cc;
        if(!n||n.sp===2||gone.has(k)) continue;
        gone.set(k,[rr,cc]); queue.push([rr,cc]); addScore(40,cc,rr,true); if(!flying.has(k)) flying.set(k,[rr,cc,r,c]);
      }
      ring(c,r);
    }
    if(booms){sfx.boom(); shake(); if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){}}
    // できたボム・ほしクッキーの場所はコマを残す
    for(const k of make.keys()){const r=Math.floor(k/N),c=k%N,t=G.grid[r][c]; if(t&&blasted.has(t.id)&&t.sp===1) make.delete(k)}
    sfx.pop(G.combo);
    for(const [k,[r,c]] of gone){
      const t=G.grid[r][c]; if(!t) continue;
      if(t.t>=0){G.caught[t.t]++; if(G.quota[t.t]>0){G.quota[t.t]--; bumpQuota(t.t)}}
      if(t.gold){t.gold=false; goldBonus(c,r)}
      if(make.has(k)) continue;
      if(flying.has(k)){const f=flying.get(k); fling(t,f[2]==null?r:f[2],f[3]==null?c:f[3]); t.pop=1}
      else{t.pop=0; burst(c,r,t.t>=0?SWEETS[t.t].col:'#f3d27a')}
    }
    if(G.quota.every(q=>q<=0)) G.stageClearPending=true;
    renderHud();
    await wait(.2);
    if(G!==g) return;
    for(const [k,[r,c]] of gone){
      if(make.has(k)){const t=G.grid[r][c], sp=make.get(k); t.sp=sp; if(sp===2){t.t=-1; G.eggs++} else G.bombs++; t.grow=1; continue}
      G.grid[r][c]=null;
    }
    if(make.size) sfx.make();
    gravity();
    await waitSettle();
    first=false;
  }
  if(G===g&&!findMove()) await shuffle();
}
function addScore(base,c,r,quiet){
  const pts=Math.round(base*(1+Math.min(G.combo,60)*.1)*(G.feverT>0?2:1)/10)*10;
  G.score+=pts; if(!quiet) addText(`+${pts}`,c,r,INK);
}
function goldBonus(c,r){
  G.score+=500; sfx.gold();
  if(G.feverT<=0){G.time=Math.min(TIME_MAX,G.time+2); addText('+2秒',c,r+.5,'#b98a2f')}
  else addText('+500',c,r+.5,'#b98a2f');
}
function gravity(){
  for(let c=0;c<N;c++){
    let w=N-1;

function addText(s,c,r,col){G.texts.push({s,x:c+.5,y:r+.5,t:0,col})}

// ボムで弾け飛ぶおやつ：盤面の外まで飛んでいけるよう、画面いっぱいの別キャンバスに描く
const fxcv=document.createElement('canvas'), fxc=fxcv.getContext('2d');
fxcv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:5';
fxcv.setAttribute('aria-hidden','true'); document.body.appendChild(fxcv);
let flies=[];
function fling(t,br,bc){
  const rect=cv.getBoundingClientRect();
  const x=rect.left+(t.x+.5)*cell, y=rect.top+(t.y+.5)*cell;
  let dx=t.c-bc, dy=t.r-br; if(!dx&&!dy){dx=(Math.random()-.5)*.6;dy=-1}
  const len=Math.hypot(dx,dy)||1, sp=(6+Math.random()*5)*cell;
  flies.push({typ:t.t,x,y,vx:dx/len*sp+(Math.random()-.5)*cell*2,vy:dy/len*sp-(4+Math.random()*4)*cell,rot:0,vr:(Math.random()<.5?-1:1)*(6+Math.random()*10),t:0,life:1.1,s:1});
  if(!reduceMotion){
    const col=t.t>=0?SWEETS[t.t].col:'#f3d27a';
    for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,v=(2+Math.random()*4)*cell;
      flies.push({drop:true,col,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2*cell,t:0,life:.6+Math.random()*.3,r:cell*(.06+Math.random()*.07)})}
  }
}
function drawFlies(dt){
  const W=innerWidth,H=innerHeight,d=Math.min(devicePixelRatio||1,3);
  if(fxcv.width!==Math.round(W*d)||fxcv.height!==Math.round(H*d)){fxcv.width=Math.round(W*d);fxcv.height=Math.round(H*d)}
  if(!flies.length&&!fxcv._dirty) return;
  fxc.setTransform(d,0,0,d,0,0); fxc.clearRect(0,0,W,H); fxcv._dirty=flies.length>0;
  for(const f of flies){
    f.t+=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=22*cell*dt;
    fxc.globalAlpha=Math.max(0,Math.min(1,(f.life-f.t)/(f.life*.35)));
    if(f.drop){fxc.fillStyle=f.col;fxc.beginPath();fxc.arc(f.x,f.y,f.r,0,7);fxc.fill();continue}
    f.rot+=f.vr*dt; f.s=1+.25*Math.min(1,f.t*4);
    const sp=f.typ<0?eggSprite:sprites[f.typ], w=cell*.9*f.s;
    fxc.save();fxc.translate(f.x,f.y);fxc.rotate(f.rot);
    if(sp&&sp.width) fxc.drawImage(sp,-w/2,-w/2,w,w);
    fxc.restore();
  }
  fxc.globalAlpha=1;
  flies=flies.filter(f=>f.t<f.life&&f.y<H+cell*2);
}
function ring(c,r){G.fx.push({ring:true,x:c+.5,y:r+.5,t:0,life:.35})}

/* ===== 描画 ===== */
const cv=$('cv'), ctx=cv.getContext('2d');
let size=320, cell=40, dpr=1, sprites=[], eggSprite=null, badgeSprite=null;
const toImg=svg=>{const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);return im};
const svgImgs=SWEETS.map((a,i)=>toImg(svgOf(i,'width="200" height="200"')));
const eggImg=toImg(svgOf(-1,'width="200" height="200"')), badgeImg=toImg(BOMB_BADGE.replace('<svg ','<svg width="200" height="200" '));
function bake(im,px){const c=document.createElement('canvas');c.width=c.height=px;
  try{if(im.complete&&im.naturalWidth)c.getContext('2d').drawImage(im,0,0,px,px)}catch(e){} return c}
function bakeSprites(){
  const px=Math.max(8,Math.round(cell*.9*dpr));
  sprites=svgImgs.map(im=>bake(im,px)); eggSprite=bake(eggImg,px); badgeSprite=bake(badgeImg,Math.round(cell*dpr));
}
[...svgImgs,eggImg,badgeImg].forEach(im=>im.addEventListener('load',bakeSprites));
function resize(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  size=r.width; cell=size/N; dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr); bakeSprites();
}
window.addEventListener('resize',resize);
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const fev=G&&G.feverT>0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    ctx.fillStyle=(r+c)%2?(fev?'#f8e4bd':'#f1e9dc'):(fev?'#fcecd0':'#fbf6ee');
    ctx.fillRect(c*cell,r*cell,cell,cell);
  }
  if(!G||!G.grid) return;
  if(G.sel){ctx.fillStyle='rgba(227,194,107,.55)';rrect(ctx,G.sel[1]*cell+2,G.sel[0]*cell+2,cell-4,cell-4,cell*.22);ctx.fill()}
  const hintOn=G.hint&&!G.busy, wob=Math.sin(G.clock*10);
  for(const row of G.grid)for(const t of row){
    if(!t||t.y<-1.2) continue;
    let s=t.s, a=1;
    if(t.pop>=0){const p=Math.min(1,t.pop/.2);s=1+.35*p;a=1-p}
    if(t.grow>0) s+=t.grow*.3;
    let oy=0;
    if(hintOn&&G.hint.some(([r,c])=>r===t.r&&c===t.c)){s+=wob*.06;oy=wob*cell*.04}
    const sq=t.sq>0?t.sq:0;
    const w=cell*.9*s*(1+sq*.12), h=cell*.9*s*(1-sq*.12);
    const cx=(t.x+.5)*cell, cy=(t.y+.5)*cell+oy+(cell*.9*s-h)/2;
    ctx.globalAlpha=a;
    if(t.gold&&t.pop<0){ // キラキラおやつ
      const gr=ctx.createRadialGradient(cx,cy,cell*.1,cx,cy,cell*.55);
      gr.addColorStop(0,'rgba(255,236,160,.95)');gr.addColorStop(1,'rgba(255,236,160,0)');
      ctx.fillStyle=gr;ctx.fillRect(cx-cell*.55,cy-cell*.55,cell*1.1,cell*1.1);
    }
    if(t.sp===1&&t.pop<0&&badgeSprite){
      ctx.save();ctx.translate(cx,cy);ctx.rotate(G.clock*1.5);ctx.drawImage(badgeSprite,-cell/2,-cell/2,cell,cell);ctx.restore();
    }
    const sp=t.t<0?eggSprite:sprites[t.t];
    if(sp&&sp.width) ctx.drawImage(sp,cx-w/2,cy-h/2,w,h);
    else{ctx.fillStyle=t.t<0?'#fff3c9':SWEETS[t.t].col;ctx.beginPath();ctx.arc(cx,cy,w*.42,0,7);ctx.fill()}
    if(t.sp===1&&t.pop<0){ // ボムのしるし（小さな爆弾）
      const bx=cx+cell*.28, by=cy-cell*.26, R=cell*.11, k=(Math.sin(G.clock*12)+1)/2;
      ctx.strokeStyle='#9a7a5f';ctx.lineWidth=cell*.04;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx+R*.5,by-R*.7);ctx.quadraticCurveTo(bx+R*.9,by-R*1.6,bx+R*1.5,by-R*1.5);ctx.stroke();
      ctx.fillStyle=INK;ctx.beginPath();ctx.arc(bx,by,R,0,7);ctx.fill();
      ctx.fillStyle=k>.5?'#f2a65a':'#f3c24f';ctx.beginPath();ctx.arc(bx+R*1.5,by-R*1.5,R*(.35+.25*k),0,7);ctx.fill();
    }
    if(t.gold&&t.pop<0){ // きらり
      const k=(Math.sin(G.clock*6+t.id)+1)/2, sx=cx-cell*.28, sy=cy-cell*.28, L=cell*(.06+.08*k);
      ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx-L,sy);ctx.lineTo(sx+L,sy);ctx.moveTo(sx,sy-L);ctx.lineTo(sx,sy+L);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  for(const p of G.fx){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    if(p.ring){ctx.strokeStyle='#f3b65f';ctx.lineWidth=cell*.12;ctx.beginPath();ctx.arc(p.x*cell,p.y*cell,cell*(.4+p.t/p.life*1.2),0,7);ctx.stroke();continue}
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x*cell,p.y*cell,p.sz*cell,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  ctx.font=`${Math.round(cell*.36)}px "Mochiy Pop One","Zen Maru Gothic",sans-serif`;

    const y=(tx.y-tx.t*.9)*cell;

}

/* ===== ループ ===== */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000||0); last=now;
  if(G&&!G.paused&&!$('play').hidden) step(dt);
  if(!$('play').hidden) draw();
  drawFlies(G&&G.paused?0:dt);
}
function step(dt){
  G.clock+=dt;
  const due=G.timers.filter(x=>x.t<=G.clock); G.timers=G.timers.filter(x=>x.t>G.clock); due.forEach(x=>x.res());
  for(const row of G.grid)for(const t of row){
    if(!t) continue;
    if(t.tw){t.tw.t+=dt;const p=Math.min(1,t.tw.t/t.tw.d),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      t.x=t.tw.fx+(t.c-t.tw.fx)*e;t.y=t.tw.fy+(t.r-t.tw.fy)*e;if(p>=1){t.x=t.c;t.y=t.r;delete t.tw}}
    else if(t.y<t.r){t.vy=Math.min(24,t.vy+70*dt);t.y+=t.vy*dt;if(t.y>=t.r){t.y=t.r;t.vy=0;t.sq=1}}
    else if(t.y>t.r){t.y=t.r}
    if(t.x!==t.c&&!t.tw) t.x=t.c;
    if(t.sq>0) t.sq=Math.max(0,t.sq-dt*6);
    if(t.grow>0) t.grow=Math.max(0,t.grow-dt*4);
    if(t.pop>=0) t.pop+=dt;
  }
  G.fx.forEach(p=>{p.t+=dt;if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=9*dt}}); G.fx=G.fx.filter(p=>p.t<p.life);
  G.texts.forEach(x=>x.t+=dt); G.texts=G.texts.filter(x=>x.t<.9);
  if(G.over) return;
  if(G.feverT>0){G.feverT-=dt;G.fever=Math.max(0,100*G.feverT/FEVER_TIME);
    if(G.feverT<=0){G.feverT=0;G.fever=0;$('board').classList.remove('fev');$('feverBar').classList.remove('on');bgmPlay('normal')}}
  // 時間：ステージの切りかわりとフィーバー中は止まる
  if(G.feverT<=0&&G.banner<=0&&!G.stageClearPending){
    G.time=Math.max(0,G.time-dt*drainFor(G.stage));
    if(G.time<10&&Math.ceil(G.time)!==G.tick){G.tick=Math.ceil(G.time);sfx.tick()}
  }
  if(G.banner>0) G.banner-=dt;
  // コンボは消しつづけている間はつながる
  if(!G.busy&&G.comboT>0){G.comboT-=dt;if(G.comboT<=0){G.comboT=0;G.combo=0}}
  if(!G.busy){G.idle+=dt;if(G.idle>5&&!G.hint)G.hint=findMove()}
  if(G.time<=0&&!G.busy) endGame();
  renderHud();
}
requestAnimationFrame(frame);

let drag=null;
function cellAt(e){const r=cv.getBoundingClientRect();const c=Math.floor((e.clientX-r.left)/r.width*N),w=Math.floor((e.clientY-r.top)/r.height*N);
  return c>=0&&c<N&&w>=0&&w<N?[w,c]:null}
cv.addEventListener('pointerdown',e=>{
  ac(); if(!G||G.over||G.paused) return;

  drag={p,x:e.clientX,y:e.clientY,moved:false};

  if(!drag||drag.moved) return;

  if(Math.max(Math.abs(dx),Math.abs(dy))<th) return;

  const [r,c]=drag.p, d=Math.abs(dx)>Math.abs(dy)?[0,Math.sign(dx)]:[Math.sign(dy),0];
  const q=[r+d[0],c+d[1]];

  for(let y=0;y<H;y+=60)for(let x=0;x<W;x+=60) if(((x+y)/60)%2){c.fillStyle='#F1E9DC';c.fillRect(x,y,60,60)}
  c.fillStyle='#FFFDF8'; rrect(c,60,60,W-120,H-120,56); c.fill(); c.lineWidth=8; c.strokeStyle='#5B4D45'; c.stroke();
  c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='#8E8077'; c.font='44px '+POP; c.fillText('ころころおやつ',W/2,140);
  const ims=await Promise.all(SWEETS.map((a,i)=>svgImg(svgOf(i,'width="200" height="200"'))));
  if(ims[S.fav]&&S.total) c.drawImage(ims[S.fav],W/2-110,180,220,220);
  c.fillStyle='#8E8077'; c.font=BODY; c.fillText('わたしの称号は…',W/2,440);

  c.font='34px '+POP; const lv=`ステージ ${S.reached} までいけた！`, lw=c.measureText(lv).width+56;
  rrect(c,W/2-lw/2,580,lw,62,31); c.fillStyle='#E8877F'; c.fill(); c.fillStyle='#FFFDF8'; c.fillText(lv,W/2,612);
  c.fillStyle='#5B4D45'; c.font='76px '+POP; c.fillText(`${S.score.toLocaleString()} 点`,W/2,712);
  c.fillStyle='#8E8077'; c.font=BODY; c.fillText(`さいだい ${S.combo} コンボ ・ ボム ${S.bombs} ・ ほしクッキー ${S.eggs}`,W/2,782,W-200);
  const sz=96, gp=18, x0=W/2-(7*sz+6*gp)/2;
  ims.forEach((im,i)=>{if(im)c.drawImage(im,x0+i*(sz+gp),818,sz,sz);
    c.fillStyle='#5B4D45';c.font='30px '+POP;c.fillText(String(S.caught[i]),x0+i*(sz+gp)+sz/2,942)});
  c.fillStyle='#8E8077'; c.font='600 26px "Zen Maru Gothic",sans-serif'; c.fillText('#ころころおやつ ・ runococco.github.io/picoruno.',W/2,994);
  return cv2;
}
let shareBlob=null;
async function openShare(){
  $('shareModal').hidden=false; $('shareImg').removeAttribute('src'); shareBlob=null;
  const cv2=await makeShareImage();
  $('shareImg').src=cv2.toDataURL('image/png');
  shareBlob=await new Promise(r=>cv2.toBlob(r,'image/png'));
}
async function doShare(){
  if(!shareBlob) return;
  const file=new File([shareBlob],'korokoro-stage'+lastShare.reached+'.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:lastShare.text+'\n'+GAME_URL});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(shareBlob), a=document.createElement('a');
  a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); toast('保存されないときは画像を長押ししてね');
}
async function copyText(){
  const t=lastShare.text+'\n'+GAME_URL;
  try{await navigator.clipboard.writeText(t);toast('コピーしました')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('コピーしました')}catch(_){toast('コピーできませんでした')}ta.remove()}
}
let toastT=0;
function toast(s){const t=$('toast');t.textContent=s;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
