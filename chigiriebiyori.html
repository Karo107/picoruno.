<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#stage'),ctx=cv.getContext('2d'),wrap=$('#wrap'),box=$('#box');
const DPR=Math.min(2,window.devicePixelRatio||1);
const RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=320;
const BOARDS=[{n:'生成',c:'#ebe7db'},{n:'白鼠',c:'#d8d9d3'},{n:'桜',c:'#f0dcdc'},{n:'若竹',c:'#cfdcc4'},{n:'空色',c:'#d3e0ea'},{n:'山吹',c:'#efd9a8'},
 {n:'鉛',c:'#5c5f5c'},{n:'藍',c:'#22344f'},{n:'紺',c:'#1c2637'},{n:'臙脂',c:'#5a2228'},{n:'墨',c:'#1f2120'},
 {n:'和紙',c:'#efeadf',k:'washi'},{n:'金砂子',c:'#f1ead7',k:'gold'},{n:'木目',c:'#c39566',k:'wood'},{n:'畳',c:'#b8b683',k:'tatami'},{n:'カッターマット',c:'#3f6e5a',k:'mat'},{n:'黒板',c:'#2d3b35',k:'chalk'}];

/* ---------- 紙の質感・素材・台紙 ---------- */
const tex=(()=>{const t=document.createElement('canvas');t.width=t.height=256;const g=t.getContext('2d');
 const id=g.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=Math.random()>.5?255:0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()*13}
 g.putImageData(id,0,0);
 for(let k=0;k<80;k++){let x=Math.random()*256,y=Math.random()*256,a=Math.random()*6.28;g.beginPath();g.moveTo(x,y);
  for(let s=0;s<7;s++){a+=(Math.random()-.5)*.9;x+=Math.cos(a)*5;y+=Math.sin(a)*5;g.lineTo(x,y)}
  g.strokeStyle=k%3?'rgba(255,255,255,.2)':'rgba(0,0,0,.06)';g.lineWidth=.5+Math.random()*.7;g.stroke()}
 return t})();
const patCache=new WeakMap();
function texPat(g){let p=patCache.get(g);if(!p){p=g.createPattern(tex,'repeat');patCache.set(g,p)}return p}
function paintTex(g,x,y,w,h,a){g.save();g.globalAlpha=a;g.fillStyle=texPat(g);g.fillRect(x,y,w,h);g.restore()}

/* ---------- 紙の材質 ---------- */
const MATS=[
 {id:'ori',n:'折り紙',d:'つるっとした、いつもの無地の折り紙',items:[['赤','#d7263d'],['朱','#e8532c'],['だいだい','#f08a24'],['山吹','#f2b134'],['黄','#f4d23c'],['レモン','#ece27a'],
  ['黄緑','#a6c84a'],['緑','#3c9b54'],['深緑','#1f6b45'],['青緑','#2a9d8f'],['水色','#6cc3e0'],['空','#4a90d1'],['青','#2c5aa8'],['群青','#3a4fa0'],['紺','#1e2e5c'],
  ['藤','#a68ccc'],['紫','#6b4a9c'],['赤紫','#b23a7a'],['ピンク','#f28fb0'],['桃','#f6b8c8'],['肌','#f3cfae'],['茶','#8a5a3c'],['灰','#9a9da0'],['黒','#222222'],['白','#f7f6f2']]},
 {id:'kusumi',n:'やさしい和紙',d:'くすんだ色の、ふんわり透ける和紙',items:[['コーラル','#ec8b7e'],['セージ','#9eae8e'],['バター','#f1d48c'],['ローズ','#e4a9a3'],['ピーチ','#f2b98f'],['ミント','#b4cdb4'],['ラベンダー','#b7a8c8'],['ミスト','#a9c3d1'],['からし','#d7b25c'],['ミルクティー','#c9a98c'],['ココア','#9c7a64'],['クリーム','#f2e6c8']]},
 {id:'washi',n:'和紙',d:'やわらかな繊維が見える、手すきの紙',items:[['紅','#a8322d'],['藍','#24406a'],['墨','#272727'],['鶯','#6b7a3a'],['山吹','#d39a2c'],['桜','#e2b1b4'],['生成','#efe9da']]},
 {id:'unryu',n:'雲竜紙',d:'長い繊維が雲のように流れる和紙',items:[['白','#f2efe6'],['薄紅','#e3b3ae'],['浅葱','#7fb0b6'],['墨','#3a3a3a']]},
 {id:'chiri',n:'ちりめん紙',d:'細かいしぼのある、布のような紙',items:[['朱','#c8503a'],['萌黄','#8ea64a'],['紫','#6c4f86'],['紺','#25324d']]},
 {id:'metal',n:'金銀の紙',d:'光をかえす、きらりとした紙',items:[['金','gold'],['銀','silver'],['銅','copper'],['玉虫','tama']]},
 {id:'holo',n:'オーロラ紙',d:'見る向きで色が変わる、虹色の紙',items:[['オーロラ','aurora'],['夜光','night']]},
 {id:'trace',n:'トレーシングペーパー',d:'向こうがうっすら透ける紙',items:[['白','#ffffff'],['水色','#bfe0f0'],['桃','#f6c7cf'],['若草','#d3e8b0']]},
 {id:'kraft',n:'クラフト紙',d:'茶色くざらっとした包み紙',items:[['茶','#a57c52'],['こげ茶','#6e4c33'],['白','#e8dfcf']]}];
MATS.forEach(m=>m.items=m.items.map(([n,c,p])=>({n,c,p,mat:m})));
const METAL={gold:['#7d5e1e','#d9b65a','#f7e7a8','#b8902f','#efd27c','#8a6a24'],silver:['#7b7f84','#d7dadd','#f7f8f9','#a4a8ad','#e4e6e8','#8a8e93'],
 copper:['#7a3f22','#c97a4f','#f2c3a0','#a55a35','#e3a07a','#7f4428'],tama:['#1f4a5a','#3f8f9c','#a8e0d8','#2f6f7c','#7fc6c0','#1f4a5a']};
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function walk(g,S,n,len,wd,cols){for(let i=0;i<n;i++){let x=Math.random()*S,y=Math.random()*S,a=Math.random()*6.28;g.beginPath();g.moveTo(x,y);const st=len/8;
 for(let k=0;k<8;k++){a+=(Math.random()-.5)*.6;x+=Math.cos(a)*st*(.6+Math.random()*.8);y+=Math.sin(a)*st;g.lineTo(x,y)}g.strokeStyle=cols[i%cols.length];g.lineWidth=wd*(.5+Math.random());g.stroke()}}
function paintPaper(g,S,it){const m=it.mat.id,u=S/1200,A=u*u;g.save();g.lineCap='round';
 if(m==='metal'||m==='holo'){const st=m==='metal'?METAL[it.c]:(it.c==='aurora'?['#f6c6d8','#c9d8f7','#bff0e2','#f8eec0','#e3c8f5','#bfe7f7','#f6c6d8']:['#1d2340','#3a2f6b','#1f5d6b','#5a2f63','#1d2340','#2f4f7a']);
  const gr=g.createLinearGradient(0,0,S,S);st.forEach((c,i)=>gr.addColorStop(i/(st.length-1),c));g.fillStyle=gr;g.fillRect(0,0,S,S);
  const g2=g.createLinearGradient(S,0,0,S);[[0,0],[.35,.3],[.45,0],[.7,.2],[.8,0],[1,0]].forEach(([o,a])=>g2.addColorStop(o,`rgba(255,255,255,${a})`));g.fillStyle=g2;g.fillRect(0,0,S,S);
  if(m==='metal'){for(let y=0;y<S;y+=Math.max(1,2*u)){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.04)';g.fillRect(0,y,S,Math.max(.5,u))}}
  else for(let i=0;i<Math.max(20,900*A);i++){g.fillStyle=`hsla(${Math.random()*360},90%,85%,${.3+Math.random()*.4})`;const z=Math.max(1,2*u);g.fillRect(Math.random()*S,Math.random()*S,z,z)}
  g.restore();return}
 if(m==='trace'){g.fillStyle=rgba(it.c,.5);g.fillRect(0,0,S,S);paintTex(g,0,0,S,S,.6);g.restore();return}
 g.fillStyle=it.c;g.fillRect(0,0,S,S);
 if(m==='ori'){const gs=g.createLinearGradient(0,0,S,S);gs.addColorStop(0,'rgba(255,255,255,.1)');gs.addColorStop(.5,'rgba(255,255,255,0)');gs.addColorStop(1,'rgba(0,0,0,.05)');g.fillStyle=gs;g.fillRect(0,0,S,S)}
 else if(m==='kusumi'){const gs=g.createLinearGradient(0,0,S,S);gs.addColorStop(0,'rgba(255,255,255,.10)');gs.addColorStop(1,'rgba(90,60,40,.06)');g.fillStyle=gs;g.fillRect(0,0,S,S);
  for(let i=0;i<Math.max(10,70*A);i++){const x=Math.random()*S,y=Math.random()*S,r=S*(.04+Math.random()*.1),gr=g.createRadialGradient(x,y,0,x,y,r);
   gr.addColorStop(0,Math.random()<.65?'rgba(255,255,255,.12)':'rgba(90,50,30,.06)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
  paintTex(g,0,0,S,S,1);walk(g,S,Math.max(14,420*A),S*.06,Math.max(.4,1.2*u),['rgba(255,255,255,.30)','rgba(255,255,255,.18)','rgba(110,70,50,.09)']);
  walk(g,S,Math.max(4,60*A),S*.16,Math.max(.4,.9*u),['rgba(255,255,255,.22)','rgba(110,70,50,.07)'])}
 else if(m==='washi'){for(let i=0;i<Math.max(8,40*A);i++){const x=Math.random()*S,y=Math.random()*S,r=S*(.05+Math.random()*.12),gr=g.createRadialGradient(x,y,0,x,y,r);
   gr.addColorStop(0,Math.random()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
  paintTex(g,0,0,S,S,1);walk(g,S,Math.max(12,320*A),S*.04,Math.max(.4,1.1*u),['rgba(255,255,255,.22)','rgba(255,255,255,.14)','rgba(0,0,0,.06)'])}
 else if(m==='unryu'){paintTex(g,0,0,S,S,.8);walk(g,S,Math.max(10,90*A),S*.22,Math.max(.6,2.6*u),['rgba(255,255,255,.5)','rgba(255,255,255,.32)','rgba(250,246,236,.42)'])}
 else if(m==='chiri'){paintTex(g,0,0,S,S,.7);const n=Math.max(30,2200*A);for(let i=0;i<n;i++){const x=Math.random()*S,y=Math.random()*S,l=S*(.008+Math.random()*.016);
   g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+l/2,y+(Math.random()-.5)*l*.6,x+l,y+(Math.random()-.5)*l*.3);g.strokeStyle=i%2?'rgba(0,0,0,.12)':'rgba(255,255,255,.12)';g.lineWidth=Math.max(.5,1.4*u);g.stroke()}}
 else if(m==='gayo'){paintTex(g,0,0,S,S,.45)}
 else if(m==='kraft'){paintTex(g,0,0,S,S,1);const n=Math.max(40,3000*A);for(let i=0;i<n;i++){g.fillStyle=Math.random()<.7?'rgba(60,35,15,.22)':'rgba(255,240,210,.18)';
   g.fillRect(Math.random()*S,Math.random()*S,Math.max(1,(1+Math.random()*2)*u),Math.max(1,(1+Math.random()*2)*u))}
  walk(g,S,Math.max(10,200*A),S*.03,Math.max(.4,u),['rgba(60,35,15,.15)','rgba(255,240,210,.12)'])}
 g.restore()}
function makePaper(it,S){const c=document.createElement('canvas');c.width=c.height=S;paintPaper(c.getContext('2d'),S,it);return c}

/* ---------- 台紙 ---------- */
function paintBoard(g,S,b){const u=S/1000,A=u*u;g.fillStyle=b.c;g.fillRect(0,0,S,S);g.save();g.lineCap='round';
 if(b.k==='wood'){for(let y=-20*u;y<S+20*u;){const h=(3+Math.random()*9)*u,ph=Math.random()*6,f=(.004+Math.random()*.004)/u,amp=(4+Math.random()*10)*u;g.beginPath();
   for(let x=0;x<=S;x+=6*u){const yy=y+Math.sin(x*f+ph)*amp+Math.sin(x*f*3.1+ph*2)*amp*.25;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.strokeStyle=`rgba(90,52,22,${.08+Math.random()*.22})`;g.lineWidth=Math.max(.6,(.6+Math.random()*1.6)*u);g.stroke();y+=h}
  paintTex(g,0,0,S,S,.5)}
 else if(b.k==='tatami'){const st=Math.max(2,S/170);for(let x=0;x<S;x+=st){g.fillStyle=(Math.floor(x/st))%2?'rgba(255,255,230,.10)':'rgba(70,70,20,.10)';g.fillRect(x,0,st*.55,S)}
  for(let y=0;y<S;y+=S/40){g.fillStyle='rgba(60,60,20,.06)';g.fillRect(0,y,S,Math.max(1,1.5*u))}paintTex(g,0,0,S,S,.4);
  g.fillStyle='#2b3448';g.fillRect(0,0,S,S*.035);g.fillRect(0,S*.965,S,S*.035)}
 else if(b.k==='mat'){paintTex(g,0,0,S,S,.4);const c=S/20;for(let i=0;i<=20;i++){g.strokeStyle=i%5?'rgba(235,245,235,.18)':'rgba(235,245,235,.42)';g.lineWidth=Math.max(.6,(i%5?1:1.6)*u);
   g.beginPath();g.moveTo(i*c,0);g.lineTo(i*c,S);g.moveTo(0,i*c);g.lineTo(S,i*c);g.stroke()}}
 else if(b.k==='chalk'){paintTex(g,0,0,S,S,.6);for(let i=0;i<Math.max(6,24*A);i++){const x=Math.random()*S,y=Math.random()*S,r=S*(.08+Math.random()*.2),gr=g.createRadialGradient(x,y,0,x,y,r);
   gr.addColorStop(0,'rgba(255,255,255,.05)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}}
 else if(b.k==='gold'){paintTex(g,0,0,S,S,.7);const n=Math.max(40,900*A);for(let i=0;i<n;i++){const band=Math.random()<.6,x=Math.random()*S,y=band?(Math.random()<.5?Math.random()*S*.22:S-Math.random()*S*.22):Math.random()*S;
   const z=(1.5+Math.random()*(band?7:3.5))*u;g.save();g.translate(x,y);g.rotate(Math.random()*3);g.fillStyle=['#c9a24a','#e8c96a','#b88c35','#f3dc8e'][i%4];g.globalAlpha=.55+Math.random()*.45;g.fillRect(-z/2,-z/2,z,z*(.5+Math.random()*.8));g.restore()}}
 else if(b.k==='washi'){paintTex(g,0,0,S,S,1);walk(g,S,Math.max(12,260*A),S*.05,Math.max(.4,1.1*u),['rgba(255,255,255,.35)','rgba(180,170,150,.12)'])}
 else paintTex(g,0,0,S,S,.7);
 g.restore()}
const bCache=new Map();
function boardImg(b,S){const k=b.n+'|'+Math.round(S);let c=bCache.get(k);if(!c){c=document.createElement('canvas');c.width=c.height=Math.round(S);paintBoard(c.getContext('2d'),c.width,b);
 if(bCache.size>6)bCache.clear();bCache.set(k,c)}return c}


/* ---------- 柄 ---------- */
function drawPattern(g,def,S){const c=def.c;
 if(def.p==='wave'){const R=S/15;for(let row=0,y=-R;y<S+R*2;row++,y+=R/2)for(let x=(row%2?R:0)-R;x<S+R*2;x+=R*2){
  g.beginPath();g.arc(x,y,R,0,7);g.fillStyle=c;g.fill();for(const f of[.86,.66,.46,.26]){g.beginPath();g.arc(x,y,R*f,0,7);g.strokeStyle='rgba(240,238,230,.85)';g.lineWidth=R*.06;g.stroke()}}}
 else if(def.p==='check'){const q=S/12;for(let y=0;y<12;y++)for(let x=0;x<12;x++){g.fillStyle=(x+y)%2?'#1f2a24':c;g.fillRect(x*q,y*q,q+1,q+1)}}
 else if(def.p==='dots'){const q=S/15;g.fillStyle='rgba(246,243,236,.95)';for(let r=0;r<17;r++)for(let k=0;k<17;k++){g.beginPath();g.arc(k*q+(r%2?q/2:0),r*q,q*.16,0,7);g.fill()}}
 else if(def.p==='petal'){let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;const q=S/9;
  for(let i=0;i<70;i++){const x=rnd()*S,y=rnd()*S,r=q*(.12+rnd()*.12),a=rnd()*6.28;g.save();g.translate(x,y);g.rotate(a);
   g.fillStyle=i%3?'rgba(255,255,255,.75)':'rgba(176,60,72,.55)';for(let p=0;p<5;p++){g.rotate(Math.PI*2/5);g.beginPath();g.ellipse(0,-r,r*.45,r*.7,0,0,7);g.fill()}g.restore()}}
 else drawPattern2(g,def,S)}

const LT='rgba(246,243,236,.88)';
function rng(seed){return()=>(seed=(seed*9301+49297)%233280)/233280}
function drawPattern2(g,def,S){const p=def.p,c=def.c;g.save();
 if(p==='asa'){const a=S/6,h=a*Math.sqrt(3)/2;g.strokeStyle=LT;g.lineWidth=Math.max(.6,S/300);g.lineJoin='round';g.beginPath();
  for(let j=-1;j*h<S+h;j++){const off=Math.abs(j)%2?a/2:0;for(let i=-2;i*a<S+a;i++){const P1={x:i*a+off,y:j*h},P2={x:P1.x+a,y:P1.y},Q={x:P1.x+a/2,y:P1.y+h},Q2={x:Q.x+a,y:Q.y};
   for(const T of[[P1,P2,Q],[P2,Q2,Q]]){const cx=(T[0].x+T[1].x+T[2].x)/3,cy=(T[0].y+T[1].y+T[2].y)/3;g.moveTo(T[0].x,T[0].y);g.lineTo(T[1].x,T[1].y);g.lineTo(T[2].x,T[2].y);g.lineTo(T[0].x,T[0].y);
    for(const V of T){g.moveTo(cx,cy);g.lineTo(V.x,V.y)}}}}g.stroke()}
 else if(p==='shippo'){const s=S/7,r=s/Math.SQRT2;g.strokeStyle=LT;g.lineWidth=Math.max(.7,S/220);
  for(let i=-1;i<9;i++)for(let j=-1;j<9;j++){g.beginPath();g.arc(i*s,j*s,r,0,7);g.stroke()}
  g.fillStyle=LT;for(let i=0;i<9;i++)for(let j=0;j<9;j++){g.beginPath();g.arc(i*s+s/2,j*s+s/2,s*.07,0,7);g.fill()}}

function drawThemeTag(g,S){const ff=getComputedStyle(document.body).getPropertyValue('--f-disp'),fb=getComputedStyle(document.body).getPropertyValue('--f-body');
 const x=S*.045,y=S*.045,z=Math.round(S*.042),zs=Math.round(S*.022);g.save();g.font=`600 ${z}px ${ff}`;const tw=g.measureText(C.theme).width;
 const pad=S*.018,bw=pad*2+zs*2.6+tw,bh=z+pad*1.6;g.fillStyle='rgba(251,248,240,.88)';g.shadowColor='rgba(60,40,20,.14)';g.shadowBlur=S*.01;g.shadowOffsetY=S*.003;
 g.beginPath();g.roundRect(x,y,bw,bh,bh*.18);g.fill();g.shadowColor='transparent';
 g.fillStyle='#b5302b';g.font=`700 ${zs}px ${fb}`;g.textBaseline='middle';g.fillText('お題',x+pad,y+bh/2);
 g.fillStyle='#2b2723';g.font=`600 ${z}px ${ff}`;g.fillText(C.theme,x+pad+zs*2.6,y+bh/2+z*.04);g.restore()}
function makeSaveImg(){const S=1200,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');drawBoard(g,S,false,saveTheme);$('#outImg').src=c.toDataURL('image/png')}
const saveOpt=$('#saveOpt');
saveOpt.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{saveTheme=b.dataset.t==='1';saveOpt.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));makeSaveImg()}));
$('#imgBtn').addEventListener('click',()=>{saveOpt.hidden=!C.theme;makeSaveImg();$('#modal').hidden=false});
$('#closeModal').addEventListener('click',()=>{$('#modal').hidden=true});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
$('#undoBtn').addEventListener('click',undo);
function startOver(){if(!C.pieces.length&&!C.tray.length&&!C.torn)return;pushUndo();C.pieces=[];C.tray=[];C.sel=null;C.drawing=null;C.sheet=makeSheet(C.paper);C.torn=0;C.mode=C.mode==='paste'?'brush':C.mode;parts=[];toast('最初からにしました');updateUI();req()}
$('#resetBtn').addEventListener('click',startOver);$('#redoBtn').addEventListener('click',redo);

function updateUI(){const pk=C.phase==='pick';pick.hidden=!pk;box.hidden=pk;$('#side').hidden=pk;$('#paperChip').hidden=pk;boardBtn.hidden=pk;$('#imgBtn').hidden=pk;if(pk)setPop(false);
 modeSeg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===C.mode));$('.trayw').hidden=C.mode==='brush'&&!C.tray.length;
 const pc=$('#pcount');pc.hidden=!C.pieces.length;pc.textContent=C.pieces.length;
 $('#boardRow').querySelectorAll('.bcard').forEach(b=>b.setAttribute('aria-pressed',b.bd===C.board));$('#boardName').textContent=C.board.n;
 if(lastBoard!==C.board){lastBoard=C.board;$('#boardThumb').src=boardImg(C.board,52).toDataURL()}
 $('#undoBtn').disabled=!C.hist.length;$('#resetBtn').disabled=!C.pieces.length&&!C.tray.length&&!C.torn;$('#redoBtn').disabled=!C.fut.length;buildPanel();if(!tdrag)buildTray()}
let tt=0;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600)}
document.addEventListener('keydown',e=>{if(document.activeElement===sealIn)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo()}});

/* はじめは ちりめん紙・朱 をちぎるところから */
C.paper=MATS.find(m=>m.id==='chiri').items.find(i=>i.n==='朱');C.sheet=makeSheet(C.paper);setPaperChip();
updateUI();resize();

})();
</script>

<script>
document.addEventListener('contextmenu',e=>{if(e.target.id!=='outImg')e.preventDefault()});
document.addEventListener('selectstart',e=>{const t=e.target.nodeType===1?e.target:e.target.parentElement;if(!(t&&t.closest('input,textarea')))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG'&&e.target.id!=='outImg')e.preventDefault()});
</script>
<script>
/* ピンチや2回タップで画面が拡大されないように */
(()=>{const no=e=>e.preventDefault();
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,no,{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('dblclick',no,{passive:false});})();
</script>

</html>
